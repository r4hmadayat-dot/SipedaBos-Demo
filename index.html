<script>window.__CODEGS="/**\n * SIPEDABOS - Backend\n * Menangani routing dan akses data Spreadsheet\n */\n\nfunction doGet() {\n  const out = HtmlService.createTemplateFromFile('Index').evaluate()\n    .setTitle('SIPEDABOS - Sistem Informasi BOS')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n  pasangFaviconKe_(out);\n  return out;\n}\n\n/* =====================================================================\n * IKON APLIKASI (ikon tab browser) dari \"Logo aplikasi\" yang diunggah\n * - Logo disalin ke Google Drive (folder data sekolah) agar punya alamat URL,\n *   karena ikon tab browser tidak bisa memakai gambar langsung dari sheet.\n * - Memakai logo aplikasi milik spreadsheet utama (tempat aplikasi terpasang).\n * ===================================================================== */\nfunction pasangFaviconKe_(out) {\n  try {\n    const p = props_();\n    let url = p.getProperty('FAVICON_URL') || '';\n    if (!url && p.getProperty('FAVICON_CEK') !== '1') {\n      p.setProperty('FAVICON_CEK', '1');\n      url = perbaruiFavicon_() || '';\n    }\n    if (!url) return;\n    const id = p.getProperty('FAVICON_ID');\n    const calon = [url, 'https://lh3.googleusercontent.com/d/' + id + '=s128?ext=.png'];\n    for (let i = 0; i < calon.length; i++) {\n      try { out.setFaviconUrl(calon[i]); return; } catch (e) {}\n    }\n  } catch (e) {}\n}\n\nfunction perbaruiFavicon_(dataUrl) {\n  const p = props_();\n  if (dataUrl === undefined) {\n    const simpan = CTX_;\n    CTX_ = { ss: SpreadsheetApp.getActiveSpreadsheet() };\n    try { const r = getAset_(); dataUrl = (r.aset && r.aset.logo_aplikasi) || ''; } finally { CTX_ = simpan; }\n  }\n  const lama = p.getProperty('FAVICON_ID');\n  if (lama) { try { DriveApp.getFileById(lama).setTrashed(true); } catch (e) {} }\n  p.deleteProperty('FAVICON_ID'); p.deleteProperty('FAVICON_URL');\n  const m = /^data:(image\\/[a-z0-9.+-]+);base64,(.*)$/i.exec(String(dataUrl || ''));\n  if (!m) return '';\n  const mime = m[1].toLowerCase();\n  const ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp', 'image/x-icon': 'ico', 'image/vnd.microsoft.icon': 'ico', 'image/svg+xml': 'svg' }[mime] || 'png';\n  const blob = Utilities.newBlob(Utilities.base64Decode(m[2]), mime, 'SIPEDABOS - ikon aplikasi.' + ext);\n  const f = folderData_().createFile(blob);\n  try { f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) {}\n  const url = 'https://drive.google.com/uc?export=download&id=' + f.getId() + '&format=' + ext;\n  p.setProperty('FAVICON_ID', f.getId());\n  p.setProperty('FAVICON_URL', url);\n  return url;\n}\n\n// Logo aplikasi di spreadsheet utama berubah -> ikon tab ikut berubah\nfunction faviconIkutLogo_(key, dataUrl) {\n  if (key !== 'logo_aplikasi') return;\n  try {\n    if (ss_().getId() !== SpreadsheetApp.getActiveSpreadsheet().getId()) return;\n    perbaruiFavicon_(dataUrl || '');\n  } catch (e) {}\n}\n\n/** Jalankan sekali dari editor untuk memasang ikon dari logo yang sudah diunggah. */\nfunction pasangIkonAplikasi() {\n  const url = perbaruiFavicon_();\n  Logger.log(url ? 'Ikon aplikasi dipasang. Muat ulang halaman aplikasi. ' + url : 'Logo aplikasi belum diunggah. Unggah dulu di menu Konfigurasi Sekolah > Logo aplikasi.');\n}\n\n/**\n * Setup sheet yang diperlukan jika belum ada dan pastikan kolom sesuai\n */\nfunction setupDatabase_() {\n  const ss = ss_();\n  const sheets = [\n    { name: 'transaksi', header: ['id', 'tahap', 'kode_rekening', 'program', 'uraian', 'volume', 'satuan', 'harga_satuan', 'total_jumlah', 'tahap_1', 'tahap_2'] },\n    { name: 'bku', header: ['id', 'bulan', 'tanggal', 'kode_kegiatan', 'kode_rekening', 'no_bukti', 'uraian', 'penerimaan', 'pengeluaran', 'saldo'] },\n    { name: 'kop_surat', header: ['key', 'value'] }\n  ];\n  \n  sheets.forEach(s => {\n    let sheet = ss.getSheetByName(s.name);\n    if (!sheet) {\n      sheet = ss.insertSheet(s.name);\n      sheet.appendRow(s.header);\n      \n      // Default Data\n      if (s.name === 'kop_surat') {\n        const defaults = [\n          ['sekolah', ''],\n          ['tahun_anggaran', String(new Date().getFullYear())],\n          ['lokasi_ttd', ''],\n          ['pemda', ''],\n          ['dinas', ''],\n          ['kecamatan', ''],\n          ['alamat', ''],\n          ['wallpaper_url', 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&q=80&w=2071'],\n          ['logo_kiri', ''],\n          ['logo_kanan', ''],\n          ['logo_aplikasi', ''],\n          ['logo_login', ''],\n          ['kepsek', ''],\n          ['nip_kepsek', ''],\n          ['bendahara', ''],\n          ['nip_bendahara', ''],\n          ['program', ''],\n          ['kegiatan', '']\n        ];\n        sheet.getRange(2, 1, defaults.length, 2).setValues(defaults);\n      }\n    } else {\n      // Sinkronisasi Kolom Aplikasi & Database\n      sheet.getRange(1, 1, 1, s.header.length).setValues([s.header]);\n    }\n  });\n  return \"Database berhasil disiapkan dan kolom disinkronkan.\";\n}\n\n/**\n * Helper Data Normalization\n */\n// ===================================================================\n// SUMBER DANA (BOSP, BOSDA, BOSP Kinerja, SiLPA BOS Kinerja, Lainnya, Sumber Dana Tambahan)\n// Data lama tanpa sumber dana dianggap BOSP.\n// ===================================================================\nconst SUMBER_DANA_ = ['bosp', 'bosda', 'kinerja', 'silpa_kinerja', 'lainnya', 'tambahan'];\nfunction sdOf_(v) { const s = String(v || '').trim(); return s || 'bosp'; }\nfunction sdValid_(v) { const s = sdOf_(v); if (SUMBER_DANA_.indexOf(s) < 0) throw new Error('Sumber dana tidak dikenal.'); return s; }\n\n/** Pastikan kolom ada di baris judul; kembalikan nomor kolomnya (mulai 1) */\nfunction pastikanKolom_(sheet, nama) {\n  const lebar = Math.max(1, sheet.getLastColumn());\n  const header = sheet.getRange(1, 1, 1, lebar).getValues()[0].map(h => String(h || '').trim().toLowerCase());\n  let i = header.indexOf(nama);\n  if (i >= 0) return i + 1;\n  i = header.length; while (i > 0 && !header[i - 1]) i--;\n  sheet.getRange(1, i + 1).setValue(nama);\n  return i + 1;\n}\n\n/** Pindahkan semua Data RKAS satu sumber dana ke sumber dana lain */\nfunction pindahSumberTransaksi_(dari, ke) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    dari = sdValid_(dari); ke = sdValid_(ke);\n    const sheet = ss_().getSheetByName('transaksi');\n    const kol = pastikanKolom_(sheet, 'sumber_dana');\n    if (sheet.getLastRow() < 2) return { success: true, jumlah: 0 };\n    const rg = sheet.getRange(2, kol, sheet.getLastRow() - 1, 1), v = rg.getValues();\n    let n = 0;\n    v.forEach(r => { if (sdOf_(r[0]) === dari) { r[0] = ke; n++; } });\n    rg.setValues(v);\n    return { success: true, jumlah: n };\n  } catch (e) { return { success: false, message: e.message }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Pindahkan BKU satu sumber dana ke sumber dana lain (BKU terlanjur diimpor di sumber dana yang salah) */\nfunction pindahSumberBku_(dari, ke) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    dari = sdValid_(dari); ke = sdValid_(ke);\n    if (dari === ke) return { success: false, message: 'Sumber dana tujuan sama.' };\n    const sheet = ss_().getSheetByName('bku');\n    if (!sheet || sheet.getLastRow() < 2) return { success: true, jumlah: 0 };\n    const kol = pastikanKolom_(sheet, 'sumber_dana');\n    const tgl = sheet.getRange(2, 3, sheet.getLastRow() - 1, 1).getValues();\n    const rg = sheet.getRange(2, kol, sheet.getLastRow() - 1, 1), v = rg.getValues();\n    const tz = Session.getScriptTimeZone();\n    const per = (x) => { if (x instanceof Date) return Utilities.formatDate(x, tz, 'yyyy-MM'); const m = String(x || '').match(/(\\d{2})[-/](\\d{2})[-/](\\d{4})/); return m ? m[3] + '-' + m[2] : String(x || '').slice(0, 7); };\n    const bulanTujuan = {};\n    v.forEach((r, i) => { if (sdOf_(r[0]) === ke) bulanTujuan[per(tgl[i][0])] = true; });\n    const bentrok = {};\n    v.forEach((r, i) => { if (sdOf_(r[0]) === dari && bulanTujuan[per(tgl[i][0])]) bentrok[per(tgl[i][0])] = true; });\n    if (Object.keys(bentrok).length) return { success: false, message: 'BKU sumber dana tujuan sudah ada untuk bulan ' + Object.keys(bentrok).join(', ') + '. Hapus BKU bulan itu di tujuan dulu, atau impor ulang.' };\n    let n = 0;\n    v.forEach(r => { if (sdOf_(r[0]) === dari) { r[0] = ke; n++; } });\n    rg.setNumberFormat('@').setValues(v);\n    const shInfo = lpjSheet_('bku_info'), kInfo = LPJ_SHEETS_.bku_info.indexOf('sumber_kode') + 1;\n    lpjRows_('bku_info').forEach(r => { if (sdOf_(r.sumber_kode) === dari) shInfo.getRange(r._row, kInfo).setNumberFormat('@').setValue(ke); });\n    return { success: true, jumlah: n };\n  } catch (e) { return { success: false, message: e.message }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Pindahkan set LPJ dari RKAS ke sumber dana lain */\nfunction pindahSumberLpjSet_(keys, ke) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    ke = sdValid_(ke); keys = (Array.isArray(keys) ? keys : [keys]).map(String);\n    const sh = lpjSheet_('lpj_set'), rows = lpjRows_('lpj_set');\n    const kol = LPJ_SHEETS_.lpj_set.indexOf('sumber_dana') + 1;\n    let n = 0;\n    rows.forEach(r => { if (keys.indexOf(String(r.key)) >= 0 && String(r.key).indexOf('rkas|') === 0) { sh.getRange(r._row, kol).setNumberFormat('@').setValue(ke); n++; } });\n    return { success: true, jumlah: n };\n  } catch (e) { return { success: false, message: e.message }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction getTableData_(sheetName) {\n  const ss = ss_();\n  const sheet = ss.getSheetByName(sheetName);\n  if (!sheet) return [];\n  \n  const values = sheet.getDataRange().getValues();\n  if (values.length <= 1) return [];\n  \n  // PERBAIKAN: Pastikan header di-lowercase untuk menghindari masalah kapitalisasi\n  const headers = values.shift().map(h => String(h || \"\").trim().toLowerCase());\n  \n  return values.map(row => {\n    let obj = {};\n    headers.forEach((h, i) => {\n      if (!h) return; // Abaikan kolom tanpa header\n      \n      let val = row[i];\n      if (val instanceof Date) {\n        val = Utilities.formatDate(val, Session.getScriptTimeZone(), \"yyyy-MM-dd\");\n      }\n      \n      // Konversi paksa angka untuk field nominal agar kalkulasi tidak gagal\n      if (['penerimaan', 'pengeluaran', 'saldo', 'harga_satuan', 'total_jumlah', 'tahap_1', 'tahap_2'].includes(h)) {\n         val = Number(val) || 0;\n      }\n      \n      obj[h] = (val === undefined || val === null) ? \"\" : val;\n    });\n    return obj;\n  }).filter(t => {\n    // Memfilter baris kosong dengan aman\n    if (sheetName === 'transaksi' || sheetName === 'bku') return t.uraian && String(t.uraian).trim() !== \"\";\n    if (sheetName === 'kop_surat') return t.key && String(t.key).trim() !== \"\";\n    return Object.keys(t).length > 0;\n  });\n}\n\n/**\n * Manajemen Kop Surat\n */\nfunction getKopSurat_() {\n  const data = getTableData_('kop_surat');\n  let obj = {};\n  data.forEach(item => {\n    if (item.key) obj[item.key] = item.value;\n  });\n  return obj;\n}\n\nfunction updateKopSurat_(data) {\n  try {\n    const sheet = ss_().getSheetByName('kop_surat');\n    if (!sheet) return { success: false, message: 'Sheet tidak ditemukan' };\n    \n    // Gambar besar (data:...) disimpan di sheet \"aset\", bukan di sel kop_surat (batas 50.000 karakter per sel)\n    const rows = Object.keys(data).map(key => [key, String(data[key] || '').indexOf('data:') === 0 ? '__aset__' : data[key]]);\n    if (rows.length === 0) return { success: false, message: 'Data konfigurasi kosong' };\n    sheet.clear();\n    sheet.appendRow(['key', 'value']); \n    sheet.getRange(2, 1, rows.length, 2).setValues(rows);\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/**\n * Import/Save Data Transaksi\n */\nfunction importTransaksi_(data, sumber) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const sheet = ss_().getSheetByName('transaksi');\n    if (!sheet) return { success: false, message: 'Sheet transaksi tidak ada' };\n    const sd = sdValid_(sumber);\n    const kolSd = pastikanKolom_(sheet, 'sumber_dana');\n    const lebar = Math.max(kolSd, 11);\n    // Data RKAS sumber dana lain tetap; hanya sumber dana ini yang diganti\n    let lama = [];\n    if (sheet.getLastRow() > 1) {\n      lama = sheet.getRange(2, 1, sheet.getLastRow() - 1, lebar).getValues()\n        .filter(r => String(r[4]).trim() !== '' && sdOf_(r[kolSd - 1]) !== sd);\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, Math.max(sheet.getLastColumn(), lebar)).clearContent();\n    }\n    const baru = (data || []).map(t => {\n      const r = [t.id || Utilities.getUuid(), t.tahap || \"\", t.kode_rekening || \"\", t.program || \"\", t.uraian || \"\", t.volume || 0, t.satuan || \"\",\n        t.harga_satuan || 0, t.total_jumlah || 0, t.tahap_1 || 0, t.tahap_2 || 0];\n      while (r.length < lebar) r.push('');\n      r[kolSd - 1] = sd;\n      return r;\n    });\n    const rows = lama.concat(baru);\n    if (rows.length) sheet.getRange(2, 1, rows.length, lebar).setValues(rows);\n    return { success: true, jumlah: baru.length };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  } finally { lock.releaseLock(); }\n}\n\nfunction clearAllTransactions_(sumber) {\n  try {\n    // Hapus Data RKAS satu sumber dana saja (dengan cara mengimpor daftar kosong untuk sumber dana itu)\n    if (sumber !== undefined) return importTransaksi_([], sumber);\n    const sheet = ss_().getSheetByName('transaksi');\n    if (sheet.getLastRow() > 1) {\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, sheet.getLastColumn()).clearContent();\n    }\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/**\n * Import Data BKU\n * Bulan yang diimpor menggantikan data bulan yang sama saja; bulan lain tetap tersimpan\n * (dibutuhkan untuk SPTJM & Laporan Realisasi per tahap).\n * info (opsional): { periode, sumber_dana, saldo_bank, saldo_tunai, saldo_bku } dari blok penutupan kas.\n */\nfunction importBKU_(data, info) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const sheet = ss_().getSheetByName('bku');\n    if (!sheet) return { success: false, message: 'Sheet bku tidak ditemukan. Klik Setup Database dulu.' };\n    if (!data || data.length === 0) return { success: true };\n\n    const tz = Session.getScriptTimeZone();\n    const periodeDari = (v) => {\n      if (v instanceof Date) return Utilities.formatDate(v, tz, 'yyyy-MM');\n      const s = String(v || '').trim();\n      let m = s.match(/^(\\d{2})[-/](\\d{2})[-/](\\d{4})/); if (m) return m[3] + '-' + m[2];\n      m = s.match(/^(\\d{4})-(\\d{2})/); if (m) return m[1] + '-' + m[2];\n      return '';\n    };\n    const teksTanggal = (v) => (v instanceof Date) ? Utilities.formatDate(v, tz, 'dd-MM-yyyy') : String(v || '');\n    const urut = (v) => { const s = teksTanggal(v); const m = s.match(/^(\\d{2})-(\\d{2})-(\\d{4})/); return m ? Number(m[3] + m[2] + m[1]) : 0; };\n\n    const periodeBaru = {};\n    data.forEach(t => { periodeBaru[periodeDari(t.tanggal)] = true; });\n    // BKU per sumber dana: bulan yang sama dari sumber dana yang sama diganti, lainnya tetap\n    const sd = sdValid_(info && info.sumber_kode);\n    const kolSd = pastikanKolom_(sheet, 'sumber_dana');\n    const lebar = Math.max(kolSd, 10);\n\n    let lama = [];\n    if (sheet.getLastRow() > 1) {\n      lama = sheet.getRange(2, 1, sheet.getLastRow() - 1, lebar).getValues()\n        .filter(r => String(r[6]).trim() !== '' && !(periodeBaru[periodeDari(r[2])] && sdOf_(r[kolSd - 1]) === sd))\n        .map(r => { const x = r.slice(); x[2] = teksTanggal(x[2]); return x; });\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, Math.max(sheet.getLastColumn(), lebar)).clearContent();\n    }\n\n    const baru = data.map(t => [\n      t.id || Utilities.getUuid(),\n      t.bulan || \"\",\n      t.tanggal || \"\",\n      t.kode_kegiatan || \"\",\n      t.kode_rekening || \"\",\n      t.no_bukti || \"\",\n      t.uraian || \"\",\n      Number(t.penerimaan) || 0,\n      Number(t.pengeluaran) || 0,\n      Number(t.saldo) || 0\n    ].concat(Array(lebar - 10).fill('')).map((v, i) => i === kolSd - 1 ? sd : v));\n    // Urutkan per tanggal; urutan baris dalam satu bulan (sesuai BKU) dipertahankan\n    const rows = lama.concat(baru).map((r, i) => ({ r: r, i: i }))\n      .sort((x, y) => (urut(x.r[2]) - urut(y.r[2])) || (x.i - y.i)).map(x => x.r);\n\n    // Kolom bulan s/d uraian dipaksa format teks agar Sheets tidak mengubah\n    // \"06-10-2026\" menjadi Date (hari/bulan bisa tertukar) atau \"05.08.01.\" menjadi angka\n    sheet.getRange(2, 2, rows.length, 6).setNumberFormat('@');\n    sheet.getRange(2, 1, rows.length, lebar).setValues(rows);\n\n    if (info && info.periode) {\n      const ada = lpjRows_('bku_info').find(r => String(r.periode) === String(info.periode) && sdOf_(r.sumber_kode) === sd);\n      lpjWriteRow_('bku_info', {\n        periode: info.periode, sumber_dana: info.sumber_dana || '', sumber_kode: sd,\n        saldo_bank: info.saldo_bank === null || info.saldo_bank === undefined ? '' : info.saldo_bank,\n        saldo_tunai: info.saldo_tunai === null || info.saldo_tunai === undefined ? '' : info.saldo_tunai,\n        saldo_bku: info.saldo_bku === null || info.saldo_bku === undefined ? '' : info.saldo_bku,\n        updated_at: lpjNow_()\n      }, ada ? ada._row : null);\n    }\n    return { success: true, bulan: Object.keys(periodeBaru), total_baris: rows.length };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  } finally { lock.releaseLock(); }\n}\n\nfunction clearAllBKU_(sumber) {\n  try {\n    const sheet = ss_().getSheetByName('bku');\n    if (sumber !== undefined) {\n      // Hapus BKU satu sumber dana saja\n      const sd = sdValid_(sumber), kolSd = pastikanKolom_(sheet, 'sumber_dana'), lebar = Math.max(kolSd, 10);\n      if (sheet.getLastRow() > 1) {\n        const sisa = sheet.getRange(2, 1, sheet.getLastRow() - 1, lebar).getValues().filter(r => String(r[6]).trim() !== '' && sdOf_(r[kolSd - 1]) !== sd);\n        sheet.getRange(2, 1, sheet.getLastRow() - 1, Math.max(sheet.getLastColumn(), lebar)).clearContent();\n        if (sisa.length) { sheet.getRange(2, 2, sisa.length, 6).setNumberFormat('@'); sheet.getRange(2, 1, sisa.length, lebar).setValues(sisa); }\n      }\n      const shInfo = lpjSheet_('bku_info');\n      lpjRows_('bku_info').filter(r => sdOf_(r.sumber_kode) === sd).map(r => r._row).sort((a, b) => b - a).forEach(n => shInfo.deleteRow(n));\n      return { success: true };\n    }\n    if (sheet.getLastRow() > 1) sheet.getRange(2, 1, sheet.getLastRow() - 1, sheet.getLastColumn()).clearContent();\n    const info = ss_().getSheetByName('bku_info');\n    if (info && info.getLastRow() > 1) info.getRange(2, 1, info.getLastRow() - 1, info.getLastColumn()).clearContent();\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/* =====================================================================\n * LAPORAN OTOMATIS (K7b, K7c, SPTJM, Realisasi)\n * ===================================================================== */\n/** Info penutupan kas per bulan + isian laporan yang pernah disimpan */\nfunction getLaporanData_() {\n  try {\n    const info = {};\n    lpjRows_('bku_info').forEach(r => {\n      const n = (v) => (String(v).trim() === '' ? null : Number(v));\n      const sd = sdOf_(r.sumber_kode);\n      info[String(r.periode) + (sd === 'bosp' ? '' : '@' + sd)] = { sumber_dana: String(r.sumber_dana), saldo_bank: n(r.saldo_bank), saldo_tunai: n(r.saldo_tunai), saldo_bku: n(r.saldo_bku) };\n    });\n    const isian = {};\n    lpjRows_('laporan_isian').forEach(r => { isian[String(r.key)] = lpjJson_(r.data_json, {}); });\n    return { success: true, info: info, isian: isian };\n  } catch (e) { return { success: false, message: e.toString() }; }\n}\n\n/** Simpan isian satu laporan, misalnya key \"K7B|2026-09\", \"SPTJM|2026-2\", atau \"nama_rekening\" */\nfunction simpanLaporanIsian_(key, obj) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!key) return { success: false, message: 'Kunci isian kosong.' };\n    const ada = lpjRows_('laporan_isian').find(r => String(r.key) === String(key));\n    lpjWriteRow_('laporan_isian', { key: key, data_json: JSON.stringify(obj || {}), updated_at: lpjNow_() }, ada ? ada._row : null);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/* =====================================================================\n * MODUL LPJ DARI BKU (belanja barang/jasa, perjalanan dinas, honor)\n * Sheet dibuat otomatis saat pertama dipakai (tidak perlu Setup Database).\n * ===================================================================== */\nconst LPJ_SHEETS_ = {\n  vendor: ['id', 'nama_toko', 'pemilik', 'alamat'],\n  pegawai: ['id', 'nama', 'nip', 'pangkat_golongan', 'jabatan'],\n  katalog_barang: ['kunci', 'nama', 'satuan', 'harga', 'updated_at'],\n  lpj_set: ['key', 'no_bukti', 'kode_kegiatan', 'tanggal', 'jenis', 'vendor_id', 'untuk_pembayaran', 'items_json', 'total',\n            'nomor_sp', 'nomor_bast', 'nomor_bap', 'nomor_kwitansi', 'updated_at', 'detail_json', 'nomor_sppd', 'sumber_dana'],\n  nomor_log: ['tahun', 'jenis', 'nomor', 'ref_key', 'dibuat'],\n  pengaturan_nomor: ['key', 'value'],\n  bku_info: ['periode', 'sumber_dana', 'saldo_bank', 'saldo_tunai', 'saldo_bku', 'updated_at', 'sumber_kode'],\n  laporan_isian: ['key', 'data_json', 'updated_at'],\n  aset: ['key', 'bagian', 'data'],\n  // RKAS Manual: satu baris per kegiatan atau per barang; bulan_json = jumlah barang Jan\u2013Des\n  rkas_manual: ['id', 'tahun', 'urutan', 'tipe', 'induk', 'uraian', 'jenis_belanja', 'kode_rekening', 'satuan', 'harga', 'bulan_json', 'diubah', 'sumber_dana'],\n  // Kartu Inventaris Barang: jenis A (tanah), B (peralatan & mesin), E (aset tetap lainnya); rincian kolom di data_json\n  kib: ['id', 'jenis', 'tahun', 'tahap', 'urutan', 'data_json', 'diubah']\n};\n\nconst LPJ_PENGATURAN_DEFAULT_ = {\n  format_surat: '', format_sppd: '', ikut_tanggal: '1', sppd_sama: '1',\n  klasifikasi: '', kode_sekolah: '', nomor_awal_surat: '1', nomor_awal_kwitansi: '1',\n  sppd_klasifikasi: '', sppd_kode_sekolah: '', nomor_awal_sppd: '1',\n  persen_penginapan: '100', persen_pph_honor: '0', mata_anggaran: ''\n};\n\nfunction lpjSheet_(name) {\n  const ss = ss_();\n  const header = LPJ_SHEETS_[name];\n  let sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    sh.getRange('A:Z').setNumberFormat('@'); // simpan semua sebagai teks, angka dikonversi di kode\n    sh.getRange(1, 1, 1, header.length).setValues([header]);\n  }\n  return sh;\n}\n\nfunction lpjRows_(name) {\n  const sh = lpjSheet_(name);\n  const values = sh.getDataRange().getValues();\n  let header = values.shift().map(h => String(h).trim());\n  const harus = LPJ_SHEETS_[name];\n  if (harus.some((h, i) => header[i] !== h)) {\n    // Migrasi: kolom baru ditambahkan di ujung kanan, data lama tidak berubah\n    sh.getRange(1, 1, 1, harus.length).setValues([harus]);\n    header = harus.slice();\n  }\n  return values\n    .map((r, i) => { const o = { _row: i + 2 }; header.forEach((h, j) => o[h] = (r[j] === null || r[j] === undefined) ? '' : r[j]); return o; })\n    .filter(o => String(o[header[0]]).trim() !== '');\n}\n\nfunction lpjWriteRow_(name, obj, rowNumber) {\n  const sh = lpjSheet_(name);\n  const row = LPJ_SHEETS_[name].map(h => (obj[h] === undefined || obj[h] === null) ? '' : String(obj[h]));\n  const target = rowNumber || sh.getLastRow() + 1;\n  sh.getRange(target, 1, 1, row.length).setNumberFormat('@').setValues([row]);\n}\n\n// ===================================================================\n// RKAS MANUAL (perencanaan anggaran per bulan sebelum diinput ke ARKAS)\n// ===================================================================\nfunction getRkasManual_(tahun, sumber) {\n  tahun = String(tahun || '');\n  const sd = sdValid_(sumber);\n  const semua = lpjRows_('rkas_manual');\n  const rows = semua.filter(r => sdOf_(r.sumber_dana) === sd);\n  const daftarTahun = Array.from(new Set(rows.map(r => String(r.tahun)))).sort();\n  const milik = rows.filter(r => String(r.tahun) === tahun).sort((a, b) => Number(a.urutan) - Number(b.urutan));\n  const kegiatan = [], byId = {};\n  milik.filter(r => r.tipe === 'kegiatan').forEach(r => {\n    const k = { id: String(r.id), uraian: String(r.uraian), jenis_belanja: String(r.jenis_belanja || 'barjas'), items: [] };\n    byId[k.id] = k; kegiatan.push(k);\n  });\n  milik.filter(r => r.tipe === 'item').forEach(r => {\n    const k = byId[String(r.induk)];\n    if (!k) return;\n    let bulan = lpjJson_(r.bulan_json, []);\n    bulan = Array.from({ length: 12 }, (_, i) => Number(bulan[i]) || 0);\n    k.items.push({ id: String(r.id), uraian: String(r.uraian), kode_rekening: String(r.kode_rekening || '').replace(/^'/, ''), satuan: String(r.satuan || ''), harga: Number(r.harga) || 0, bulan: bulan });\n  });\n  const info = (getLaporanData_().isian || {})['rkas_manual|' + tahun + (sd === 'bosp' ? '' : '|' + sd)] || {};\n  // Nama kegiatan yang pernah dipakai (semua tahun dan sumber dana), untuk daftar pilihan\n  const kegiatanPernah = Array.from(new Set(semua.filter(r => r.tipe === 'kegiatan').map(r => String(r.uraian).trim()).filter(Boolean)));\n  return { success: true, tahun: tahun, daftarTahun: daftarTahun, pagu_1: Number(info.pagu_1) || 0, pagu_2: Number(info.pagu_2) || 0, kegiatan: kegiatan, kegiatanPernah: kegiatanPernah };\n}\n\nfunction simpanRkasManual_(tahun, data, sumber) {\n  tahun = String(tahun || '');\n  let sd; try { sd = sdValid_(sumber); } catch (e) { return { success: false, message: e.message }; }\n  if (!/^\\d{4}$/.test(tahun)) return { success: false, message: 'Tahun anggaran tidak valid.' };\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const sh = lpjSheet_('rkas_manual');\n    lpjRows_('rkas_manual');   // pastikan judul kolom terbaru\n    const header = LPJ_SHEETS_.rkas_manual;\n    const iSd = header.indexOf('sumber_dana');\n    const lama = sh.getDataRange().getValues().slice(1).filter(r => String(r[0]).trim() !== '' && !(String(r[1]) === tahun && sdOf_(r[iSd]) === sd));\n    const baru = [], kini = lpjNow_();\n    let urut = 0;\n    (data.kegiatan || []).forEach(k => {\n      const kid = String(k.id || Utilities.getUuid());\n      baru.push(header.map(h => ({ id: kid, tahun: tahun, urutan: ++urut, tipe: 'kegiatan', induk: '', uraian: k.uraian || '', jenis_belanja: k.jenis_belanja || 'barjas', diubah: kini, sumber_dana: sd })[h]));\n      (k.items || []).forEach(it => {\n        const bulan = Array.from({ length: 12 }, (_, i) => Math.max(0, Number((it.bulan || [])[i]) || 0));\n        baru.push(header.map(h => ({ id: String(it.id || Utilities.getUuid()), tahun: tahun, urutan: ++urut, tipe: 'item', induk: kid, uraian: it.uraian || '',\n          kode_rekening: it.kode_rekening || '', satuan: it.satuan || '', harga: Number(it.harga) || 0, bulan_json: JSON.stringify(bulan), diubah: kini, sumber_dana: sd })[h]));\n      });\n    });\n    const semua = lama.concat(baru).map(r => header.map((h, i) => (r[i] === undefined || r[i] === null) ? '' : String(r[i])));\n    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, Math.max(sh.getLastColumn(), header.length)).clearContent();\n    if (semua.length) sh.getRange(2, 1, semua.length, header.length).setNumberFormat('@').setValues(semua);\n    const kunci = 'rkas_manual|' + tahun + (sd === 'bosp' ? '' : '|' + sd), adaInfo = lpjRows_('laporan_isian').find(r => String(r.key) === kunci);\n    lpjWriteRow_('laporan_isian', { key: kunci, data_json: JSON.stringify({ pagu_1: Number(data.pagu_1) || 0, pagu_2: Number(data.pagu_2) || 0 }), updated_at: kini }, adaInfo ? adaInfo._row : null);\n    return { success: true, jumlah: baru.length };\n  } catch (e) {\n    return { success: false, message: e.message };\n  } finally { lock.releaseLock(); }\n}\n\n// ===================================================================\n// KARTU INVENTARIS BARANG (KIB A, B, E)\n// ===================================================================\nfunction getKib_() {\n  const items = lpjRows_('kib').map(r => Object.assign({}, lpjJson_(r.data_json, {}), {\n    id: String(r.id), jenis: String(r.jenis), tahun: String(r.tahun || ''), tahap: String(r.tahap || ''), urutan: Number(r.urutan) || 0\n  })).sort((a, b) => a.urutan - b.urutan);\n  const info = (getLaporanData_().isian || {}).kib_info || {};\n  return { success: true, items: items, info: info };\n}\n\n// Simpan satu atau beberapa barang (tambah baru atau ubah yang sudah ada)\nfunction simpanKib_(list) {\n  list = Array.isArray(list) ? list : [list];\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const rows = lpjRows_('kib');\n    let urut = rows.reduce((m, r) => Math.max(m, Number(r.urutan) || 0), 0);\n    const kini = lpjNow_(), hasil = [];\n    list.forEach(it => {\n      if (['A', 'B', 'E'].indexOf(String(it.jenis)) < 0) throw new Error('Jenis KIB tidak dikenal.');\n      if (!String(it.nama || '').trim()) throw new Error('Nama barang wajib diisi.');\n      const ada = it.id ? rows.find(r => String(r.id) === String(it.id)) : null;\n      const data = Object.assign({}, it); ['id', 'jenis', 'tahun', 'tahap', 'urutan'].forEach(k => delete data[k]);\n      const id = ada ? String(ada.id) : Utilities.getUuid();\n      lpjWriteRow_('kib', { id: id, jenis: it.jenis, tahun: it.tahun || '', tahap: it.tahap || '', urutan: ada ? ada.urutan : ++urut, data_json: JSON.stringify(data), diubah: kini }, ada ? ada._row : null);\n      hasil.push(id);\n    });\n    return { success: true, ids: hasil };\n  } catch (e) { return { success: false, message: e.message }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusKib_(ids) {\n  ids = (Array.isArray(ids) ? ids : [ids]).map(String);\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const sh = lpjSheet_('kib');\n    lpjRows_('kib').filter(r => ids.indexOf(String(r.id)) >= 0).map(r => r._row).sort((a, b) => b - a).forEach(n => sh.deleteRow(n));\n    return { success: true };\n  } catch (e) { return { success: false, message: e.message }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction lpjNow_() {\n  return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm:ss');\n}\n\nfunction lpjNomorCfg_() {\n  const cfg = Object.assign({}, LPJ_PENGATURAN_DEFAULT_);\n  lpjRows_('pengaturan_nomor').forEach(r => { cfg[r.key] = String(r.value); });\n  return cfg;\n}\n\nfunction lpjJson_(s, def) {\n  try { const v = JSON.parse(s || ''); return v === null || v === undefined ? def : v; } catch (e) { return def; }\n}\n\nfunction lpjSetToObj_(r) {\n  return {\n    key: String(r.key), no_bukti: String(r.no_bukti), kode_kegiatan: String(r.kode_kegiatan), tanggal: String(r.tanggal),\n    jenis: String(r.jenis), vendor_id: String(r.vendor_id), untuk_pembayaran: String(r.untuk_pembayaran),\n    items: lpjJson_(r.items_json, []), detail: lpjJson_(r.detail_json, {}),\n    total: Number(r.total) || 0,\n    nomor_sp: Number(r.nomor_sp) || 0, nomor_bast: Number(r.nomor_bast) || 0, nomor_bap: Number(r.nomor_bap) || 0,\n    nomor_kwitansi: Number(r.nomor_kwitansi) || 0, nomor_sppd: lpjJson_(r.nomor_sppd, []),\n    updated_at: String(r.updated_at), sumber_dana: String(r.sumber_dana || '')\n  };\n}\n\n/** Semua data yang dibutuhkan halaman LPJ dari BKU */\nfunction getLpjData_() {\n  try {\n    const katalog = {};\n    lpjRows_('katalog_barang').forEach(r => { katalog[String(r.kunci)] = { nama: String(r.nama), satuan: String(r.satuan), harga: Number(r.harga) || 0 }; });\n    const sets = {};\n    lpjRows_('lpj_set').forEach(r => { sets[String(r.key)] = lpjSetToObj_(r); });\n    const vendor = lpjRows_('vendor').map(r => ({ id: String(r.id), nama_toko: String(r.nama_toko), pemilik: String(r.pemilik), alamat: String(r.alamat) }));\n    const pegawai = lpjRows_('pegawai').map(r => ({ id: String(r.id), nama: String(r.nama), nip: String(r.nip), pangkat_golongan: String(r.pangkat_golongan), jabatan: String(r.jabatan) }));\n    // Nomor terakhir yang sudah dipakai per tahun: { '2026': { surat: 12, kwitansi: 4, sppd: 3 } }\n    const nomorTerakhir = {};\n    lpjRows_('nomor_log').forEach(r => {\n      const th = String(r.tahun), j = String(r.jenis), n = Number(r.nomor) || 0;\n      nomorTerakhir[th] = nomorTerakhir[th] || {};\n      nomorTerakhir[th][j] = Math.max(nomorTerakhir[th][j] || 0, n);\n    });\n    return { success: true, vendor: vendor, pegawai: pegawai, katalog: katalog, sets: sets, nomorCfg: lpjNomorCfg_(), nomorTerakhir: nomorTerakhir, gabung: bacaGabungLpj_() };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/* ---- Gabung beberapa transaksi BKU (bulan yang sama) menjadi satu LPJ ----\n * Disimpan sebagai peta { key_set_anak: key_set_induk } di laporan_isian (key 'lpj_gabung').\n * Data BKU tidak diubah; pemisahan kembali cukup menghapus pasangan di peta. */\nfunction bacaGabungLpj_() {\n  const r = lpjRows_('laporan_isian').find(x => String(x.key) === 'lpj_gabung');\n  return r ? lpjJson_(r.data_json, {}) : {};\n}\nfunction tulisGabungLpj_(m) {\n  const ada = lpjRows_('laporan_isian').find(x => String(x.key) === 'lpj_gabung');\n  lpjWriteRow_('laporan_isian', { key: 'lpj_gabung', data_json: JSON.stringify(m || {}), updated_at: lpjNow_() }, ada ? ada._row : null);\n}\nfunction setLpjTercetak_(keys) {\n  const k = {}; keys.forEach(x => { k[String(x)] = 1; });\n  return lpjRows_('lpj_set').some(r => k[String(r.key)] && (String(r.nomor_sp || '').trim() || String(r.nomor_sppd || '').trim()));\n}\nfunction gabungLpjSet_(keys) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    keys = (keys || []).map(String).filter((v, i, a) => v && a.indexOf(v) === i);\n    if (keys.length < 2) return { success: false, message: 'Pilih minimal 2 transaksi untuk digabung.' };\n    if (keys.some(k => k.indexOf('rkas|') === 0)) return { success: false, message: 'LPJ yang dibuat dari RKAS tidak bisa digabung.' };\n    const m = bacaGabungLpj_(), induk = keys[0];\n    const terlibat = keys.concat(Object.keys(m).filter(c => keys.indexOf(m[c]) >= 0));\n    if (setLpjTercetak_(terlibat)) return { success: false, message: 'Salah satu LPJ sudah dicetak. Hapus atau revisi LPJ itu dulu sebelum digabung.' };\n    keys.slice(1).forEach(k => { m[k] = induk; });\n    Object.keys(m).forEach(c => { if (keys.indexOf(m[c]) >= 0) m[c] = induk; });   // anak dari set yang ikut digabung pindah ke induk baru\n    delete m[induk];\n    tulisGabungLpj_(m);\n    return { success: true, induk: induk, gabung: m };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\nfunction pisahLpjSet_(induk) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    induk = String(induk || '');\n    if (setLpjTercetak_([induk])) return { success: false, message: 'LPJ gabungan ini sudah dicetak. Hapus LPJ dulu bila ingin dipisahkan.' };\n    const m = bacaGabungLpj_();\n    Object.keys(m).forEach(c => { if (m[c] === induk) delete m[c]; });\n    tulisGabungLpj_(m);\n    return { success: true, gabung: m };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction simpanVendor_(v) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!v || !String(v.nama_toko || '').trim()) return { success: false, message: 'Nama toko wajib diisi.' };\n    const rows = lpjRows_('vendor');\n    const data = { id: v.id || Utilities.getUuid(), nama_toko: String(v.nama_toko).trim(), pemilik: String(v.pemilik || '').trim(), alamat: String(v.alamat || '').trim() };\n    const ada = rows.find(r => String(r.id) === data.id);\n    lpjWriteRow_('vendor', data, ada ? ada._row : null);\n    return { success: true, vendor: data };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusVendor_(id) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const dipakai = lpjRows_('lpj_set').some(r => String(r.vendor_id) === String(id));\n    if (dipakai) return { success: false, message: 'Toko ini sudah dipakai di LPJ, tidak bisa dihapus.' };\n    const r = lpjRows_('vendor').find(x => String(x.id) === String(id));\n    if (r) lpjSheet_('vendor').deleteRow(r._row);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction simpanPegawai_(p) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!p || !String(p.nama || '').trim()) return { success: false, message: 'Nama pegawai wajib diisi.' };\n    const rows = lpjRows_('pegawai');\n    const data = { id: p.id || Utilities.getUuid(), nama: String(p.nama).trim(), nip: String(p.nip || '').trim(), pangkat_golongan: String(p.pangkat_golongan || '').trim(), jabatan: String(p.jabatan || '').trim() };\n    const ada = rows.find(r => String(r.id) === data.id);\n    lpjWriteRow_('pegawai', data, ada ? ada._row : null);\n    return { success: true, pegawai: data };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusPegawai_(id) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const dipakai = lpjRows_('lpj_set').some(r => {\n      const d = lpjJson_(r.detail_json, {});\n      return (d.pelaksana || []).indexOf(String(id)) >= 0 || (d.penerima || []).some(x => String(x.pegawai_id) === String(id));\n    });\n    if (dipakai) return { success: false, message: 'Pegawai ini sudah dipakai di LPJ, tidak bisa dihapus.' };\n    const r = lpjRows_('pegawai').find(x => String(x.id) === String(id));\n    if (r) lpjSheet_('pegawai').deleteRow(r._row);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Simpan pengaturan. Key yang tidak dikirim tetap dipertahankan. */\nfunction simpanNomorCfg_(cfg) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const gabung = lpjNomorCfg_();\n    Object.keys(LPJ_PENGATURAN_DEFAULT_).forEach(k => {\n      if (cfg && cfg[k] !== undefined && cfg[k] !== null) gabung[k] = String(cfg[k]).trim();\n    });\n    const sh = lpjSheet_('pengaturan_nomor');\n    const rows = Object.keys(LPJ_PENGATURAN_DEFAULT_).map(k => [k, gabung[k]]);\n    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 2).clearContent();\n    sh.getRange(2, 1, rows.length, 2).setNumberFormat('@').setValues(rows);\n    return { success: true, nomorCfg: lpjNomorCfg_() };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Simpan isian satu set LPJ. Nomor surat yang sudah terkunci tidak diubah. */\nfunction simpanLpjSet_(p) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!p || !p.key) return { success: false, message: 'Data set tidak valid.' };\n    const now = lpjNow_();\n    const ada = lpjRows_('lpj_set').find(r => String(r.key) === String(p.key));\n    const lama = ada ? lpjSetToObj_(ada) : {};\n    const items = (p.items || []).map(it => ({\n      uraian: it.uraian, kode_rekening: it.kode_rekening || '', program: it.program || '', volume: Number(it.volume) || '', nama: it.nama || '', satuan: it.satuan || '',\n      harga: Number(it.harga) || 0, volume: Number(it.volume) || 0, persen: it.persen === undefined ? 100 : Number(it.persen),\n      keterangan: it.keterangan || '', jumlah: Number(it.jumlah) || 0\n    }));\n    // LPJ dari RKAS: volume item tidak boleh melebihi sisa volume RKAS yang belum di-LPJ-kan di set lain.\n    // Bila volume RKAS tidak diketahui, item yang sudah ada di set lain yang sudah dicetak ditolak.\n    const sdSet = sdOf_(p.sumber_dana || lama.sumber_dana);\n    if (String(p.key).indexOf('rkas|') === 0) {\n      // Hanya dibandingkan dengan RKAS dan set LPJ dari sumber dana yang sama\n      const cocok = (a, b) => a.k === b.k && (!a.program || !b.program || a.program === b.program);\n      const pakai = [];\n      lpjRows_('lpj_set').forEach(r => {\n        if (String(r.key) === String(p.key) || String(r.key).indexOf('rkas|') !== 0 || sdOf_(r.sumber_dana) !== sdSet) return;\n        lpjJson_(r.items_json, []).forEach(it => pakai.push({ k: lpjKunciItemRkas_(it), program: String(it.program || ''), volume: lpjVolumeItem_(it), dicetak: Number(r.nomor_sp) > 0 }));\n      });\n      const rkas = getTableData_('transaksi').filter(t => sdOf_(t.sumber_dana) === sdSet).map(t => ({ k: lpjKunciItemRkas_(t), program: String(t.program || '').replace(/^'/, ''), volume: Number(t.volume) || 0 }));\n      const salah = [];\n      items.forEach(it => {\n        const x = { k: lpjKunciItemRkas_(it), program: String(it.program || '') };\n        const volRkas = rkas.filter(r => cocok(r, x)).reduce((a, r) => a + r.volume, 0);\n        const lain = pakai.filter(u => cocok(u, x));\n        if (volRkas > 0) {\n          const sisa = Math.round((volRkas - lain.reduce((a, u) => a + u.volume, 0)) * 100) / 100;\n          if (lpjVolumeItem_(it) > sisa + 1e-9) salah.push((it.nama || it.uraian) + ' (sisa ' + Math.max(0, sisa) + ', diisi ' + lpjVolumeItem_(it) + ')');\n        } else if (lain.some(u => u.dicetak)) salah.push((it.nama || it.uraian) + ' (sudah ada di LPJ yang dicetak)');\n      });\n      if (salah.length) return { success: false, message: 'Volume melebihi sisa RKAS yang belum di-LPJ-kan: ' + salah.join(', ') + '.' };\n    }\n    const data = {\n      key: p.key, no_bukti: p.no_bukti || '', kode_kegiatan: p.kode_kegiatan || '', tanggal: p.tanggal || '', jenis: p.jenis || '',\n      vendor_id: p.vendor_id || '', untuk_pembayaran: p.untuk_pembayaran || '', items_json: JSON.stringify(items),\n      total: items.reduce((a, it) => a + it.jumlah, 0),\n      nomor_sp: lama.nomor_sp || '', nomor_bast: lama.nomor_bast || '', nomor_bap: lama.nomor_bap || '', nomor_kwitansi: lama.nomor_kwitansi || '',\n      updated_at: now, detail_json: JSON.stringify(p.detail || {}), nomor_sppd: JSON.stringify(lama.nomor_sppd || []),\n      sumber_dana: p.sumber_dana || lama.sumber_dana || ''\n    };\n    lpjWriteRow_('lpj_set', data, ada ? ada._row : null);\n\n    // Katalog hanya untuk belanja barang: ingat nama tampil, satuan & harga per uraian BKU\n    if (data.jenis === 'barang') {\n      const katRows = lpjRows_('katalog_barang');\n      items.forEach((it, i) => {\n        if (!it.satuan || !(it.harga > 0)) return;\n        if (p.items[i] && p.items[i].tanpa_katalog) return;   // isian otomatis (1 paket = jumlah BKU) tidak diingat sebagai harga\n        const kunci = lpjKunciBarang_(it.uraian);\n        const k = katRows.find(r => String(r.kunci) === kunci);\n        const obj = { kunci: kunci, nama: it.nama, satuan: it.satuan, harga: it.harga, updated_at: now };\n        lpjWriteRow_('katalog_barang', obj, k ? k._row : null);\n        if (!k) katRows.push(Object.assign({ _row: lpjSheet_('katalog_barang').getLastRow() }, obj));\n      });\n    }\n    const tersimpan = lpjRows_('lpj_set').find(r => String(r.key) === String(p.key));\n    return { success: true, set: lpjSetToObj_(tersimpan) };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/**\n * Dipanggil saat set dicetak.\n * - Barang : nomor Surat Pesanan, BAST, BAP (urut) + nomor kwitansi.\n * - Perjalanan dinas : satu nomor SPPD per pelaksana (kecuali yang diberi nomor manual).\n * - Honor : tidak memerlukan nomor.\n */\nfunction kunciNomorLpjSet_(key) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const ada = lpjRows_('lpj_set').find(r => String(r.key) === String(key));\n    if (!ada) return { success: false, message: 'Simpan set LPJ terlebih dahulu.' };\n    const set = lpjSetToObj_(ada);\n    if (set.jenis === 'honor') return { success: true, set: set };\n\n    const m = String(set.tanggal).match(/(\\d{4})/);\n    const tahun = m ? m[1] : String(new Date().getFullYear());\n    const cfg = lpjNomorCfg_();\n    const log = lpjRows_('nomor_log').filter(r => String(r.tahun) === tahun);\n    const now = lpjNow_();\n    const ambil = (jenis, awal) => {\n      const maks = log.filter(r => r.jenis === jenis).reduce((a, r) => Math.max(a, Number(r.nomor) || 0), 0);\n      const n = Math.max(maks + 1, Number(awal) || 1);\n      log.push({ tahun: tahun, jenis: jenis, nomor: n });\n      lpjWriteRow_('nomor_log', { tahun: tahun, jenis: jenis, nomor: n, ref_key: key, dibuat: now });\n      return n;\n    };\n    const sh = lpjSheet_('lpj_set');\n    const kolom = LPJ_SHEETS_.lpj_set;\n    const tulis = (k, v) => sh.getRange(ada._row, kolom.indexOf(k) + 1).setNumberFormat('@').setValue(String(v));\n\n    if (set.jenis === 'perjadin') {\n      const pelaksana = (set.detail && set.detail.pelaksana) || [];\n      const manual = (set.detail && set.detail.nomor_manual) || [];\n      const nomor = (set.nomor_sppd || []).slice();\n      pelaksana.forEach((pid, i) => {\n        if (String(manual[i] || '').trim()) { if (!nomor[i]) nomor[i] = 0; return; }\n        if (!nomor[i]) nomor[i] = String(cfg.sppd_sama) !== '0' ? ambil('surat', cfg.nomor_awal_surat) : ambil('sppd', cfg.nomor_awal_sppd);\n      });\n      set.nomor_sppd = nomor.slice(0, pelaksana.length);\n      tulis('nomor_sppd', JSON.stringify(set.nomor_sppd));\n      return { success: true, set: set };\n    }\n\n    if (set.nomor_sp && set.nomor_bast && set.nomor_bap && set.nomor_kwitansi) return { success: true, set: set };\n    if (!set.nomor_sp) set.nomor_sp = ambil('surat', cfg.nomor_awal_surat);\n    if (!set.nomor_bast) set.nomor_bast = ambil('surat', cfg.nomor_awal_surat);\n    if (!set.nomor_bap) set.nomor_bap = ambil('surat', cfg.nomor_awal_surat);\n    if (!set.nomor_kwitansi) set.nomor_kwitansi = ambil('kwitansi', cfg.nomor_awal_kwitansi);\n    ['nomor_sp', 'nomor_bast', 'nomor_bap', 'nomor_kwitansi'].forEach(k => tulis(k, set[k]));\n    return { success: true, set: set };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Hapus set LPJ yang dibuat dari RKAS (set dari BKU selalu dibentuk ulang dari BKU) */\nfunction hapusLpjSet_(key) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const r = lpjRows_('lpj_set').find(x => String(x.key) === String(key));\n    if (r) lpjSheet_('lpj_set').deleteRow(r._row);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Volume item di set LPJ: tersimpan langsung, atau jumlah \u00f7 harga untuk set lama */\nfunction lpjVolumeItem_(it) {\n  if (Number(it.volume) > 0) return Number(it.volume);\n  return Number(it.harga) > 0 ? Math.round((Number(it.jumlah) || 0) / Number(it.harga) * 100) / 100 : 0;\n}\n\n/** Kunci item RKAS di set LPJ: uraian + kode rekening */\nfunction lpjKunciItemRkas_(it) {\n  return lpjKunciBarang_(it.uraian) + '|' + String(it.kode_rekening || '').replace(/^'/, '').trim();\n}\n\nfunction lpjKunciBarang_(s) {\n  return String(s || '').replace(/[\\u200B-\\u200D\\u2060\\uFEFF\\u00AD]/g, '').replace(/\\u00A0/g, ' ').replace(/[\\u201C\\u201D\\u2033]/g, '\"').replace(/[\\u2018\\u2019\\u2032]/g, \"'\").toLowerCase().replace(/[-\\s]+$/g, '').replace(/\\s+/g, ' ').trim();\n}\n\n/* =====================================================================\n * ASET GAMBAR (logo, kop, latar login) - disimpan terpotong di sheet \"aset\"\n * ===================================================================== */\nconst ASET_KUNCI_ = ['logo_kiri', 'logo_kanan', 'logo_aplikasi', 'logo_login', 'wallpaper_url'];\n\nfunction getAset_() {\n  try {\n    const kumpul = {};\n    lpjRows_('aset').forEach(r => {\n      const k = String(r.key);\n      if (!kumpul[k]) kumpul[k] = [];\n      kumpul[k].push({ i: Number(r.bagian) || 0, d: String(r.data) });\n    });\n    const aset = {};\n    Object.keys(kumpul).forEach(k => { aset[k] = kumpul[k].sort((a, b) => a.i - b.i).map(x => x.d).join(''); });\n    return { success: true, aset: aset };\n  } catch (e) { return { success: false, message: e.toString() }; }\n}\n\nfunction simpanAset_(key, dataUrl) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (ASET_KUNCI_.indexOf(key) < 0) return { success: false, message: 'Jenis gambar tidak dikenal.' };\n    const s = String(dataUrl || '');\n    if (s.indexOf('data:image/') !== 0) return { success: false, message: 'Data gambar tidak valid.' };\n    if (s.length > 2000000) return { success: false, message: 'Gambar terlalu besar.' };\n    asetHapusBaris_(key);\n    const sh = lpjSheet_('aset');\n    const potongan = [];\n    for (let i = 0; i < s.length; i += 45000) potongan.push([key, String(potongan.length), s.substr(i, 45000)]);\n    sh.getRange(sh.getLastRow() + 1, 1, potongan.length, 3).setNumberFormat('@').setValues(potongan);\n    faviconIkutLogo_(key, s);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusAset_(key) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try { asetHapusBaris_(key); faviconIkutLogo_(key, ''); return { success: true }; }\n  catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction asetHapusBaris_(key) {\n  const sh = lpjSheet_('aset');\n  lpjRows_('aset').filter(r => String(r.key) === String(key)).map(r => r._row).sort((a, b) => b - a).forEach(n => sh.deleteRow(n));\n}\n\n/* =====================================================================\n * MULTI-SEKOLAH: SUPER ADMIN, IZIN (TOKEN), AKUN, SESI\n * ---------------------------------------------------------------------\n * - Spreadsheet MASTER (dibuat otomatis) berisi daftar sekolah, izin, akun.\n * - Setiap sekolah punya spreadsheet data sendiri.\n * - Semua permintaan dari aplikasi masuk lewat api(sesi, metode, argumen);\n *   fungsi data lain berakhiran \"_\" sehingga tidak bisa dipanggil langsung.\n * ===================================================================== */\nlet CTX_ = null;                       // konteks permintaan: { ss, sekolah_id, username, role }\nfunction ss_() { return (CTX_ && CTX_.ss) ? CTX_.ss : SpreadsheetApp.getActiveSpreadsheet(); }\n\nconst MASTER_SHEETS_ = {\n  sekolah: ['id', 'nama', 'spreadsheet_id', 'dibuat'],\n  izin: ['sekolah_id', 'token', 'berlaku_sampai', 'status', 'diubah'],\n  akun: ['username', 'hash', 'salt', 'role', 'sekolah_id', 'nama', 'dibuat', 'terakhir_masuk'],\n  pesanan: ['ref_id', 'dibuat', 'nama', 'email', 'hp', 'produk', 'total', 'event', 'status', 'token', 'sekolah_id', 'kirim', 'catatan']\n};\nconst SESI_DETIK_ = 6 * 60 * 60;\n\nfunction props_() { return PropertiesService.getScriptProperties(); }\nfunction master_() {\n  const id = props_().getProperty('MASTER_ID');\n  if (!id) throw new Error('Aplikasi belum dipasang.');\n  return SpreadsheetApp.openById(id);\n}\nfunction mSheet_(name) {\n  const ss = master_();\n  let sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    sh.getRange('A:Z').setNumberFormat('@');\n    sh.getRange(1, 1, 1, MASTER_SHEETS_[name].length).setValues([MASTER_SHEETS_[name]]);\n  }\n  return sh;\n}\nfunction mRows_(name) {\n  const v = mSheet_(name).getDataRange().getValues();\n  const head = v.shift().map(String);\n  return v.map((r, i) => { const o = { _row: i + 2 }; head.forEach((h, j) => o[h] = r[j] === null || r[j] === undefined ? '' : String(r[j])); return o; })\n    .filter(o => String(o[head[0]]).trim() !== '');\n}\nfunction mWrite_(name, obj, row) {\n  const sh = mSheet_(name);\n  const data = MASTER_SHEETS_[name].map(h => obj[h] === undefined || obj[h] === null ? '' : String(obj[h]));\n  sh.getRange(row || sh.getLastRow() + 1, 1, 1, data.length).setNumberFormat('@').setValues([data]);\n}\nfunction hariIni_() { return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd'); }\nfunction tambahTahun_(n) { const d = new Date(); d.setFullYear(d.getFullYear() + (n || 1)); return Utilities.formatDate(d, Session.getScriptTimeZone(), 'yyyy-MM-dd'); }\nfunction hash_(salt, pass) {\n  return Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + pass, Utilities.Charset.UTF_8));\n}\nfunction acak_(n) {\n  const huruf = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n  let s = '';\n  while (s.length < n) Utilities.getUuid().replace(/-/g, '').toUpperCase().split('').forEach(c => { if (s.length < n && huruf.indexOf(c) >= 0) s += c; });\n  return s;\n}\nfunction tokenBaru_() { const a = acak_(12); return 'SPB-' + a.slice(0, 4) + '-' + a.slice(4, 8) + '-' + a.slice(8, 12); }\nfunction validTanggal_(s) { return /^\\d{4}-\\d{2}-\\d{2}$/.test(String(s || '')); }\n\n// Status izin sekolah: { ok, pesan, berlaku_sampai }\nfunction cekIzin_(sekolahId) {\n  const iz = mRows_('izin').find(r => r.sekolah_id === String(sekolahId));\n  if (!iz) return { ok: false, pesan: 'Izin akses sekolah tidak ditemukan. Hubungi super admin.' };\n  if (iz.status !== 'aktif') return { ok: false, pesan: 'Izin akses sekolah ini telah dicabut. Hubungi super admin.', berlaku_sampai: iz.berlaku_sampai };\n  if (iz.berlaku_sampai < hariIni_()) return { ok: false, pesan: 'Masa berlaku akses telah habis (' + iz.berlaku_sampai + '). Hubungi super admin untuk perpanjangan.', berlaku_sampai: iz.berlaku_sampai };\n  return { ok: true, berlaku_sampai: iz.berlaku_sampai };\n}\n\nfunction buatSesi_(akun) {\n  const id = Utilities.getUuid() + Utilities.getUuid();\n  const isi = { username: akun.username, role: akun.role, sekolah_id: akun.sekolah_id };\n  if (akun.role === 'superadmin') isi.gen = props_().getProperty('SESI_SUPER_GEN') || '';\n  CacheService.getScriptCache().put('sesi_' + id, JSON.stringify(isi), SESI_DETIK_);\n  return id;\n}\n\nfunction infoPengguna_(akun) {\n  const info = { username: akun.username, nama: akun.nama || akun.username, role: akun.role };\n  if (akun.role !== 'superadmin') {\n    const sk = mRows_('sekolah').find(s => s.id === akun.sekolah_id) || {};\n    const iz = cekIzin_(akun.sekolah_id);\n    info.sekolah_id = akun.sekolah_id; info.sekolah = sk.nama || ''; info.berlaku_sampai = iz.berlaku_sampai || '';\n  }\n  return info;\n}\n\n/* ---------------- Fungsi publik (tanpa sesi) ---------------- */\n\n/** Jalankan dari editor Apps Script untuk mendapatkan kode pemasangan pertama (lihat Log Eksekusi). */\nfunction kodePemasangan() {\n  // Hanya pemilik skrip (dijalankan dari editor) yang boleh membuat kode; pengunjung web ditolak\n  const aktif = Session.getActiveUser().getEmail(), pemilik = Session.getEffectiveUser().getEmail();\n  if (!aktif || aktif !== pemilik) return;\n  if (props_().getProperty('MASTER_ID')) { Logger.log('Aplikasi sudah dipasang. Kode pemasangan tidak diperlukan lagi.'); return; }\n  const kode = acak_(8);\n  props_().setProperty('KODE_PASANG', kode);\n  Logger.log('KODE PEMASANGAN: ' + kode);\n}\n\n/**\n * Lupa password super admin: jalankan dari editor Apps Script, lalu lihat Log Eksekusi.\n * Membuat password sementara baru, mengeluarkan semua sesi super admin yang sedang aktif.\n * Jika akun super admin tidak ada lagi di file Master, akun \"superadmin\" dibuat ulang.\n */\nfunction resetPasswordSuperAdmin() {\n  // Hanya pemilik skrip (dijalankan dari editor) yang boleh mereset\n  const aktif = Session.getActiveUser().getEmail(), pemilik = Session.getEffectiveUser().getEmail();\n  if (!aktif || aktif !== pemilik) return;\n  if (!props_().getProperty('MASTER_ID')) { Logger.log('Aplikasi belum dipasang. Jalankan kodePemasangan lalu lakukan pemasangan pertama dari aplikasi web.'); return; }\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const sh = mSheet_('akun'), kol = MASTER_SHEETS_.akun;\n    let daftar = mRows_('akun').filter(a => a.role === 'superadmin');\n    const sementara = acak_(10);\n    if (!daftar.length) {\n      const salt = Utilities.getUuid();\n      mWrite_('akun', { username: 'superadmin', hash: hash_(salt, sementara), salt: salt, role: 'superadmin', sekolah_id: '', nama: 'Super Admin', dibuat: lpjNow_() });\n      Logger.log('Akun super admin tidak ditemukan, akun baru dibuat.');\n      daftar = [{ username: 'superadmin' }];\n    } else {\n      daftar.forEach(a => {\n        const salt = Utilities.getUuid();\n        sh.getRange(a._row, kol.indexOf('hash') + 1).setNumberFormat('@').setValue(hash_(salt, sementara));\n        sh.getRange(a._row, kol.indexOf('salt') + 1).setNumberFormat('@').setValue(salt);\n      });\n    }\n    // Sesi super admin lama tidak berlaku lagi\n    props_().setProperty('SESI_SUPER_GEN', String(Date.now()));\n    Logger.log('USERNAME SUPER ADMIN: ' + daftar.map(a => a.username).join(', '));\n    Logger.log('PASSWORD SEMENTARA : ' + sementara);\n    Logger.log('Segera masuk ke aplikasi dan ganti password lewat tombol \"Ganti password\".');\n  } finally { lock.releaseLock(); }\n}\n\nfunction statusPemasangan() {\n  try {\n    if (props_().getProperty('MASTER_ID')) return { terpasang: true };\n    let nama = '';\n    try { const kop = getKopSurat_(); nama = kop.sekolah || ''; } catch (e) {}\n    return { terpasang: false, nama_sekolah_ini: nama };\n  } catch (e) { return { terpasang: false, nama_sekolah_ini: '' }; }\n}\n\n/** Pemasangan pertama: buat master + akun super admin (+ daftarkan spreadsheet ini sebagai sekolah pertama). */\nfunction pasangAplikasi(f) {\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    if (props_().getProperty('MASTER_ID')) return { success: false, message: 'Aplikasi sudah dipasang.' };\n    const kode = props_().getProperty('KODE_PASANG');\n    if (!kode || String(f.kode || '').trim().toUpperCase() !== kode) return { success: false, message: 'Kode pemasangan salah. Jalankan fungsi kodePemasangan di editor Apps Script untuk mendapatkan kode.' };\n    const u = String(f.username || '').trim().toLowerCase();\n    if (!/^[a-z0-9._-]{4,30}$/.test(u)) return { success: false, message: 'Username 4\u201330 karakter: huruf kecil, angka, titik, garis bawah, atau strip.' };\n    if (String(f.password || '').length < 8) return { success: false, message: 'Password minimal 8 karakter.' };\n\n    const ini = SpreadsheetApp.getActiveSpreadsheet();\n    const master = SpreadsheetApp.create('SIPEDABOS - Master');\n    props_().setProperty('MASTER_ID', master.getId());\n    masukkanKeFolder_(master.getId());\n    Object.keys(MASTER_SHEETS_).forEach(mSheet_);\n    const awal = master.getSheetByName('Sheet1'); if (awal && master.getSheets().length > 1) master.deleteSheet(awal);\n\n    const salt = Utilities.getUuid();\n    mWrite_('akun', { username: u, hash: hash_(salt, f.password), salt: salt, role: 'superadmin', sekolah_id: '', nama: f.nama || 'Super Admin', dibuat: lpjNow_() });\n\n    let token = '';\n    if (f.daftarkanIni) {\n      const id = 'S' + acak_(6);\n      mWrite_('sekolah', { id: id, nama: String(f.nama_sekolah || '').trim() || 'Sekolah 1', spreadsheet_id: ini.getId(), dibuat: lpjNow_() });\n      token = tokenBaru_();\n      mWrite_('izin', { sekolah_id: id, token: token, berlaku_sampai: validTanggal_(f.berlaku_sampai) ? f.berlaku_sampai : tambahTahun_(1), status: 'aktif', diubah: lpjNow_() });\n    }\n    props_().deleteProperty('KODE_PASANG');\n    return { success: true, token: token };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction masuk(username, password) {\n  try {\n    const u = String(username || '').trim().toLowerCase();\n    const akun = mRows_('akun').find(a => a.username === u);\n    if (!akun || hash_(akun.salt, String(password || '')) !== akun.hash) return { success: false, message: 'Username atau password salah.' };\n    if (akun.role !== 'superadmin') { const iz = cekIzin_(akun.sekolah_id); if (!iz.ok) return { success: false, message: iz.pesan }; }\n    mSheet_('akun').getRange(akun._row, MASTER_SHEETS_.akun.indexOf('terakhir_masuk') + 1).setNumberFormat('@').setValue(lpjNow_());\n    return { success: true, sesi: buatSesi_(akun), user: infoPengguna_(akun) };\n  } catch (e) { return { success: false, message: String(e.message || e) }; }\n}\n\n/** Bendahara mengaktifkan akses dengan token dari super admin, sekaligus membuat akun. */\nfunction aktivasiToken(f) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const token = String(f.token || '').trim().toUpperCase();\n    let iz = mRows_('izin').find(r => r.token === token);\n    // Token dari pembelian Lynk.id: sekolah dibuat saat aktivasi, nama sekolah diisi pembeli\n    const ps = iz ? null : mRows_('pesanan').find(r => r.token === token);\n    if (!iz && !ps) return { success: false, message: 'Token tidak dikenal. Periksa kembali token Anda.' };\n    if (ps && ps.status !== 'menunggu') return { success: false, message: ps.status === 'aktif' ? 'Token ini sudah dipakai untuk aktivasi. Silakan masuk dengan username Anda.' : 'Token pembelian ini tidak aktif. Silakan hubungi penjual.' };\n    const namaSekolah = String(f.nama_sekolah || '').trim();\n    if (ps && !namaSekolah) return { success: false, perluNamaSekolah: true, message: 'Token pembelian ditemukan. Isi nama sekolah Anda untuk membuat data sekolah.' };\n    if (iz) {\n      const cek = cekIzin_(iz.sekolah_id);\n      if (!cek.ok) return { success: false, message: cek.pesan };\n      if (mRows_('akun').some(a => a.sekolah_id === iz.sekolah_id)) return { success: false, message: 'Sekolah ini sudah punya akun. Silakan masuk, atau minta super admin mereset akun bila lupa password.' };\n    }\n    const u = String(f.username || '').trim().toLowerCase();\n    if (!/^[a-z0-9._-]{4,30}$/.test(u)) return { success: false, message: 'Username 4\u201330 karakter: huruf kecil, angka, titik, garis bawah, atau strip.' };\n    if (mRows_('akun').some(a => a.username === u)) return { success: false, message: 'Username sudah dipakai. Pilih username lain.' };\n    if (String(f.password || '').length < 8) return { success: false, message: 'Password minimal 8 karakter.' };\n    if (ps) {\n      if (mRows_('sekolah').some(s => s.nama.toLowerCase() === namaSekolah.toLowerCase())) return { success: false, perluNamaSekolah: true, message: 'Nama sekolah ini sudah terdaftar. Tulis nama sekolah lengkap (misalnya dengan kecamatan/kabupaten), atau hubungi penjual.' };\n      const baru = buatSekolah_(namaSekolah, tambahBulan_(masaLynk_()), token);\n      mWrite_('pesanan', Object.assign({}, ps, { status: 'aktif', sekolah_id: baru.id }), ps._row);\n      iz = mRows_('izin').find(r => r.token === token);\n    }\n    const salt = Utilities.getUuid();\n    const akun = { username: u, hash: hash_(salt, f.password), salt: salt, role: 'bendahara', sekolah_id: iz.sekolah_id, nama: String(f.nama || '').trim(), dibuat: lpjNow_(), terakhir_masuk: lpjNow_() };\n    mWrite_('akun', akun);\n    return { success: true, sesi: buatSesi_(akun), user: infoPengguna_(akun) };\n  } catch (e) { return { success: false, message: String(e.message || e) }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction keluar(sesi) { try { CacheService.getScriptCache().remove('sesi_' + sesi); } catch (e) {} return { success: true }; }\n\n/* ---------------- Satu pintu untuk semua fungsi data ---------------- */\nconst API_SEKOLAH_ = {\n  getTableData: (n) => { if (['transaksi', 'bku'].indexOf(n) < 0) throw new Error('Data tidak tersedia.'); return getTableData_(n); },\n  // Satu panggilan untuk data awal (lebih cepat daripada 4 panggilan terpisah)\n  muatAwal: () => ({ kop: getKopSurat_(), transaksi: getTableData_('transaksi'), bku: getTableData_('bku'), aset: getAset_() }),\n  getKopSurat: () => getKopSurat_(), updateKopSurat: (d) => updateKopSurat_(d),\n  importTransaksi: (d, sd) => importTransaksi_(d, sd), clearAllTransactions: (sd) => clearAllTransactions_(sd),\n  importBKU: (d, i) => importBKU_(d, i), clearAllBKU: (sd) => clearAllBKU_(sd),\n  getLaporanData: () => getLaporanData_(), simpanLaporanIsian: (k, o) => simpanLaporanIsian_(k, o),\n  getRkasManual: (t, sd) => getRkasManual_(t, sd), simpanRkasManual: (t, d, sd) => simpanRkasManual_(t, d, sd),\n  pindahSumberTransaksi: (a, b) => pindahSumberTransaksi_(a, b), pindahSumberLpjSet: (k, sd) => pindahSumberLpjSet_(k, sd), pindahSumberBku: (a, b) => pindahSumberBku_(a, b),\n  getKib: () => getKib_(), simpanKib: (l) => simpanKib_(l), hapusKib: (ids) => hapusKib_(ids),\n  getLpjData: () => getLpjData_(), simpanVendor: (v) => simpanVendor_(v), hapusVendor: (id) => hapusVendor_(id),\n  simpanPegawai: (p) => simpanPegawai_(p), hapusPegawai: (id) => hapusPegawai_(id), simpanNomorCfg: (c) => simpanNomorCfg_(c),\n  simpanLpjSet: (p) => simpanLpjSet_(p), gabungLpjSet: (k) => gabungLpjSet_(k), pisahLpjSet: (k) => pisahLpjSet_(k), kunciNomorLpjSet: (k) => kunciNomorLpjSet_(k), hapusLpjSet: (k) => hapusLpjSet_(k),\n  getAset: () => getAset_(), simpanAset: (k, d) => simpanAset_(k, d), hapusAset: (k) => hapusAset_(k),\n  gantiPassword: (lama, baru) => gantiPassword_(lama, baru)\n};\nconst API_SUPER_ = {\n  daftarSekolah: () => daftarSekolah_(), tambahSekolah: (f) => tambahSekolah_(f),\n  aturIzin: (id, f) => aturIzin_(id, f), tokenBaruSekolah: (id) => tokenBaruSekolah_(id), resetAkun: (id) => resetAkun_(id),\n  gantiPassword: (lama, baru) => gantiPassword_(lama, baru),\n  rapikanFolder: () => rapikanFolder_(), hapusSekolah: (id, opsi) => hapusSekolah_(id, opsi),\n  daftarPesanan: () => daftarPesanan_(), simpanPengaturanLynk: (f) => simpanPengaturanLynk_(f), kunciLynkBaru: () => kunciLynkBaru_(),\n  kirimUlangPesanan: (ref) => kirimTokenPesanan_(ref), terbitkanPesanan: (ref) => terbitkanPesanan_(ref),\n  pesananManual: (f) => pesananManual_(f), hapusPesanan: (ref) => hapusPesanan_(ref), ubahKontakPesanan: (ref, f) => ubahKontakPesanan_(ref, f)\n};\n\nfunction api(sesi, metode, args) {\n  CTX_ = null;\n  try {\n    const raw = sesi ? CacheService.getScriptCache().get('sesi_' + sesi) : null;\n    if (!raw) return { ok: false, auth: false, message: 'Sesi telah berakhir. Silakan masuk kembali.' };\n    const s = JSON.parse(raw);\n    CacheService.getScriptCache().put('sesi_' + sesi, raw, SESI_DETIK_);   // perpanjang sesi selama aktif\n    if (s.role === 'superadmin') {\n      if ((s.gen || '') !== (props_().getProperty('SESI_SUPER_GEN') || '')) { keluar(sesi); return { ok: false, auth: false, message: 'Password super admin telah direset. Silakan masuk kembali.' }; }\n      // Super admin memilih sekolah yang datanya ingin dikelola ('' = kembali ke panel)\n      if (metode === 'kelolaSekolah') {\n        const id = String((args || [])[0] || '');\n        if (!id) { delete s.sekolah_aktif; delete s.sekolah_ssid; CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_); return { ok: true, data: { success: true } }; }\n        const sk = mRows_('sekolah').find(x => x.id === id);\n        if (!sk) return { ok: true, data: { success: false, message: 'Data sekolah tidak ditemukan.' } };\n        SpreadsheetApp.openById(sk.spreadsheet_id);   // pastikan spreadsheet sekolah masih bisa dibuka\n        s.sekolah_aktif = id; s.sekolah_ssid = sk.spreadsheet_id;\n        CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_);\n        return { ok: true, data: { success: true, sekolah: { id: sk.id, nama: sk.nama } } };\n      }\n      const f = API_SUPER_[metode];\n      if (f) {\n        CTX_ = { username: s.username, role: s.role };\n        return { ok: true, data: f.apply(null, args || []) };\n      }\n      // Fungsi data BOS: dijalankan pada sekolah yang sedang dikelola super admin\n      const fs = API_SEKOLAH_[metode];\n      if (!fs) return { ok: false, message: 'Fungsi tidak dikenal.' };\n      if (!s.sekolah_aktif) return { ok: false, message: 'Pilih sekolah yang akan dikelola dari Panel Super Admin.' };\n      let ssidA = s.sekolah_ssid;\n      if (!ssidA) {\n        const ska = mRows_('sekolah').find(x => x.id === s.sekolah_aktif);\n        if (!ska) return { ok: false, message: 'Data sekolah tidak ditemukan.' };\n        ssidA = s.sekolah_ssid = ska.spreadsheet_id;\n        CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_);\n      }\n      CTX_ = { ss: SpreadsheetApp.openById(ssidA), sekolah_id: s.sekolah_aktif, username: s.username, role: s.role };\n      return { ok: true, data: fs.apply(null, args || []) };\n    }\n    const f = API_SEKOLAH_[metode];\n    if (!f) return { ok: false, message: 'Fungsi tidak dikenal.' };\n    // Pemeriksaan akun & izin di file Master disimpan sementara (maks. 10 menit) agar setiap klik tidak membuka file Master.\n    // Perubahan izin/akun oleh super admin menaikkan VERSI_IZIN sehingga pemeriksaan langsung diulang.\n    const versi = props_().getProperty('VERSI_IZIN') || '0', kini = Date.now();\n    let ssid = s.cek && s.cek.v === versi && kini - s.cek.t < 600000 && s.cek.hari === hariIni_() ? s.cek.ssid : '';\n    if (!ssid) {\n      if (!mRows_('akun').some(a => a.username === s.username)) { keluar(sesi); return { ok: false, auth: false, message: 'Akun tidak ditemukan. Hubungi super admin.' }; }\n      const izin = cekIzin_(s.sekolah_id);\n      if (!izin.ok) { keluar(sesi); return { ok: false, auth: false, message: izin.pesan }; }\n      const sk = mRows_('sekolah').find(x => x.id === s.sekolah_id);\n      if (!sk) return { ok: false, auth: false, message: 'Data sekolah tidak ditemukan.' };\n      ssid = sk.spreadsheet_id;\n      s.cek = { v: versi, t: kini, hari: hariIni_(), ssid: ssid };\n      CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_);\n    }\n    CTX_ = { ss: SpreadsheetApp.openById(ssid), sekolah_id: s.sekolah_id, username: s.username, role: s.role };\n    return { ok: true, data: f.apply(null, args || []) };\n  } catch (e) {\n    return { ok: false, message: String(e.message || e) };\n  } finally { CTX_ = null; }\n}\n\n/* ---------------- Fungsi akun ---------------- */\nfunction gantiPassword_(lama, baru) {\n  const akun = mRows_('akun').find(a => a.username === CTX_.username);\n  if (!akun || hash_(akun.salt, String(lama || '')) !== akun.hash) return { success: false, message: 'Password lama salah.' };\n  if (String(baru || '').length < 8) return { success: false, message: 'Password baru minimal 8 karakter.' };\n  const salt = Utilities.getUuid();\n  const sh = mSheet_('akun'), kol = MASTER_SHEETS_.akun;\n  sh.getRange(akun._row, kol.indexOf('hash') + 1).setNumberFormat('@').setValue(hash_(salt, baru));\n  sh.getRange(akun._row, kol.indexOf('salt') + 1).setNumberFormat('@').setValue(salt);\n  return { success: true };\n}\n\n/* ---------------- Fungsi super admin ---------------- */\nfunction daftarSekolah_() {\n  const izin = mRows_('izin'), akun = mRows_('akun'), hari = hariIni_();\n  const data = mRows_('sekolah').map(s => {\n    const iz = izin.find(i => i.sekolah_id === s.id) || {};\n    const ak = akun.find(a => a.sekolah_id === s.id) || null;\n    const status = iz.status !== 'aktif' ? 'dicabut' : (iz.berlaku_sampai < hari ? 'habis' : 'aktif');\n    return { id: s.id, nama: s.nama, dibuat: s.dibuat, url: 'https://docs.google.com/spreadsheets/d/' + s.spreadsheet_id + '/edit',\n      token: iz.token || '', berlaku_sampai: iz.berlaku_sampai || '', status: status,\n      akun: ak ? { username: ak.username, nama: ak.nama, terakhir_masuk: ak.terakhir_masuk } : null };\n  });\n  const folderId = props_().getProperty('FOLDER_ID');\n  return { success: true, sekolah: data, hari_ini: hari, folder_url: folderId ? 'https://drive.google.com/drive/folders/' + folderId : '' };\n}\n\n// ===================================================================\n// FOLDER DATA SEKOLAH: semua spreadsheet (Master + sekolah) di satu folder Google Drive\n// ===================================================================\nfunction folderData_() {\n  const p = props_(), id = p.getProperty('FOLDER_ID');\n  if (id) { try { const f = DriveApp.getFolderById(id); if (!f.isTrashed()) return f; } catch (e) {} }\n  const f = DriveApp.createFolder('SIPEDABOS - Data Sekolah');\n  p.setProperty('FOLDER_ID', f.getId());\n  return f;\n}\n\nfunction masukkanKeFolder_(fileId) {\n  try { DriveApp.getFileById(fileId).moveTo(folderData_()); return true; } catch (e) { return false; }\n}\n\n/** Pindahkan file Master dan semua spreadsheet sekolah ke folder data sekolah */\nfunction rapikanFolder_() {\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const folder = folderData_(), gagal = [];\n    let pindah = 0;\n    const masterId = props_().getProperty('MASTER_ID');\n    if (masterId) { if (masukkanKeFolder_(masterId)) pindah++; else gagal.push('SIPEDABOS - Master'); }\n    mRows_('sekolah').forEach(s => { if (masukkanKeFolder_(s.spreadsheet_id)) pindah++; else gagal.push(s.nama); });\n    return { success: true, dipindah: pindah, gagal: gagal, folder_url: folder.getUrl() };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Jalankan sekali dari editor setelah update: memberi izin Google Drive dan membuat folder data sekolah */\nfunction izinkanAksesDrive() {\n  const f = folderData_();\n  Logger.log('Folder data sekolah: ' + f.getUrl());\n  Logger.log('Izin Google Drive sudah aktif. Buka Panel Super Admin lalu klik \"Rapikan ke folder\" untuk memindahkan spreadsheet yang sudah ada.');\n}\n\n/**\n * Hapus sekolah dari aplikasi: data sekolah, izin, dan akun bendaharanya.\n * opsi.hapusFile = true: spreadsheet sekolah dipindahkan ke Sampah Google Drive (bisa dipulihkan 30 hari).\n */\nfunction hapusSekolah_(id, opsi) {\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    id = String(id || '');\n    const sk = mRows_('sekolah').find(x => x.id === id);\n    if (!sk) return { success: false, message: 'Sekolah tidak ditemukan.' };\n    const hapusBaris = (nama, cocok) => { const sh = mSheet_(nama); mRows_(nama).filter(cocok).map(r => r._row).sort((a, b) => b - a).forEach(n => sh.deleteRow(n)); };\n    hapusBaris('akun', a => a.sekolah_id === id && a.role !== 'superadmin');\n    hapusBaris('izin', i => i.sekolah_id === id);\n    hapusBaris('sekolah', x => x.id === id);\n    ubahVersiIzin_();\n    let file = 'tetap';\n    if (opsi && opsi.hapusFile) {\n      // Spreadsheet tempat skrip ini menempel dan file Master tidak boleh dibuang\n      let aktifId = ''; try { aktifId = SpreadsheetApp.getActiveSpreadsheet().getId(); } catch (e) {}\n      if (sk.spreadsheet_id === aktifId || sk.spreadsheet_id === props_().getProperty('MASTER_ID')) file = 'dilindungi';\n      else { try { DriveApp.getFileById(sk.spreadsheet_id).setTrashed(true); file = 'sampah'; } catch (e) { file = 'gagal'; } }\n    }\n    return { success: true, nama: sk.nama, file: file };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n\nfunction tambahSekolah_(f) {\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const nama = String(f.nama || '').trim();\n    if (!nama) return { success: false, message: 'Nama sekolah wajib diisi.' };\n    if (mRows_('sekolah').some(s => s.nama.toLowerCase() === nama.toLowerCase())) return { success: false, message: 'Sekolah dengan nama ini sudah terdaftar.' };\n    const berlaku = validTanggal_(f.berlaku_sampai) ? f.berlaku_sampai : tambahTahun_(1);\n    const r = buatSekolah_(nama, berlaku, tokenBaru_());\n    return { success: true, id: r.id, token: r.token };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n// Membuat spreadsheet + data sekolah + izin (tanpa kunci; pemanggil memegang LockService)\nfunction buatSekolah_(nama, berlaku, token) {\n  const ss = SpreadsheetApp.create('SIPEDABOS - ' + nama);\n  masukkanKeFolder_(ss.getId());   // spreadsheet sekolah dikumpulkan di satu folder\n  const simpan = CTX_;\n  CTX_ = Object.assign({}, CTX_, { ss: ss });\n  try {\n    setupDatabase_();\n    updateKopSurat_(Object.assign(getKopSurat_(), { sekolah: nama.toUpperCase() }));\n  } finally { CTX_ = simpan; }\n  const awal = ss.getSheetByName('Sheet1'); if (awal && ss.getSheets().length > 1) ss.deleteSheet(awal);\n  const id = 'S' + acak_(6);\n  mWrite_('sekolah', { id: id, nama: nama, spreadsheet_id: ss.getId(), dibuat: lpjNow_() });\n  mWrite_('izin', { sekolah_id: id, token: token, berlaku_sampai: berlaku, status: 'aktif', diubah: lpjNow_() });\n  return { id: id, token: token };\n}\n\n/** f: { berlaku_sampai?: 'yyyy-MM-dd', status?: 'aktif' | 'dicabut' } */\nfunction aturIzin_(id, f) {\n  const iz = mRows_('izin').find(i => i.sekolah_id === String(id));\n  if (!iz) return { success: false, message: 'Izin sekolah tidak ditemukan.' };\n  if (f.berlaku_sampai !== undefined && !validTanggal_(f.berlaku_sampai)) return { success: false, message: 'Tanggal berlaku tidak valid.' };\n  if (f.status !== undefined && ['aktif', 'dicabut'].indexOf(f.status) < 0) return { success: false, message: 'Status tidak valid.' };\n  mWrite_('izin', Object.assign({}, iz, f, { diubah: lpjNow_() }), iz._row);\n  ubahVersiIzin_();\n  return { success: true };\n}\n\nfunction tokenBaruSekolah_(id) {\n  const iz = mRows_('izin').find(i => i.sekolah_id === String(id));\n  if (!iz) return { success: false, message: 'Izin sekolah tidak ditemukan.' };\n  const token = tokenBaru_();\n  mWrite_('izin', Object.assign({}, iz, { token: token, diubah: lpjNow_() }), iz._row);\n  ubahVersiIzin_();\n  return { success: true, token: token };\n}\n\n/** Hapus akun bendahara sekolah (misal lupa password). Token yang sama bisa dipakai lagi untuk aktivasi. */\nfunction resetAkun_(id) {\n  const ak = mRows_('akun').find(a => a.sekolah_id === String(id) && a.role !== 'superadmin');\n  if (ak) mSheet_('akun').deleteRow(ak._row);\n  ubahVersiIzin_();\n  return { success: true };\n}\n\n/** Tandai bahwa izin/akun berubah: sesi bendahara akan diperiksa ulang di file Master pada klik berikutnya */\nfunction ubahVersiIzin_() {\n  props_().setProperty('VERSI_IZIN', String(Date.now()));\n}\n\n/* =====================================================================\n * PEMBELIAN LYNK.ID: token otomatis setelah pembayaran\n * ---------------------------------------------------------------------\n * - Lynk.id (Settings > Integrations > Webhook) mengirim data pesanan ke doPost.\n * - Alamat webhook memakai kunci rahasia (?kunci=...) agar tidak bisa dipalsukan.\n * - Satu nomor pesanan = satu token. Sekolah baru dibuat saat pembeli aktivasi\n *   (nama sekolah diisi sendiri oleh pembeli), masa akses dihitung sejak aktivasi.\n * ===================================================================== */\nfunction doPost(e) {\n  let hasil;\n  try { hasil = terimaLynk_(e); } catch (err) { hasil = { success: false, message: String(err.message || err) }; }\n  return ContentService.createTextOutput(JSON.stringify(hasil)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction kunciLynk_() {\n  cons

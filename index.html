t p = props_();\n  let k = p.getProperty('LYNK_KUNCI');\n  if (!k) { k = acak_(24); p.setProperty('LYNK_KUNCI', k); }\n  return k;\n}\nfunction urlAplikasi_() { try { return ScriptApp.getService().getUrl() || ''; } catch (e) { return ''; } }\nfunction urlWebhookLynk_() { const u = urlAplikasi_(); return u ? u + '?kunci=' + kunciLynk_() : ''; }\nfunction masaLynk_() { const n = parseInt(props_().getProperty('LYNK_MASA') || '12', 10); return n > 0 && n <= 120 ? n : 12; }\nfunction tambahBulan_(n) { const d = new Date(); d.setMonth(d.getMonth() + n); return Utilities.formatDate(d, Session.getScriptTimeZone(), 'yyyy-MM-dd'); }\n\n// Cari nilai pertama (teks/angka) dengan nama kunci tertentu di objek bersarang\nfunction cariNilai_(o, kunci, dalam) {\n  if (!o || typeof o !== 'object' || (dalam || 0) > 6) return '';\n  for (let i = 0; i < kunci.length; i++) {\n    const v = o[kunci[i]];\n    if (v !== undefined && v !== null && typeof v !== 'object' && String(v).trim() !== '') return String(v).trim();\n  }\n  const ks = Object.keys(o);\n  for (let j = 0; j < ks.length; j++) {\n    const v = o[ks[j]];\n    if (v && typeof v === 'object') { const r = cariNilai_(v, kunci, (dalam || 0) + 1); if (r) return r; }\n  }\n  return '';\n}\n\nfunction bacaPesananLynk_(isi) {\n  const md = (isi.data && isi.data.message_data) || isi.message_data || isi.data || isi;\n  const cust = (md && (md.customer || md.buyer)) || {};\n  const items = (md && (md.items || md.products)) || [];\n  const produk = Array.isArray(items) ? items.map(it => String((it && (it.title || it.name || it.product_name)) || '').trim()).filter(Boolean).join(', ') : '';\n  let ref = String((md && (md.ref_id || md.refId)) || '').trim() || cariNilai_(isi, ['ref_id', 'refId', 'order_id', 'trx_id', 'transaction_id', 'invoice_id', 'invoice']);\n  if (!ref) ref = 'TANPA-' + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, JSON.stringify(isi), Utilities.Charset.UTF_8)).slice(0, 10).toUpperCase();\n  const tot = (md && md.totals) || {};\n  return {\n    ref_id: ref,\n    nama: String(cust.name || cust.full_name || '').trim() || cariNilai_(isi, ['customer_name', 'buyer_name']),\n    email: (String(cust.email || '').trim() || cariNilai_(isi, ['customer_email', 'buyer_email', 'email'])).toLowerCase(),\n    hp: String(cust.phone || cust.phone_number || cust.whatsapp || '').trim() || cariNilai_(isi, ['customer_phone', 'buyer_phone', 'phone', 'phone_number', 'whatsapp']),\n    produk: produk || cariNilai_(isi, ['product_title', 'product_name', 'title']),\n    total: String(tot.grand_total || tot.total_price || '').trim() || cariNilai_(isi, ['grand_total', 'total_price', 'amount', 'total']),\n    event: String(isi.event || isi.event_name || isi.type || '').trim() || cariNilai_(isi, ['event', 'event_name', 'status'])\n  };\n}\n\nfunction terimaLynk_(e) {\n  const kunci = String((e && e.parameter && e.parameter.kunci) || '');\n  if (!kunci || kunci !== props_().getProperty('LYNK_KUNCI')) return { success: false, message: 'Kunci webhook tidak valid.' };\n  let isi = {};\n  try { isi = JSON.parse((e.postData && e.postData.contents) || '{}'); } catch (err) { return { success: false, message: 'Data bukan JSON.' }; }\n  const p = bacaPesananLynk_(isi);\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  let baris;\n  try {\n    const ada = mRows_('pesanan').find(r => r.ref_id === p.ref_id);\n    const gagalBayar = /refund|cancel|batal|expire|fail|gagal|pending|unpaid|belum/i.test(p.event);\n    if (ada) {\n      if (/refund/i.test(p.event) && ada.status !== 'refund') mWrite_('pesanan', Object.assign({}, ada, { status: 'refund', catatan: 'Refund diterima ' + lpjNow_() + (ada.sekolah_id ? ' - cabut akses sekolah bila perlu' : '') }), ada._row);\n      return { success: true, ref_id: p.ref_id, duplikat: true };\n    }\n    const kata = String(props_().getProperty('LYNK_PRODUK') || '').trim().toLowerCase();\n    let status = 'menunggu', catatan = '';\n    if (gagalBayar) { status = 'diabaikan'; catatan = 'Status pembayaran: ' + p.event; }\n    else if (kata && String(p.produk).toLowerCase().indexOf(kata) < 0) { status = 'diabaikan'; catatan = 'Produk lain (bukan \"' + kata + '\")'; }\n    baris = Object.assign({}, p, { dibuat: lpjNow_(), status: status, token: status === 'menunggu' ? tokenBaru_() : '', sekolah_id: '', kirim: '', catatan: catatan });\n    mWrite_('pesanan', baris);\n  } finally { lock.releaseLock(); }\n  if (baris.status === 'menunggu') kirimTokenPesanan_(baris.ref_id);\n  return { success: true, ref_id: baris.ref_id, status: baris.status };\n}\n\nfunction pesanToken_(r) {\n  const url = urlAplikasi_();\n  return 'Terima kasih' + (r.nama ? ', ' + r.nama : '') + ', atas pembelian aplikasi SIPEDABOS.\\n\\n' +\n    'Token aktivasi Anda:\\n' + r.token + '\\n\\n' +\n    'Cara aktivasi:\\n' +\n    '1. Buka aplikasi' + (url ? ': ' + url : '') + '\\n' +\n    '2. Pilih tab \"Aktivasi Token\".\\n' +\n    '3. Masukkan token di atas, lalu isi nama sekolah, nama bendahara, username, dan password.\\n\\n' +\n    'Masa akses ' + masaLynk_() + ' bulan, dihitung sejak aktivasi.\\n' +\n    'Nomor pesanan: ' + r.ref_id;\n}\n\nfunction kirimTokenPesanan_(ref) {\n  const r = mRows_('pesanan').find(x => x.ref_id === String(ref));\n  if (!r || !r.token) return { success: false, message: 'Pesanan atau token tidak ditemukan.' };\n  const pesan = pesanToken_(r), hasil = [];\n  if (props_().getProperty('LYNK_EMAIL') !== '0' && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(r.email)) {\n    try {\n      const html = '<div style=\"font-family:Arial,sans-serif;font-size:14px;color:#1f2937;line-height:1.6\">' +\n        pesan.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/\\n/g, '<br>').replace(r.token, '<b style=\"font-size:18px;letter-spacing:1px\">' + r.token + '<\/b>') + '<\/div>';\n      const opsi = { to: r.email, subject: 'Token aktivasi SIPEDABOS - pesanan ' + r.ref_id, body: pesan, htmlBody: html, name: 'SIPEDABOS' };\n      try { const pemilik = Session.getEffectiveUser().getEmail(); if (pemilik) opsi.replyTo = pemilik; } catch (e) {}\n      MailApp.sendEmail(opsi); hasil.push('email diserahkan ke Google');\n    }\n    catch (e) { hasil.push('email gagal: ' + String(e.message || e).slice(0, 80)); }\n  }\n  const ft = props_().getProperty('FONNTE_TOKEN');\n  const hp = String(r.hp || '').replace(/[^0-9]/g, '');\n  if (ft && hp.length >= 9) {\n    try {\n      const res = UrlFetchApp.fetch('https://api.fonnte.com/send', { method: 'post', headers: { Authorization: ft }, payload: { target: hp, message: pesan, countryCode: '62' }, muteHttpExceptions: true });\n      let j = {}; try { j = JSON.parse(res.getContentText()); } catch (e) {}\n      hasil.push(j.status ? 'WA terkirim' : 'WA gagal: ' + String(j.reason || j.detail || res.getResponseCode()).slice(0, 80));\n    } catch (e) { hasil.push('WA gagal: ' + String(e.message || e).slice(0, 80)); }\n  }\n  const teks = (hasil.join('; ') || 'belum dikirim (tidak ada email/WA)') + ' \u00b7 ' + lpjNow_();\n  const kini = mRows_('pesanan').find(x => x.ref_id === String(ref));\n  if (kini) mWrite_('pesanan', Object.assign({}, kini, { kirim: teks }), kini._row);\n  return { success: true, kirim: teks, pesan: pesan };\n}\n\n/** Pembeli lupa/tidak menerima token: ambil dengan nomor pesanan + email pembelian. */\nfunction klaimTokenLynk(f) {\n  try {\n    const ref = String((f && f.ref) || '').trim(), email = String((f && f.email) || '').trim().toLowerCase();\n    if (!ref || !email) return { success: false, message: 'Isi nomor pesanan dan email pembelian.' };\n    const c = CacheService.getScriptCache(), kc = 'klaim_' + ref.toUpperCase().slice(0, 60);\n    const n = Number(c.get(kc) || 0);\n    if (n >= 8) return { success: false, message: 'Terlalu banyak percobaan. Coba lagi 1 jam lagi.' };\n    c.put(kc, String(n + 1), 3600);\n    const r = mRows_('pesanan').find(x => x.ref_id.toUpperCase() === ref.toUpperCase() && x.email === email);\n    if (!r) return { success: false, message: 'Pesanan tidak ditemukan. Periksa nomor pesanan dan email yang dipakai saat membeli di Lynk.id.' };\n    if (r.status === 'aktif') return { success: false, message: 'Token pesanan ini sudah dipakai untuk aktivasi. Silakan masuk dengan username Anda.' };\n    if (r.status !== 'menunggu' || !r.token) return { success: false, message: 'Pesanan ini belum bisa diaktifkan. Silakan hubungi penjual.' };\n    return { success: true, token: r.token };\n  } catch (e) { return { success: false, message: String(e.message || e) }; }\n}\n\n/* ---- Panel super admin: daftar pesanan & pengaturan ---- */\nfunction daftarPesanan_() {\n  const p = props_();\n  const sekolah = mRows_('sekolah');\n  const data = mRows_('pesanan').map(r => {\n    const sk = r.sekolah_id ? sekolah.find(s => s.id === r.sekolah_id) : null;\n    return { ref_id: r.ref_id, dibuat: r.dibuat, nama: r.nama, email: r.email, hp: r.hp, produk: r.produk, total: r.total, status: r.status, token: r.token, sekolah: sk ? sk.nama : '', kirim: r.kirim, catatan: r.catatan };\n  }).reverse();\n  return { success: true, pesanan: data, pengaturan: { url_aplikasi: urlAplikasi_(), url_webhook: urlWebhookLynk_(), produk: p.getProperty('LYNK_PRODUK') || '', masa: masaLynk_(), email_aktif: p.getProperty('LYNK_EMAIL') !== '0', fonnte_ada: !!p.getProperty('FONNTE_TOKEN') } };\n}\n\nfunction simpanPengaturanLynk_(f) {\n  const p = props_();\n  f = f || {};\n  if (f.produk !== undefined) p.setProperty('LYNK_PRODUK', String(f.produk || '').trim());\n  if (f.masa !== undefined) { const n = parseInt(f.masa, 10); if (!(n > 0 && n <= 120)) return { success: false, message: 'Masa akses 1\u2013120 bulan.' }; p.setProperty('LYNK_MASA', String(n)); }\n  if (f.email_aktif !== undefined) p.setProperty('LYNK_EMAIL', f.email_aktif ? '1' : '0');\n  if (f.hapus_fonnte) p.deleteProperty('FONNTE_TOKEN');\n  else if (String(f.fonnte_token || '').trim()) p.setProperty('FONNTE_TOKEN', String(f.fonnte_token).trim()) const runGas = (method, ...args) => new Promise((resolve, reject) => {
  if (typeof google === 'undefined') {
    resolve(null);
    return;
  }

  const g = google.script.run.withFailureHandler(reject);

  if (FUNGSI_PUBLIK.includes(method)) {
    g.withSuccessHandler(resolve)[method](...args);
    return;
  }

  g.withSuccessHandler(res => {
    if (res && res.ok) return resolve(res.data);

    if (res && res.auth === false) {
      window.dispatchEvent(new CustomEvent('sipedabos-sesi-habis', {
        detail: res.message
      }));
      return;
    }

    resolve({
      success: false,
      message: res && res.message || 'Gagal memproses permintaan.'

  }).api(sesiAktif(), method, args);

const formatNominal = val => {

const formatDateSafe = dateStr => {

const parseBkuArkas = pages => {
  const DATE_RE = /^(\d{2})[-/](\d{2})[-/](\d{4})$/;
  const NUM_RE = /^-?\d{1,3}(\.\d{3})*(,\d+)?$/;

  const toNum = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0;

  const rows = [];
  const warnings = [];
  const info = {
    bulan: '',
    tahun: '',
    sumber_dana: '',
    saldo_bank: null,
    saldo_tunai: null,
    saldo_bku: null
  };
  let lastCols = null;
  pages.forEach((rawItems, pIdx) => {
    const items = rawItems.filter(it => it.str && it.str.trim() !== '').map(it => ({
      str: it.str.trim(),
      x: it.transform[4],
      y: it.transform[5],
      w: it.width,
      cx: it.transform[4] + it.width / 2
    }));
    items.forEach(it => {
      const m = it.str.match(/BULAN\s*:\s*([A-Z]+)\s+TAHUN\s*:\s*(\d{4})/i);

      if (m) {
        info.bulan = m[1];
        info.tahun = m[2];
      }

      if (/^:\s*/.test(it.str)) {
        const label = items.find(o => Math.abs(o.y - it.y) < 2 && o.x < it.x && !/^:/.test(o.str));
        if (!label) return;
        const val = it.str.replace(/^:\s*/, '');
        const lbl = label.str.toLowerCase();
        if (lbl.startsWith('sumber dana')) info.sumber_dana = val;
        const rp = val.match(/^Rp\.?\s*([\d.,-]+)/i);

        if (rp) {
          if (lbl.includes('saldo buku kas umum')) info.saldo_bku = toNum(rp[1]);else if (lbl.includes('saldo bank')) info.saldo_bank = toNum(rp[1]);else if (lbl.includes('saldo kas tunai')) info.saldo_tunai = toNum(rp[1]);
        }
      }
    });
    let cols = null,
        topY = Infinity;
    const numCells = items.filter(it => /^[1-8]$/.test(it.str));
    const byY = {};
    numCells.forEach(it => {
      const k = Math.round(it.y);
      (byY[k] = byY[k] || []).push(it);
    });
    Object.values(byY).forEach(group => {
      const uniq = {};
      group.forEach(g => {
        uniq[g.str] = g.cx;
      });

      if (Object.keys(uniq).length === 8) {
        cols = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => uniq[n]);
        topY = group[0].y;
      }
    });
    if (cols) lastCols = cols;else if (lastCols) cols = lastCols;else return;
    const jumlahItem = items.find(it => /^jumlah$/i.test(it.str) && it.y < topY && it.cx > cols[4] && it.cx < cols[6]);
    const footer = items.find(it => /^halaman \d+ dari \d+/i.test(it.str));
    const bottomY = jumlahItem ? jumlahItem.y : footer ? footer.y : -Infinity;
    const region = items.filter(it => it.y < topY - 2 && it.y > bottomY + 2);
    const anchors = region.filter(it => DATE_RE.test(it.str) && Math.abs(it.cx - cols[1]) < Math.abs(it.cx - cols[2])).sort((a, b) => b.y - a.y).map(a => ({
      a,
      parts: {
        1: [],
        2: [],
        3: [],
        4: [],
        5: []
      },
      nums: []
    }));
    if (anchors.length === 0) return;
    const numZoneStart = (cols[5] + cols[6]) / 2;
    const uraianStart = cols[4] + (cols[4] - cols[3]) / 2;
    region.forEach(it => {
      if (anchors.some(r => r.a === it)) return;
      let best = anchors[0];
      anchors.forEach(r => {
        if (Math.abs(r.a.y - it.y) < Math.abs(best.a.y - it.y)) best = r;
      });

      if (it.cx > numZoneStart && NUM_RE.test(it.str)) {
        best.nums.push(it);
        return;
      }

      let col = 5;

      if (it.cx < uraianStart) {
        col = 1;
        [2, 3, 4].forEach(k => {
          if (Math.abs(it.cx - cols[k]) < Math.abs(it.cx - cols[col])) col = k;
        });
      }

      best.parts[col].push(it);
    });

    const joinParts = (arr, sep) => arr.sort((p, q) => Math.abs(p.y - q.y) > 2 ? q.y - p.y : p.x - q.x).map(p => p.str).join(sep).replace(/\s+/g, ' ').trim();

    anchors.forEach(r => {
      const nums = r.nums.sort((p, q) => p.x - q.x);
      let pen = 0,
          peng = 0,
          saldo = 0;

      if (nums.length === 3) {
        [pen, peng, saldo] = nums.map(n => toNum(n.str));
      } else {
        nums.forEach(n => {
          const d = [6, 7, 8].map(k => Math.abs(n.cx - cols[k]));
          const k = [6, 7, 8][d.indexOf(Math.min(...d))];
          if (k === 6) pen = toNum(n.str);else if (k === 7) peng = toNum(n.str);else saldo = toNum(n.str);
        });
        warnings.push("Hal. ".concat(pIdx + 1, ", ").concat(r.a.str, ": jumlah kolom nominal tidak lengkap (").concat(nums.length, "), mohon cek."));
      }

      const [, dd, mm, yyyy] = r.a.str.match(DATE_RE);
      const uraian = joinParts(r.parts[5], ' ');
      rows.push({
        tanggal: "".concat(dd, "-").concat(mm, "-").concat(yyyy),
        bulan: mm,
        kode_kegiatan: joinParts(r.parts[2], ''),
        kode_rekening: joinParts(r.parts[3], ''),
        no_bukti: joinParts(r.parts[4], ''),
        uraian,
        penerimaan: pen,
        pengeluaran: peng,
        saldo,
        jenis: /^saldo (bank|tunai) bulan/i.test(uraian) ? 'saldo_awal' : ''
      });
    });
  });
  let running = null;
  rows.forEach(r => {
    const expected = (running === null ? 0 : running) + r.penerimaan - r.pengeluaran;
    if (Math.abs(expected - r.saldo) > 0.5) warnings.push("".concat(r.tanggal, " \"").concat(r.uraian, "\": saldo tercetak ").concat(r.saldo.toLocaleString('id-ID'), ", hasil hitung ").concat(expected.toLocaleString('id-ID'), "."));
    running = r.saldo;
  });

  if (info.saldo_bku !== null && rows.length && Math.abs(rows[rows.length - 1].saldo - info.saldo_bku) > 0.5) {
    warnings.push("Saldo akhir baris (".concat(rows[rows.length - 1].saldo.toLocaleString('id-ID'), ") berbeda dengan Saldo BKU penutupan (").concat(info.saldo_bku.toLocaleString('id-ID'), ")."));
  }

  return {
    rows,
    info,
    warnings
  };
};

const LPJ = (() => {
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

  const parseTanggal = s => {
    const str = String(s || '').trim();
    let m = str.match(/^(\d{2})[-/](\d{2})[-/](\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    return null;
  };

  const tglPanjang = s => {
    const d = parseTanggal(s);
    return d ? "".concat(String(d.getDate()).padStart(2, '0'), " ").concat(BULAN[d.getMonth()], " ").concat(d.getFullYear()) : '-';
  };

  const tglPendek = s => {
    const d = parseTanggal(s);
    return d ? "".concat(String(d.getDate()).padStart(2, '0'), "-").concat(['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][d.getMonth()], "-").concat(d.getFullYear()) : '-';
  };

  const SATUAN = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];

  const eja = n => {
    n = Math.floor(Math.abs(n));
    if (n < 12) return SATUAN[n];
    if (n < 20) return eja(n - 10) + ' Belas';
    if (n < 100) return eja(Math.floor(n / 10)) + ' Puluh ' + eja(n % 10);
    if (n < 200) return 'Seratus ' + eja(n - 100);
    if (n < 1000) return eja(Math.floor(n / 100)) + ' Ratus ' + eja(n % 100);
    if (n < 2000) return 'Seribu ' + eja(n - 1000);
    if (n < 1e6) return eja(Math.floor(n / 1000)) + ' Ribu ' + eja(n % 1000);
    if (n < 1e9) return eja(Math.floor(n / 1e6)) + ' Juta ' + eja(n % 1e6);
    if (n < 1e12) return eja(Math.floor(n / 1e9)) + ' Miliar ' + eja(n % 1e9);
    return eja(Math.floor(n / 1e12)) + ' Triliun ' + eja(n % 1e12);
  };

  const terbilang = n => (Math.floor(Math.abs(Number(n) || 0)) === 0 ? 'Nol' : eja(n)).replace(/\s+/g, ' ').trim();

  const terbilangRupiah = n => terbilang(n) + ' Rupiah';

  const kalimatHariIni = s => {

  };

  const rupiah = n => (Number(n) || 0).toLocaleString('id-ID');

  const RE_ROMAWI = /^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII)$/;

  const isiFormat = (fmt, nomor, tanggal, ikutTanggal) => {

      if (ikutTanggal && RE_ROMAWI.test(t)) return ROMAWI[d.getMonth()];

  const kelompokkanBku = rows => {
    const sets = {};
    const urutan = [];
    let totalKeluar = 0,

    rows.forEach(r => {

      const d = parseTanggal(r.tanggal);
      const periode = d ? "".concat(d.getFullYear(), "-").concat(String(d.getMonth() + 1).padStart(2, '0')) : 'x';
      const keg = String(r.kode_kegiatan || '').replace(/^'/, '');
      const sdr = String(r.sumber_dana || '').trim();
      const key = "".concat(sdr && sdr !== 'bosp' ? sdr + '~' : '').concat(periode, "|").concat(r.no_bukti, "|").concat(keg);

      if (!sets[key]) {

          periode,
          no_bukti: r.no_bukti,

      const s = sets[key];

      s.items.push({

    const hasil = urutan.map(k => {

      delete s.jenisHitung;
      return { ...s,

    });
    const totalSet = hasil.reduce((a, s) => a + s.total, 0);
    return {
      sets: hasil,

  };

  const katalogRkas = transaksi => {
    const m = {},
          daftar = [];
    (transaksi || []).forEach(t => {
      const h = Number(t.harga_satuan) || 0;
      if (!h || !t.uraian) return;
      const k = kunciBarang(t.uraian);
      const v = {
        nama: rapikanNama(t.uraian),
        satuan: String(t.satuan || '').trim(),

      if (!m[k]) m[k] = v;

    return m;
  };

  const mirip = (a, b) => {
    if (a === b) return 1;
    const m = a.length,
          n = b.length;
    if (!m || !n) return 0;
    let prev = Array.from({
      length: n + 1
    }, (_, j) => j);

    for (let i = 1; i <= m; i++) {
      const cur = [i];

      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

    if (!rkas) return null;

    const harga = Number(sv && sv.harga || kt && kt.harga || 0);
    const satuan = sv && sv.satuan || kt && kt.satuan || '';
    const nama = sv && sv.nama || ktSimpan && ktSimpan.nama || rapikanNama(it.uraian);
    if (!(harga > 0) && !satuan && Number(it.jumlah) > 0) return { ...it,

      volume: 1,
      otomatis: true

    const volume = harga > 0 ? it.jumlah / harga : 0;
    return { ...it,
      nama,
      satuan,
      harga,
      volume
    };
  });

  const cekSet = (set, items, vendor) => {
    const masalah = [];
    if (set.jenis === 'barang' && !vendor) masalah.push('Toko belum dipilih');
    items.forEach(it => {

    });
    return masalah;
  };

  const formatNomorSppd = (cfg, nomor, tanggal, manual) => {
    if (String(manual || '').trim()) return String(manual).trim();
    if (!nomor) return '';
    if (String(cfg.sppd_sama) !== '0') return formatNomor(cfg, nomor, tanggal);
    const fmt = String(cfg.format_sppd || '').trim() || formatSuratLama(cfg.sppd_klasifikasi, cfg.sppd_kode_sekolah);

  const lamaHari = (a, b) => {

          d2 = parseTanggal(b);

  const hitungRincian = rows => rows.map(r => {
    const v = Number(r.volume) || 0,
          n = Number(r.harga) || 0;

  const cekPerjadin = (detail, rincian, pegawai) => {

    const pel = (detail.pelaksana || []).filter(Boolean);
    if (!pel.length) m.push('Pelaksana perjalanan belum dipilih');
    pel.forEach(id => {
      const p = pegawai.find(x => x.id === id);
      if (!p) m.push('Ada pelaksana yang sudah dihapus dari daftar pegawai');
    });
    if (!String(detail.maksud || '').trim()) m.push('Maksud perjalanan kosong');

    });

    const persen = Number(r.pph_persen) || 0;
    const pph = Math.round(bruto * persen / 100);
    return { ...r,
      bruto,
      pph_persen: persen,
      pph,
      netto: bruto - pph
    };
  });

  const cekHonor = (set, rows, pegawai) => {
    const m = [];
    if (!rows.length) m.push('Belum ada penerima honor');
    rows.forEach((r, i) => {
      const p = pegawai.find(x => x.id === r.pegawai_id);
      if (!p) m.push("Penerima baris ".concat(i + 1, " belum dipilih"));
      if (!(r.bruto > 0)) m.push("Jumlah honor baris ".concat(i + 1, " kosong"));
    });
    const tot = rows.reduce((a, r) => a + r.bruto, 0);
    if (rows.length && tot !== set.total) m.push("Total honor ".concat(rupiah(tot), " belum sama dengan BKU ").concat(rupiah(set.total), " (selisih ").concat(rupiah(set.total - tot), ")"));
    return m;
  };

  return {
    katalogRkas,
    cariRkas,
    posisiKosong,
    isiFormat,
    formatNomorSppd,

    hitungRincian,
    cekPerjadin,
    hitungHonor,

    parseTanggal,
    tglPanjang,
    tglPendek,
    terbilang,

    kalimatHariIni,
    rupiah,

})();

const LPJ_CFG_DEFAULT = {

const lpjApi = async (method, ...args) => {
  if (method === 'simpanLpjSet' && args[0] && args[0].sumber_dana === undefined) args[0] = { ...args[0],
    sumber_dana: SUMBER_AKTIF
  };

  if (typeof google !== 'undefined') {
    const res = await runGas(method, ...args);
    if (res && res.success === false) throw new Error(res.message || 'Gagal memproses data.');
    return res;
  }

  const L = lpjLocal;

  if (method === 'getLpjData') {
    const nomorTerakhir = {};
    L.log.forEach(x => {
      nomorTerakhir[x.th] = nomorTerakhir[x.th] || {};
      nomorTerakhir[x.th][x.jenis] = Math.max(nomorTerakhir[x.th][x.jenis] || 0, x.n);
    });
    return {
      success: true,
      vendor: L.vendor,
      pegawai: L.pegawai,
      katalog: L.katalog,
      sets: L.sets,
      nomorCfg: L.nomorCfg,
      nomorTerakhir,
      gabung: L.gabung
    };
  }

  if (method === 'gabungLpjSet') {
    const k = args[0];
    k.slice(1).forEach(x => {
      L.gabung[x] = k[0];
    });
    Object.keys(L.gabung).forEach(c => {
      if (k.includes(L.gabung[c])) L.gabung[c] = k[0];
    });
    delete L.gabung[k[0]];
    return {
      success: true,
      induk: k[0]
    };
  }

  if (method === 'pisahLpjSet') {
    Object.keys(L.gabung).forEach(c => {
      if (L.gabung[c] === args[0]) delete L.gabung[c];
    });
    return {
      success: true
    };
  }

  if (method === 'simpanPegawai') {
    const v = { ...args[0],
      id: args[0].id || 'p' + Date.now()
    };
    L.pegawai = L.pegawai.filter(x => x.id !== v.id).concat(v);
    return {
      success: true,
      pegawai: v
    };
  }

  if (method === 'hapusPegawai') {
    if (Object.values(L.sets).some(s => ((s.detail || {}).pelaksana || []).includes(args[0]) || ((s.detail || {}).penerima || []).some(r => r.pegawai_id === args[0]))) throw new Error('Pegawai ini sudah dipakai di LPJ, tidak bisa dihapus.');
    L.pegawai = L.pegawai.filter(x => x.id !== args[0]);
    return {
      success: true
    };
  }

  if (method === 'simpanVendor') {
    const v = { ...args[0],
      id: args[0].id || 'v' + Date.now()
    };
    L.vendor = L.vendor.filter(x => x.id !== v.id).concat(v);
    return {
      success: true,
      vendor: v
    };
  }

  if (method === 'hapusVendor') {
    if (Object.values(L.sets).some(s => s.vendor_id === args[0])) throw new Error('Toko ini sudah dipakai di LPJ, tidak bisa dihapus.');
    L.vendor = L.vendor.filter(x => x.id !== args[0]);
    return {
      success: true
    };
  }

  if (method === 'simpanNomorCfg') {
    L.nomorCfg = { ...L.nomorCfg,
      ...args[0]
    };
    return {
      success: true,
      nomorCfg: L.nomorCfg
    };
  }

  if (method === 'simpanLpjSet') {
    const p = args[0];
    const lama = L.sets[p.key] || {};
    if (p.jenis === 'barang') p.items.forEach(it => {
      if (it.satuan && it.harga > 0) L.katalog[LPJ.kunciBarang(it.uraian)] = {
        nama: it.nama,
        satuan: it.satuan,
        harga: it.harga
      };
    });
    L.sets[p.key] = { ...p,
      detail: p.detail || {},
      total: p.items.reduce((a, i) => a + i.jumlah, 0),
      nomor_sp: lama.nomor_sp || 0,
      nomor_bast: lama.nomor_bast || 0,
      nomor_bap: lama.nomor_bap || 0,
      nomor_kwitansi: lama.nomor_kwitansi || 0,
      nomor_sppd: lama.nomor_sppd || []
    };
    return {
      success: true,
      set: L.sets[p.key]
    };
  }

  if (method === 'hapusLpjSet') {
    delete L.sets[args[0]];
    return {
      success: true
    };
  }

  if (method === 'kunciNomorLpjSet') {
    const s = L.sets[args[0]];
    const th = (String(s.tanggal).match(/\d{4}/) || [''])[0];

    const ambil = (jenis, awal) => {
      const n = Math.max(L.log.filter(x => x.th === th && x.jenis === jenis).reduce((a, x) => Math.max(a, x.n), 0) + 1, Number(awal) || 1);
      L.log.push({
        th,
        jenis,
        n
      });
      return n;
    };

    if (s.jenis === 'honor') return {
      success: true,
      set: s
    };

    if (s.jenis === 'perjadin') {
      const man = s.detail.nomor_manual || [];
      const nm = (s.nomor_sppd || []).slice();
      (s.detail.pelaksana || []).forEach((id, i) => {
        if (String(man[i] || '').trim()) {
          if (!nm[i]) nm[i] = 0;
        } else if (!nm[i]) nm[i] = String(L.nomorCfg.sppd_sama) !== '0' ? ambil('surat', L.nomorCfg.nomor_awal_surat) : ambil('sppd', L.nomorCfg.nomor_awal_sppd);
      });
      s.nomor_sppd = nm.slice(0, (s.detail.pelaksana || []).length);
      return {
        success: true,
        set: s
      };
    }

    ['nomor_sp', 'nomor_bast', 'nomor_bap'].forEach(k => {
      if (!s[k]) s[k] = ambil('surat', L.nomorCfg.nomor_awal_surat);
    });
    if (!s.nomor_kwitansi) s.nomor_kwitansi = ambil('kwitansi', L.nomorCfg.nomor_awal_kwitansi);
    return {
      success: true,
      set: s
    };
  }

  return null;
};

const JENIS_LABEL = {

function LpjBkuView({
  sumber = 'bosp',
  bkuData,
  kop,
  pergi,
  transaksi,
  rkasSemua,
  onPindahBku
}) {
  const [data, setData] = useState(null);
  const [selKey, setSelKey] = useState(null);
  const [form, setForm] = useState(null);
  const [cetakKey, setCetakKey] = useState(null);
  const [tampilVendor, setTampilVendor] = useState(false);
  const [vendorBaru, setVendorBaru] = useState({
    nama_toko: '',
    pemilik: '',
    alamat: ''
  });
  const [filterJenis, setFilterJenis] = useState('barang');
  const [tampilPegawai, setTampilPegawai] = useState(false);
  const [pegawaiBaru, setPegawaiBaru] = useState({
    nama: '',
    nip: '',
    pangkat_golongan: '',
    jabatan: ''
  });

  const muat = async () => {
    try {
      const res = await lpjApi('getLpjData');
      setData({ ...res,
        pegawai: res.pegawai || [],
        nomorCfg: { ...LPJ_CFG_DEFAULT,

        }
      });

        sets: {},

      });
    }
  };

  useEffect(() => {
    muat();
  }, []);
  const hasil = useMemo(() => LPJ.kelompokkanBku(bkuData || []), [bkuData]);
  const rkasLain = useMemo(() => (rkasSemua || []).filter(t => sdOf(t.sumber_dana) !== sumber), [rkasSemua, sumber]);
  const rkasKat = useMemo(() => LPJ.katalogRkas((transaksi || []).concat(rkasLain)), [transaksi, rkasLain]);
  const sdRkasLain = useMemo(() => {
    const n = {};
    rkasLain.forEach(t => {
      const k = sdOf(t.sumber_dana);
      n[k] = (n[k] || 0) + 1;
    });
    return Object.keys(n).sort((a, b) => n[b] - n[a]);
  }, [rkasLain]);
  const [pilihRkas, setPilihRkas] = useState(null);
  const [bukaSetelahMuat, setBukaSetelahMuat] = useState(null);
  const setRkas = useMemo(() => !data ? [] : Object.values(data.sets).filter(s => String(s.key).indexOf('rkas|') === 0 && sdOf(s.sumber_dana) === sumber).map(s => ({
    key: s.key,
    periode: '',
    no_bukti: s.no_bukti,
    kode_kegiatan: s.kode_kegiatan,
    tanggal: s.tanggal,
    jenis: 'barang',
    sumber: 'rkas',
    items: (s.items || []).map(i => ({
      uraian: i.uraian,
      kode_rekening: i.kode_rekening,
      program: i.program || '',
      jumlah: Number(i.jumlah) || 0
    })),
    total: (s.items || []).reduce((a, i) => a + (Number(i.jumlah) || 0), 0)
  })).sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal))), [data]);
  const setBku = useMemo(() => {
    const m = data && data.gabung || {};
    const peta = {};
    hasil.sets.forEach(s => {
      peta[s.key] = { ...s,
        items: s.items.map(i => ({ ...i
        })),
        bagian: [{
          key: s.key,
          no_bukti: s.no_bukti,
          tanggal: s.tanggal,
          total: s.total
        }]
      };
    });
    const ikut = {};
    hasil.sets.forEach(s => {
      const I = peta[m[s.key]];
      if (!I || m[s.key] === s.key || I.jenis !== 'barang' || s.jenis !== 'barang' || ikut[m[s.key]]) return;
      ikut[s.key] = true;
      I.bagian.push({
        key: s.key,
        no_bukti: s.no_bukti,
        tanggal: s.tanggal,
        total: s.total
      });
      s.items.forEach(it => {
        const k = LPJ.kunciBarang(it.uraian) + '|' + it.kode_rekening;
        const ada = I.items.find(x => LPJ.kunciBarang(x.uraian) + '|' + x.kode_rekening === k);
        if (ada) ada.jumlah += it.jumlah;else I.items.push({ ...it
        });
      });
      I.total += s.total;
      if ((LPJ.parseTanggal(s.tanggal) || 0) > (LPJ.parseTanggal(I.tanggal) || 0)) I.tanggal = s.tanggal;
    });
    return hasil.sets.filter(s => !ikut[s.key]).map(s => {
      const g = peta[s.key];

      if (g.bagian.length < 2) {
        delete g.bagian;
        return g;
      }

      g.bagian.sort((a, b) => (LPJ.parseTanggal(a.tanggal) || 0) - (LPJ.parseTanggal(b.tanggal) || 0));
      return { ...g,
        no_bukti: g.bagian.map(b => b.no_bukti).filter((v, i, a) => v && a.indexOf(v) === i).join(', ')
      };
    });
  }, [hasil, data]);
  const semuaSet = useMemo(() => setRkas.concat(setBku), [setRkas, setBku]);
  const [modeGabung, setModeGabung] = useState(false);
  const [pilihGabung, setPilihGabung] = useState([]);

  const bisaGabung = s => {
    if (s.sumber === 'rkas') return 'LPJ dari RKAS tidak bisa digabung';
    if (s.jenis !== 'barang') return 'Hanya belanja barang/jasa yang bisa digabung';

  };

  const klikGabung = s => {

      showConfirmButton: false

    setPilihGabung(pilihGabung.concat(s.key));
  };

  const gabungkan = async () => {
    const dipilih = semuaSet.filter(s => pilihGabung.includes(s.key));
    if (dipilih.length < 2) return Swal.fire('Pilih transaksi', 'Pilih minimal 2 transaksi untuk dijadikan satu LPJ.', 'info');
    const urut = dipilih.slice().sort((a, b) => (data.sets[b.key] ? 1 : 0) - (data.sets[a.key] ? 1 : 0) || (LPJ.parseTanggal(a.tanggal) || 0) - (LPJ.parseTanggal(b.tanggal) || 0));
    const adaIsianLain = urut.slice(1).some(s => data.sets[s.key]);
    const total = dipilih.reduce((a, s) => a + s.total, 0);
    const ok = await Swal.fire({
      icon: 'question',
      title: "Gabungkan ".concat(dipilih.length, " transaksi?"),
      showCancelButton: true,
      confirmButtonText: 'Gabungkan',
      cancelButtonText: 'Batal',
      html: "<div style=\"text-align:left;font-size:12px\">".concat(dipilih.map(s => "\u2022 ".concat(s.no_bukti, " \xB7 ").concat(LPJ.tglPanjang(s.tanggal), " \xB7 ").concat(formatNominal(s.total))).join('<br/>'), "<br/><br/><b>Total ").concat(formatNominal(total), "</b>. Dibuat satu LPJ bertanggal transaksi terakhir; barang yang sama dijumlahkan volumenya.").concat(adaIsianLain ? '<br/><br/>Isian toko/harga yang sudah diisi pada transaksi selain <b>' + urut[0].no_bukti + '</b> tidak dipakai.' : '', "<br/>Data BKU tidak berubah, dan gabungan bisa dipisahkan lagi selama belum dicetak.</div>")
    });
    if (!ok.isConfirmed) return;
    tunggu('Menggabungkan...');

    try {
      await lpjApi('gabungLpjSet', urut.map(s => s.key));
      await muat();
      setModeGabung(false);
      setPilihGabung([]);
      Swal.close();
      setBukaSetelahMuat(urut[0].key);
    } catch (e) {
      Swal.fire('Gagal', e.message, 'error');
    }
  };

  const pisahkan = async set => {
    const ok = await Swal.fire({
      icon: 'warning',
      title: 'Pisahkan LPJ gabungan?',
      text: "Kembali menjadi ".concat(set.bagian.length, " LPJ terpisah, satu per No. Bukti."),
      showCancelButton: true,
      confirmButtonText: 'Pisahkan',
      cancelButtonText: 'Batal'
    });
    if (!ok.isConfirmed) return;
    tunggu('Memisahkan...');

      await lpjApi('pisahLpjSet', set.key);

      setSelKey(null);
      setForm(null);

    } catch (e) {
      Swal.fire('Gagal', e.message, 'error');
    }

  const setLamaRkas = useMemo(() => !data ? [] : Object.values(data.sets).filter(s => String(s.key).indexOf('rkas|') === 0 && !String(s.sumber_dana || '').trim()), [data]);
  const [pindahKe, setPindahKe] = useState('lainnya');
  const itemTerpakai = useMemo(() => {
    const o = [];
    if (data) Object.values(data.sets).forEach(s => {
      if (String(s.key).indexOf('rkas|') !== 0 || sdOf(s.sumber_dana) !== sumber) return;
      (s.items || []).forEach(i => o.push({
        key: s.key,
        k: kunciItemRkas(i.uraian, i.kode_rekening),

    return o;

  const [revisi, setRevisi] = useState({});

  const lengkapi = set => {
    const sv = data && data.sets[set.key];

    const vendor = data && sv ? data.vendor.find(v => v.id === sv.vendor_id) : null;

    };

  const statusSet = set => {
    if (set.jenis !== 'barang') {

        teks: 'Belum diisi',

      };
      const masalah = set.jenis === 'honor' ? LPJ.cekHonor(set, LPJ.hitungHonor(sv.detail && sv.detail.penerima || []), data.pegawai) : LPJ.cekPerjadin(sv.detail || {}, LPJ.hitungRincian(gabungRincian(set, sv.items, data.nomorCfg, rkasKat)), data.pegawai);
      if (masalah.length) return {
        teks: "Kurang ".concat(masalah.length, " data"),

      if (set.jenis === 'perjadin' && sv.nomor_sppd && sv.nomor_sppd.length) return {
        teks: 'Sudah dicetak',
        warna: 'bg-emerald-100 text-emerald-700'
      };
      return {
        teks: 'Siap cetak',
        warna: 'bg-indigo-100 text-indigo-700'
      };
    }

    const {
      sv,
      masalah
    } = lengkapi(set);
    if (sv && sv.nomor_sp) return {
      teks: 'Sudah dicetak',
      warna: 'bg-emerald-100 text-emerald-700'
    };
    if (!sv) return {
      teks: 'Belum diisi',
      warna: 'bg-rose-50 text-rose-600'
    };
    if (masalah.length) return {
      teks: "Kurang ".concat(masalah.length, " data"),
      warna: 'bg-amber-100 text-amber-700'
    };
    return {
      teks: 'Siap cetak',
      warna: 'bg-indigo-100 text-indigo-700'

  const bukaEditor = set => {

    const {

      vendor_id: sv ? sv.vendor_id : '',
      untuk_pembayaran: sv && sv.untuk_pembayaran ? sv.untuk_pembayaran : '',

        uraian: i.uraian,
        kode_rekening: i.kode_rekening,

        volume: i.volume || '',
        jumlah: i.jumlah,
        nama: i.nama,
        satuan: i.satuan,

    if (s) {
      setBukaSetelahMuat(null);
      setFilterJenis('barang');
      bukaEditor(s);

  }, [semuaSet, bukaSetelahMuat]);

  const simpanDariRkas = async ({
    tanggal,
    no_bukti,
    items,
    vendor_id,
    untuk_pembayaran
  }) => {
    const lama = pilihRkas && pilihRkas.awal ? data.sets[pilihRkas.awal.key] : null;
    const key = lama ? lama.key : "rkas|".concat(Date.now());
    const hitung = {};
    items.forEach(i => {
      hitung[i.program] = (hitung[i.program] || 0) + 1;
    });
    const keg = Object.keys(hitung).sort((a, b) => hitung[b] - hitung[a])[0] || '';
    tunggu('Menyimpan...');

    try {
      await lpjApi('simpanLpjSet', {
        key,
        no_bukti,
        kode_kegiatan: keg,
        tanggal,
        jenis: 'barang',
        vendor_id: vendor_id || '',
        untuk_pembayaran: untuk_pembayaran || '',
        items: items.map(i => ({
          uraian: i.uraian,
          kode_rekening: i.kode_rekening,
          program: i.program || '',
          volume: i.volume,
          nama: i.nama,
          satuan: i.satuan,
          harga: i.harga,
          jumlah: i.jumlah
        })),
        detail: {
          sumber: 'rkas'
        }
      });
      setPilihRkas(null);
      await muat();
      Swal.close();
      setBukaSetelahMuat(key);
    } catch (e) {
      Swal.fire('Error', e.message, 'error');
    }
  };

  const pindahSumber = async (keys, ke) => {
    const k = await Swal.fire({
      icon: 'question',
      title: "Pindahkan ke ".concat(namaSd(ke), "?"),
      html: "".concat(keys.length, " set LPJ dari RKAS akan dipindahkan ke sumber dana <b>").concat(namaSd(ke), "</b> dan tidak tampil lagi di ").concat(namaSd(sumber), "."),
      showCancelButton: true,
      confirmButtonText: 'Pindahkan',
      cancelButtonText: 'Batal'
    });
    if (!k.isConfirmed) return;
    tunggu('Memindahkan...');

    try {
      await lpjApi('pindahSumberLpjSet', keys, ke);
      setSelKey(null);
      setForm(null);
      await muat();
      Swal.fire({
        icon: 'success',
        title: 'Dipindahkan',
        text: "Buka sumber dana ".concat(namaSd(ke), " untuk melihatnya."),
        timer: 1800,
        showConfirmButton: false
      });
    } catch (e) {
      Swal.fire('Error', e.message, 'error');
    }
  };

  const tandaiBosp = async keys => {
    tunggu('Menyimpan...');

    try {
      await lpjApi('pindahSumberLpjSet', keys, 'bosp');
      await muat();
      Swal.close();
    } catch (e) {
      Swal.fire('Error', e.message, 'error');
    }
  };

  const hapusLpj = async set => {
    const sv = data.sets[set.key];
    const dicetak = sv && (sv.nomor_sp || sv.nomor_sppd && sv.nomor_sppd.length);
    const isi = [set.sumber === 'rkas' ? 'Set ini akan hilang dari daftar, dan item RKAS-nya bisa dipilih lagi untuk LPJ baru.' : 'Data BKU tidak ikut terhapus. Set ini kembali berstatus <b>Belum diisi</b> dan bisa dilengkapi ulang.', dicetak ? '<br/><br/>Set ini <b>sudah dicetak</b>. Nomor suratnya tidak dipakai ulang; LPJ berikutnya tetap memakai nomor lanjutan.' : ''].join('');
    const k = await Swal.fire({
      icon: 'warning',
      title: 'Hapus LPJ ini?',
      html: isi,
      showCancelButton: true,
      confirmButtonText: 'Hapus',
      confirmButtonColor: '#e11d48',
      cancelButtonText: 'Batal'
    });
    if (!k.isConfirmed) return;
    tunggu('Menghapus...');

    try {
      await lpjApi('hapusLpjSet', set.key);
      setSelKey(null);
      setForm(null);
      setRevisi(r => {
        const n = { ...r
        };
        delete n[set.key];
        return n;
      });
      await muat();
      Swal.fire({
        icon: 'success',
        title: 'LPJ dihapus',
        timer: 1200,
        showConfirmButton: false
      });
    } catch (e) {
      Swal.fire('Error', e.message, 'error');
    }
  };

  const setAktif = semuaSet.find(s => s.key === selKey);
  const itemsForm = form ? form.items.map(i => {
    const h = Number(i.harga) || 0;
    return { ...i,
      harga: h,
      volume: h > 0 ? i.jumlah / h : 0
    };
  }) : [];
  const vendorForm = form && data ? data.vendor.find(v => v.id === form.vendor_id) : null;
  const masalahForm = setAktif && form ? LPJ.cekSet(setAktif, itemsForm, vendorForm) : [];
  const kunciEdit = !!(setAktif && setAktif.sumber === 'rkas' && data && data.sets[setAktif.key] && data.sets[setAktif.key].nomor_sp && !revisi[setAktif.key]);

  const ubahItem = (idx, field, value) => setForm(f => ({ ...f,
    items: f.items.map((it, i) => i === idx ? { ...it,
      [field]: value,
      otomatis: false,
      ...(field === 'harga' ? {
        volumeKetik: undefined
      } : {})
    } : it)

const tebakSatuan = u => /transport/i.test(u) ? 'Kali' : /(harian|penginapan|hotel)/i.test(u) ? 'Hari' : '';

const isPenginapan = u => /(penginapan|hotel)/i.test(String(u || ''));

const keIso = s => {
  const d = LPJ.parseTanggal(s);
  return d ? "".concat(d.getFullYear(), "-").concat(String(d.getMonth() + 1).padStart(2, '0'), "-").concat(String(d.getDate()).padStart(2, '0')) : '';
};

const gabungRincian = (set, svItems, cfg, rkas) => set.items.map((it, i) => {
  const s = svItems && svItems[i] && LPJ.kunciBarang(svItems[i].uraian) === LPJ.kunciBarang(it.uraian) ? svItems[i] : null;
  const persen = s && s.persen !== undefined && s.persen !== '' ? s.persen : isPenginapan(it.uraian) ? Number(cfg && cfg.persen_penginapan || 100) : 100;
  const r = !s ? LPJ.cariRkas(rkas, it.uraian, it.kode_rekening) : null;
  const volR = r && r.harga ? it.jumlah / (r.harga * Number(persen) / 100) : 0;
  return {
    uraian: it.uraian,
    kode_rekening: it.kode_rekening,
    jumlah: it.jumlah,
    nama: s && s.nama ? s.nama : LPJ.rapikanNama(it.uraian),
    volume: s && s.volume ? s.volume : volR && Math.abs(volR - Math.round(volR)) < 1e-9 ? Math.round(volR) : '',
    satuan: s && s.satuan ? s.satuan : r && r.satuan ? r.satuan : tebakSatuan(it.uraian),
    harga: s && s.harga ? s.harga : r ? r.harga : '',
    persen,
    keterangan: s ? s.keterangan || '' : ''
  };
});

const kunciDanCetak = async (key, judul, onReload, onCetak) => {
  const ok = await Swal.fire({
    icon: 'question',
    title: judul,
    showCancelButton: true,
    confirmButtonText: 'Ya, cetak',
    cancelButtonText: 'Batal'
  });
  if (!ok.isConfirmed) return;
  tunggu('Menyiapkan dokumen...');

  try {
    await lpjApi('kunciNomorLpjSet', key);
    await onReload();
    Swal.close();
    onCetak(key);
  } catch (e) {
    Swal.fire('Error', e.message, 'error');
  }
};

const LAP = (() => {
  const num = v => Number(v) || 0;

  const tgl = s => {
    const str = String(s || '').trim();
    let m = str.match(/^(\d{2})[-/](\d{2})[-/](\d{4})$/);
    if (m) return {
      d: +m[1],
      m: +m[2],
      y: +m[3]
    };
    m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return {
      d: +m[3],
      m: +m[2],
      y: +m[1]
    };
    return null;
  };

  const periodeDari = s => {
    const t = tgl(s);
    return t ? "".concat(t.y, "-").concat(String(t.m).padStart(2, '0')) : '';
  };

  const iso = (y, m, d) => "".concat(y, "-").concat(String(m).padStart(2, '0'), "-").concat(String(d).padStart(2, '0'));

  const akhirBulan = (y, m) => new Date(y, m, 0).getDate();

  const urutTgl = s => {
    const t = tgl(s);
    return t ? t.y * 10000 + t.m * 100 + t.d : 0;
  };

  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  const namaPeriode = p => {
    const [y, m] = String(p).split('-');
    return m ? "".concat(BULAN[+m - 1], " ").concat(y) : p;
  };

  const jenis = r => {
    const u = String(r.uraian || '');
    const rek = String(r.kode_rekening || '').replace(/^'/, '');
    if (/^saldo (bank|tunai) bulan/i.test(u)) return 'saldo_awal';
    if (!r.no_bukti && /(pph|ppn|pajak)/i.test(u)) return 'pajak';
    if (/bunga bank/i.test(u) || /^jasa giro/i.test(u)) return 'bunga';
    if (/(tarik tunai|penarikan tunai|setor tunai|pergeseran)/i.test(u)) return 'transfer';
    if (num(r.penerimaan) > 0 && num(r.pengeluaran) === 0) return 'terima';

    if (num(r.pengeluaran) > 0) {
      if (/honor/i.test(u)) return 'pegawai';
      if (rek.startsWith('5.2')) return 'modal';
      return 'barjas';
    }

    return 'lain';
  };

  const barisPeriode = (rows, p) => rows.filter(r => periodeDari(r.tanggal) === p);

  const daftarPeriode = rows => Array.from(new Set(rows.map(r => periodeDari(r.tanggal)).filter(Boolean))).sort();

  const ringkasBulan = (rows, p, infoMap) => {
    const b = barisPeriode(rows, p);
    const D = b.reduce((a, r) => a + num(r.penerimaan), 0);
    const K = b.reduce((a, r) => a + num(r.pengeluaran), 0);
    const [y, m] = p.split('-').map(Number);
    const info = (infoMap || {})[p] || null;
    const terakhir = b.slice().sort((a, c) => urutTgl(a.tanggal) - urutTgl(c.tanggal)).pop();
    const saldoAkhir = terakhir ? num(terakhir.saldo) : D - K;
    const pm = m === 1 ? 12 : m - 1,
          py = m === 1 ? y - 1 : y;
    return {
      periode: p,
      D,
      K,
      saldo_buku: D - K,
      saldo_akhir_baris: saldoAkhir,
      saldo_bank: info && info.saldo_bank !== null && info.saldo_bank !== '' && info.saldo_bank !== undefined ? num(info.saldo_bank) : saldoAkhir,
      saldo_tunai: info && info.saldo_tunai !== null && info.saldo_tunai !== '' && info.saldo_tunai !== undefined ? num(info.saldo_tunai) : 0,
      ada_info: !!info,
      tgl_penutupan: iso(y, m, akhirBulan(y, m)),
      tgl_penutupan_lalu: iso(py, pm, akhirBulan(py, pm)),
      jumlah_baris: b.length
    };
  };

  const ringkasTahap = (rows, tahun, tahap, infoMap, namaRek) => {
    const mulai = tahap === 1 ? 1 : 7;
    const bulan = Array.from({
      length: 6
    }, (_, i) => "".concat(tahun, "-").concat(String(mulai + i).padStart(2, '0')));
    const adaSemua = daftarPeriode(rows);
    const bulanAda = bulan.filter(p => adaSemua.includes(p));
    const b = rows.filter(r => bulan.includes(periodeDari(r.tanggal))).sort((a, c) => urutTgl(a.tanggal) - urutTgl(c.tanggal));
    const hasil = {
      tahun,
      tahap,
      bulan,
      bulanAda,
      bulanKosong: bulan.filter(p => !bulanAda.includes(p)),
      terima: 0,
      pegawai: 0,
      barjas: 0,
      modal: 0,
      bunga: 0,
      pajakTerima: 0,
      pajakSetor: 0,
      penerimaanList: [],
      rincian: {
        pegawai: [],
        barjas: [],
        modal: []
      }
    };
    const grup = {
      pegawai: {},
      barjas: {},
      modal: {}
    };
    b.forEach(r => {
      const j = jenis(r);

      if (j === 'terima') {
        hasil.terima += num(r.penerimaan);
        hasil.penerimaanList.push({
          tanggal: r.tanggal,
          jumlah: num(r.penerimaan),
          uraian: r.uraian
        });
      } else if (j === 'bunga') hasil.bunga += num(r.penerimaan) - num(r.pengeluaran);else if (j === 'pajak') {
        hasil.pajakTerima += num(r.penerimaan);
        hasil.pajakSetor += num(r.pengeluaran);
      } else if (j === 'pegawai' || j === 'barjas' || j === 'modal') {
        hasil[j] += num(r.pengeluaran);
        const rek = String(r.kode_rekening || '-').replace(/^'/, '') || '-';
        if (!grup[j][rek]) grup[j][rek] = {
          kode_rekening: rek,
          jumlah: 0,
          uraianSet: []
        };
        grup[j][rek].jumlah += num(r.pengeluaran);
        const ur = String(r.uraian || '').replace(/[-\s]+$/, '').trim();
        if (ur && !grup[j][rek].uraianSet.includes(ur)) grup[j][rek].uraianSet.push(ur);
      }
    });
    ['pegawai', 'barjas', 'modal'].forEach(j => {
      hasil.rincian[j] = Object.values(grup[j]).map(g => {
        const bawaan = g.uraianSet.length <= 3 ? g.uraianSet.join(', ') : "".concat(g.uraianSet.slice(0, 3).join(', '), ", dll");
        return {
          kode_rekening: g.kode_rekening,
          uraian: namaRek && namaRek[g.kode_rekening] || bawaan,
          uraian_bawaan: bawaan,
          jumlah: g.jumlah
        };
      }).sort((a, c) => a.kode_rekening.localeCompare(c.kode_rekening));
    });
    hasil.belanja = hasil.pegawai + hasil.barjas + hasil.modal;
    const pertama = bulanAda[0];
    const awal = pertama ? barisPeriode(rows, pertama).filter(r => jenis(r) === 'saldo_awal') : [];

    const ambilAwal = re => {
      const r = awal.find(x => re.test(x.uraian));
      return r ? num(r.penerimaan) : 0;
    };

    hasil.sisa_lalu_bank = ambilAwal(/saldo bank/i);
    hasil.sisa_lalu_tunai = ambilAwal(/saldo tunai/i);
    const akhir = bulanAda[bulanAda.length - 1];

    if (akhir) {
      const rb = ringkasBulan(rows, akhir, infoMap);
      hasil.sisa_bank = rb.saldo_bank;
      hasil.sisa_tunai = rb.saldo_tunai;
      hasil.ada_info_akhir = rb.ada_info;
    } else {
      hasil.sisa_bank = 0;
      hasil.sisa_tunai = 0;
      hasil.ada_info_akhir = false;
    }

    const t = b.length ? tgl(b[b.length - 1].tanggal) : null;
    hasil.tgl_laporan = t ? iso(t.y, t.m, t.d) : iso(tahun, mulai + 5, akhirBulan(tahun, mulai + 5));
    const p1 = hasil.penerimaanList[0];
    hasil.tgl_penarikan = p1 ? (() => {
      const x = tgl(p1.tanggal);
      return iso(x.y, x.m, x.d);
    })() : '';
    hasil.saldo_hitung = hasil.sisa_lalu_bank + hasil.sisa_lalu_tunai + hasil.terima + hasil.bunga + hasil.pajakTerima - hasil.belanja - hasil.pajakSetor;
    hasil.selisih = hasil.saldo_hitung - (hasil.sisa_bank + hasil.sisa_tunai);
    return hasil;
  };

  return {
    jenis,
    periodeDari,
    daftarPeriode,
    ringkasBulan,
    ringkasTahap,
    namaPeriode,
    BULAN
  };
})();

      uraian: g.nama || namaRek && namaRek[g.kode_rekening] || (g.ur.length <= 3 ? g.ur.join(', ') : "".concat(g.ur.slice(0, 3).join(', '), ", dll")),

    if (window.Tesseract) return res(window.Tesseract);

    s.src = TESS_SRC;

const kecilkanGambar = (file, maks, jenis, kualitas) => new Promise((res, rej) => {
  if (!file || !/^image\//.test(file.type)) return rej(new Error('Pilih file gambar (PNG atau JPG).'));

  fr.onload = () => {
    const img = new Image();

    img.onload = () => {
      const s = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      const ctx = c.getContext('2d');

      if (jenis === 'image/jpeg') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
      }

      ctx.drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL(jenis, kualitas);
      if (jenis === 'image/png' && url.length > 250000) url = c.toDataURL('image/webp', 0.85);

    img.src = fr.result;
  };

  fr.onerror = () => rej(new Error('File tidak bisa dibaca.'));

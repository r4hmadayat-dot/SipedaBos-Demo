<script>window.__CODEGS="/**\n * SIPEDABOS - Backend\n * Menangani routing dan akses data Spreadsheet\n */\n\nfunction doGet() {\n  return HtmlService.createTemplateFromFile('Index').evaluate()\n    .setTitle('SIPEDABOS - Sistem Informasi BOS')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/**\n * Setup sheet yang diperlukan jika belum ada dan pastikan kolom sesuai\n */\nfunction setupDatabase_() {\n  const ss = ss_();\n  const sheets = [\n    { name: 'transaksi', header: ['id', 'tahap', 'kode_rekening', 'program', 'uraian', 'volume', 'satuan', 'harga_satuan', 'total_jumlah', 'tahap_1', 'tahap_2'] },\n    { name: 'bku', header: ['id', 'bulan', 'tanggal', 'kode_kegiatan', 'kode_rekening', 'no_bukti', 'uraian', 'penerimaan', 'pengeluaran', 'saldo'] },\n    { name: 'kop_surat', header: ['key', 'value'] }\n  ];\n  \n  sheets.forEach(s => {\n    let sheet = ss.getSheetByName(s.name);\n    if (!sheet) {\n      sheet = ss.insertSheet(s.name);\n      sheet.appendRow(s.header);\n      \n      // Default Data\n      if (s.name === 'kop_surat') {\n        const defaults = [\n          ['sekolah', ''],\n          ['tahun_anggaran', String(new Date().getFullYear())],\n          ['lokasi_ttd', ''],\n          ['pemda', ''],\n          ['dinas', ''],\n          ['kecamatan', ''],\n          ['alamat', ''],\n          ['wallpaper_url', 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&q=80&w=2071'],\n          ['logo_kiri', ''],\n          ['logo_kanan', ''],\n          ['logo_aplikasi', ''],\n          ['logo_login', ''],\n          ['kepsek', ''],\n          ['nip_kepsek', ''],\n          ['bendahara', ''],\n          ['nip_bendahara', ''],\n          ['program', ''],\n          ['kegiatan', '']\n        ];\n        sheet.getRange(2, 1, defaults.length, 2).setValues(defaults);\n      }\n    } else {\n      // Sinkronisasi Kolom Aplikasi & Database\n      sheet.getRange(1, 1, 1, s.header.length).setValues([s.header]);\n    }\n  });\n  return \"Database berhasil disiapkan dan kolom disinkronkan.\";\n}\n\n/**\n * Helper Data Normalization\n */\nfunction getTableData_(sheetName) {\n  const ss = ss_();\n  const sheet = ss.getSheetByName(sheetName);\n  if (!sheet) return [];\n  \n  const values = sheet.getDataRange().getValues();\n  if (values.length <= 1) return [];\n  \n  // PERBAIKAN: Pastikan header di-lowercase untuk menghindari masalah kapitalisasi\n  const headers = values.shift().map(h => String(h || \"\").trim().toLowerCase());\n  \n  return values.map(row => {\n    let obj = {};\n    headers.forEach((h, i) => {\n      if (!h) return; // Abaikan kolom tanpa header\n      \n      let val = row[i];\n      if (val instanceof Date) {\n        val = Utilities.formatDate(val, Session.getScriptTimeZone(), \"yyyy-MM-dd\");\n      }\n      \n      // Konversi paksa angka untuk field nominal agar kalkulasi tidak gagal\n      if (['penerimaan', 'pengeluaran', 'saldo', 'harga_satuan', 'total_jumlah', 'tahap_1', 'tahap_2'].includes(h)) {\n         val = Number(val) || 0;\n      }\n      \n      obj[h] = (val === undefined || val === null) ? \"\" : val;\n    });\n    return obj;\n  }).filter(t => {\n    // Memfilter baris kosong dengan aman\n    if (sheetName === 'transaksi' || sheetName === 'bku') return t.uraian && String(t.uraian).trim() !== \"\";\n    if (sheetName === 'kop_surat') return t.key && String(t.key).trim() !== \"\";\n    return Object.keys(t).length > 0;\n  });\n}\n\n/**\n * Manajemen Kop Surat\n */\nfunction getKopSurat_() {\n  const data = getTableData_('kop_surat');\n  let obj = {};\n  data.forEach(item => {\n    if (item.key) obj[item.key] = item.value;\n  });\n  return obj;\n}\n\nfunction updateKopSurat_(data) {\n  try {\n    const sheet = ss_().getSheetByName('kop_surat');\n    if (!sheet) return { success: false, message: 'Sheet tidak ditemukan' };\n    \n    // Gambar besar (data:...) disimpan di sheet \"aset\", bukan di sel kop_surat (batas 50.000 karakter per sel)\n    const rows = Object.keys(data).map(key => [key, String(data[key] || '').indexOf('data:') === 0 ? '__aset__' : data[key]]);\n    if (rows.length === 0) return { success: false, message: 'Data konfigurasi kosong' };\n    sheet.clear();\n    sheet.appendRow(['key', 'value']); \n    sheet.getRange(2, 1, rows.length, 2).setValues(rows);\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/**\n * Import/Save Data Transaksi\n */\nfunction importTransaksi_(data) {\n  try {\n    const sheet = ss_().getSheetByName('transaksi');\n    if (!sheet) return { success: false, message: 'Sheet transaksi tidak ada' };\n    \n    if (sheet.getLastRow() > 1) {\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, sheet.getLastColumn()).clearContent();\n    }\n    \n    if (data.length === 0) return { success: true };\n    \n    const rows = data.map(t => [\n      t.id || Utilities.getUuid(), \n      t.tahap || \"\", \n      t.kode_rekening || \"\", \n      t.program || \"\", \n      t.uraian || \"\", \n      t.volume || 0, \n      t.satuan || \"\", \n      t.harga_satuan || 0, \n      t.total_jumlah || 0, \n      t.tahap_1 || 0, \n      t.tahap_2 || 0\n    ]);\n    \n    sheet.getRange(2, 1, rows.length, rows[0].length).setValues(rows);\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\nfunction clearAllTransactions_() {\n  try {\n    const sheet = ss_().getSheetByName('transaksi');\n    if (sheet.getLastRow() > 1) {\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, sheet.getLastColumn()).clearContent();\n    }\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/**\n * Import Data BKU\n * Bulan yang diimpor menggantikan data bulan yang sama saja; bulan lain tetap tersimpan\n * (dibutuhkan untuk SPTJM & Laporan Realisasi per tahap).\n * info (opsional): { periode, sumber_dana, saldo_bank, saldo_tunai, saldo_bku } dari blok penutupan kas.\n */\nfunction importBKU_(data, info) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const sheet = ss_().getSheetByName('bku');\n    if (!sheet) return { success: false, message: 'Sheet bku tidak ditemukan. Klik Setup Database dulu.' };\n    if (!data || data.length === 0) return { success: true };\n\n    const tz = Session.getScriptTimeZone();\n    const periodeDari = (v) => {\n      if (v instanceof Date) return Utilities.formatDate(v, tz, 'yyyy-MM');\n      const s = String(v || '').trim();\n      let m = s.match(/^(\\d{2})[-/](\\d{2})[-/](\\d{4})/); if (m) return m[3] + '-' + m[2];\n      m = s.match(/^(\\d{4})-(\\d{2})/); if (m) return m[1] + '-' + m[2];\n      return '';\n    };\n    const teksTanggal = (v) => (v instanceof Date) ? Utilities.formatDate(v, tz, 'dd-MM-yyyy') : String(v || '');\n    const urut = (v) => { const s = teksTanggal(v); const m = s.match(/^(\\d{2})-(\\d{2})-(\\d{4})/); return m ? Number(m[3] + m[2] + m[1]) : 0; };\n\n    const periodeBaru = {};\n    data.forEach(t => { periodeBaru[periodeDari(t.tanggal)] = true; });\n\n    let lama = [];\n    if (sheet.getLastRow() > 1) {\n      lama = sheet.getRange(2, 1, sheet.getLastRow() - 1, 10).getValues()\n        .filter(r => String(r[6]).trim() !== '' && !periodeBaru[periodeDari(r[2])])\n        .map(r => { const x = r.slice(); x[2] = teksTanggal(x[2]); return x; });\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, sheet.getLastColumn()).clearContent();\n    }\n\n    const baru = data.map(t => [\n      t.id || Utilities.getUuid(),\n      t.bulan || \"\",\n      t.tanggal || \"\",\n      t.kode_kegiatan || \"\",\n      t.kode_rekening || \"\",\n      t.no_bukti || \"\",\n      t.uraian || \"\",\n      Number(t.penerimaan) || 0,\n      Number(t.pengeluaran) || 0,\n      Number(t.saldo) || 0\n    ]);\n    // Urutkan per tanggal; urutan baris dalam satu bulan (sesuai BKU) dipertahankan\n    const rows = lama.concat(baru).map((r, i) => ({ r: r, i: i }))\n      .sort((x, y) => (urut(x.r[2]) - urut(y.r[2])) || (x.i - y.i)).map(x => x.r);\n\n    // Kolom bulan s/d uraian dipaksa format teks agar Sheets tidak mengubah\n    // \"06-10-2026\" menjadi Date (hari/bulan bisa tertukar) atau \"05.08.01.\" menjadi angka\n    sheet.getRange(2, 2, rows.length, 6).setNumberFormat('@');\n    sheet.getRange(2, 1, rows.length, 10).setValues(rows);\n\n    if (info && info.periode) {\n      const ada = lpjRows_('bku_info').find(r => String(r.periode) === String(info.periode));\n      lpjWriteRow_('bku_info', {\n        periode: info.periode, sumber_dana: info.sumber_dana || '',\n        saldo_bank: info.saldo_bank === null || info.saldo_bank === undefined ? '' : info.saldo_bank,\n        saldo_tunai: info.saldo_tunai === null || info.saldo_tunai === undefined ? '' : info.saldo_tunai,\n        saldo_bku: info.saldo_bku === null || info.saldo_bku === undefined ? '' : info.saldo_bku,\n        updated_at: lpjNow_()\n      }, ada ? ada._row : null);\n    }\n    return { success: true, bulan: Object.keys(periodeBaru), total_baris: rows.length };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  } finally { lock.releaseLock(); }\n}\n\nfunction clearAllBKU_() {\n  try {\n    const sheet = ss_().getSheetByName('bku');\n    if (sheet.getLastRow() > 1) sheet.getRange(2, 1, sheet.getLastRow() - 1, sheet.getLastColumn()).clearContent();\n    const info = ss_().getSheetByName('bku_info');\n    if (info && info.getLastRow() > 1) info.getRange(2, 1, info.getLastRow() - 1, info.getLastColumn()).clearContent();\n    return { success: true };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\n/* =====================================================================\n * LAPORAN OTOMATIS (K7b, K7c, SPTJM, Realisasi)\n * ===================================================================== */\n/** Info penutupan kas per bulan + isian laporan yang pernah disimpan */\nfunction getLaporanData_() {\n  try {\n    const info = {};\n    lpjRows_('bku_info').forEach(r => {\n      const n = (v) => (String(v).trim() === '' ? null : Number(v));\n      info[String(r.periode)] = { sumber_dana: String(r.sumber_dana), saldo_bank: n(r.saldo_bank), saldo_tunai: n(r.saldo_tunai), saldo_bku: n(r.saldo_bku) };\n    });\n    const isian = {};\n    lpjRows_('laporan_isian').forEach(r => { isian[String(r.key)] = lpjJson_(r.data_json, {}); });\n    return { success: true, info: info, isian: isian };\n  } catch (e) { return { success: false, message: e.toString() }; }\n}\n\n/** Simpan isian satu laporan, misalnya key \"K7B|2026-09\", \"SPTJM|2026-2\", atau \"nama_rekening\" */\nfunction simpanLaporanIsian_(key, obj) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!key) return { success: false, message: 'Kunci isian kosong.' };\n    const ada = lpjRows_('laporan_isian').find(r => String(r.key) === String(key));\n    lpjWriteRow_('laporan_isian', { key: key, data_json: JSON.stringify(obj || {}), updated_at: lpjNow_() }, ada ? ada._row : null);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/* =====================================================================\n * MODUL LPJ DARI BKU (belanja barang/jasa, perjalanan dinas, honor)\n * Sheet dibuat otomatis saat pertama dipakai (tidak perlu Setup Database).\n * ===================================================================== */\nconst LPJ_SHEETS_ = {\n  vendor: ['id', 'nama_toko', 'pemilik', 'alamat'],\n  pegawai: ['id', 'nama', 'nip', 'pangkat_golongan', 'jabatan'],\n  katalog_barang: ['kunci', 'nama', 'satuan', 'harga', 'updated_at'],\n  lpj_set: ['key', 'no_bukti', 'kode_kegiatan', 'tanggal', 'jenis', 'vendor_id', 'untuk_pembayaran', 'items_json', 'total',\n            'nomor_sp', 'nomor_bast', 'nomor_bap', 'nomor_kwitansi', 'updated_at', 'detail_json', 'nomor_sppd'],\n  nomor_log: ['tahun', 'jenis', 'nomor', 'ref_key', 'dibuat'],\n  pengaturan_nomor: ['key', 'value'],\n  bku_info: ['periode', 'sumber_dana', 'saldo_bank', 'saldo_tunai', 'saldo_bku', 'updated_at'],\n  laporan_isian: ['key', 'data_json', 'updated_at'],\n  aset: ['key', 'bagian', 'data']\n};\n\nconst LPJ_PENGATURAN_DEFAULT_ = {\n  format_surat: '', format_sppd: '', ikut_tanggal: '1', sppd_sama: '1',\n  klasifikasi: '', kode_sekolah: '', nomor_awal_surat: '1', nomor_awal_kwitansi: '1',\n  sppd_klasifikasi: '', sppd_kode_sekolah: '', nomor_awal_sppd: '1',\n  persen_penginapan: '100', persen_pph_honor: '0', mata_anggaran: ''\n};\n\nfunction lpjSheet_(name) {\n  const ss = ss_();\n  const header = LPJ_SHEETS_[name];\n  let sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    sh.getRange('A:Z').setNumberFormat('@'); // simpan semua sebagai teks, angka dikonversi di kode\n    sh.getRange(1, 1, 1, header.length).setValues([header]);\n  }\n  return sh;\n}\n\nfunction lpjRows_(name) {\n  const sh = lpjSheet_(name);\n  const values = sh.getDataRange().getValues();\n  let header = values.shift().map(h => String(h).trim());\n  const harus = LPJ_SHEETS_[name];\n  if (harus.some((h, i) => header[i] !== h)) {\n    // Migrasi: kolom baru ditambahkan di ujung kanan, data lama tidak berubah\n    sh.getRange(1, 1, 1, harus.length).setValues([harus]);\n    header = harus.slice();\n  }\n  return values\n    .map((r, i) => { const o = { _row: i + 2 }; header.forEach((h, j) => o[h] = (r[j] === null || r[j] === undefined) ? '' : r[j]); return o; })\n    .filter(o => String(o[header[0]]).trim() !== '');\n}\n\nfunction lpjWriteRow_(name, obj, rowNumber) {\n  const sh = lpjSheet_(name);\n  const row = LPJ_SHEETS_[name].map(h => (obj[h] === undefined || obj[h] === null) ? '' : String(obj[h]));\n  const target = rowNumber || sh.getLastRow() + 1;\n  sh.getRange(target, 1, 1, row.length).setNumberFormat('@').setValues([row]);\n}\n\nfunction lpjNow_() {\n  return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm:ss');\n}\n\nfunction lpjNomorCfg_() {\n  const cfg = Object.assign({}, LPJ_PENGATURAN_DEFAULT_);\n  lpjRows_('pengaturan_nomor').forEach(r => { cfg[r.key] = String(r.value); });\n  return cfg;\n}\n\nfunction lpjJson_(s, def) {\n  try { const v = JSON.parse(s || ''); return v === null || v === undefined ? def : v; } catch (e) { return def; }\n}\n\nfunction lpjSetToObj_(r) {\n  return {\n    key: String(r.key), no_bukti: String(r.no_bukti), kode_kegiatan: String(r.kode_kegiatan), tanggal: String(r.tanggal),\n    jenis: String(r.jenis), vendor_id: String(r.vendor_id), untuk_pembayaran: String(r.untuk_pembayaran),\n    items: lpjJson_(r.items_json, []), detail: lpjJson_(r.detail_json, {}),\n    total: Number(r.total) || 0,\n    nomor_sp: Number(r.nomor_sp) || 0, nomor_bast: Number(r.nomor_bast) || 0, nomor_bap: Number(r.nomor_bap) || 0,\n    nomor_kwitansi: Number(r.nomor_kwitansi) || 0, nomor_sppd: lpjJson_(r.nomor_sppd, []),\n    updated_at: String(r.updated_at)\n  };\n}\n\n/** Semua data yang dibutuhkan halaman LPJ dari BKU */\nfunction getLpjData_() {\n  try {\n    const katalog = {};\n    lpjRows_('katalog_barang').forEach(r => { katalog[String(r.kunci)] = { nama: String(r.nama), satuan: String(r.satuan), harga: Number(r.harga) || 0 }; });\n    const sets = {};\n    lpjRows_('lpj_set').forEach(r => { sets[String(r.key)] = lpjSetToObj_(r); });\n    const vendor = lpjRows_('vendor').map(r => ({ id: String(r.id), nama_toko: String(r.nama_toko), pemilik: String(r.pemilik), alamat: String(r.alamat) }));\n    const pegawai = lpjRows_('pegawai').map(r => ({ id: String(r.id), nama: String(r.nama), nip: String(r.nip), pangkat_golongan: String(r.pangkat_golongan), jabatan: String(r.jabatan) }));\n    // Nomor terakhir yang sudah dipakai per tahun: { '2026': { surat: 12, kwitansi: 4, sppd: 3 } }\n    const nomorTerakhir = {};\n    lpjRows_('nomor_log').forEach(r => {\n      const th = String(r.tahun), j = String(r.jenis), n = Number(r.nomor) || 0;\n      nomorTerakhir[th] = nomorTerakhir[th] || {};\n      nomorTerakhir[th][j] = Math.max(nomorTerakhir[th][j] || 0, n);\n    });\n    return { success: true, vendor: vendor, pegawai: pegawai, katalog: katalog, sets: sets, nomorCfg: lpjNomorCfg_(), nomorTerakhir: nomorTerakhir };\n  } catch (e) {\n    return { success: false, message: e.toString() };\n  }\n}\n\nfunction simpanVendor_(v) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!v || !String(v.nama_toko || '').trim()) return { success: false, message: 'Nama toko wajib diisi.' };\n    const rows = lpjRows_('vendor');\n    const data = { id: v.id || Utilities.getUuid(), nama_toko: String(v.nama_toko).trim(), pemilik: String(v.pemilik || '').trim(), alamat: String(v.alamat || '').trim() };\n    const ada = rows.find(r => String(r.id) === data.id);\n    lpjWriteRow_('vendor', data, ada ? ada._row : null);\n    return { success: true, vendor: data };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusVendor_(id) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const dipakai = lpjRows_('lpj_set').some(r => String(r.vendor_id) === String(id));\n    if (dipakai) return { success: false, message: 'Toko ini sudah dipakai di LPJ, tidak bisa dihapus.' };\n    const r = lpjRows_('vendor').find(x => String(x.id) === String(id));\n    if (r) lpjSheet_('vendor').deleteRow(r._row);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction simpanPegawai_(p) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!p || !String(p.nama || '').trim()) return { success: false, message: 'Nama pegawai wajib diisi.' };\n    const rows = lpjRows_('pegawai');\n    const data = { id: p.id || Utilities.getUuid(), nama: String(p.nama).trim(), nip: String(p.nip || '').trim(), pangkat_golongan: String(p.pangkat_golongan || '').trim(), jabatan: String(p.jabatan || '').trim() };\n    const ada = rows.find(r => String(r.id) === data.id);\n    lpjWriteRow_('pegawai', data, ada ? ada._row : null);\n    return { success: true, pegawai: data };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusPegawai_(id) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const dipakai = lpjRows_('lpj_set').some(r => {\n      const d = lpjJson_(r.detail_json, {});\n      return (d.pelaksana || []).indexOf(String(id)) >= 0 || (d.penerima || []).some(x => String(x.pegawai_id) === String(id));\n    });\n    if (dipakai) return { success: false, message: 'Pegawai ini sudah dipakai di LPJ, tidak bisa dihapus.' };\n    const r = lpjRows_('pegawai').find(x => String(x.id) === String(id));\n    if (r) lpjSheet_('pegawai').deleteRow(r._row);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Simpan pengaturan. Key yang tidak dikirim tetap dipertahankan. */\nfunction simpanNomorCfg_(cfg) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const gabung = lpjNomorCfg_();\n    Object.keys(LPJ_PENGATURAN_DEFAULT_).forEach(k => {\n      if (cfg && cfg[k] !== undefined && cfg[k] !== null) gabung[k] = String(cfg[k]).trim();\n    });\n    const sh = lpjSheet_('pengaturan_nomor');\n    const rows = Object.keys(LPJ_PENGATURAN_DEFAULT_).map(k => [k, gabung[k]]);\n    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 2).clearContent();\n    sh.getRange(2, 1, rows.length, 2).setNumberFormat('@').setValues(rows);\n    return { success: true, nomorCfg: lpjNomorCfg_() };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Simpan isian satu set LPJ. Nomor surat yang sudah terkunci tidak diubah. */\nfunction simpanLpjSet_(p) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (!p || !p.key) return { success: false, message: 'Data set tidak valid.' };\n    const now = lpjNow_();\n    const ada = lpjRows_('lpj_set').find(r => String(r.key) === String(p.key));\n    const lama = ada ? lpjSetToObj_(ada) : {};\n    const items = (p.items || []).map(it => ({\n      uraian: it.uraian, kode_rekening: it.kode_rekening || '', program: it.program || '', volume: Number(it.volume) || '', nama: it.nama || '', satuan: it.satuan || '',\n      harga: Number(it.harga) || 0, volume: Number(it.volume) || 0, persen: it.persen === undefined ? 100 : Number(it.persen),\n      keterangan: it.keterangan || '', jumlah: Number(it.jumlah) || 0\n    }));\n    // LPJ dari RKAS: volume item tidak boleh melebihi sisa volume RKAS yang belum di-LPJ-kan di set lain.\n    // Bila volume RKAS tidak diketahui, item yang sudah ada di set lain yang sudah dicetak ditolak.\n    if (String(p.key).indexOf('rkas|') === 0) {\n      const cocok = (a, b) => a.k === b.k && (!a.program || !b.program || a.program === b.program);\n      const pakai = [];\n      lpjRows_('lpj_set').forEach(r => {\n        if (String(r.key) === String(p.key) || String(r.key).indexOf('rkas|') !== 0) return;\n        lpjJson_(r.items_json, []).forEach(it => pakai.push({ k: lpjKunciItemRkas_(it), program: String(it.program || ''), volume: lpjVolumeItem_(it), dicetak: Number(r.nomor_sp) > 0 }));\n      });\n      const rkas = getTableData_('transaksi').map(t => ({ k: lpjKunciItemRkas_(t), program: String(t.program || '').replace(/^'/, ''), volume: Number(t.volume) || 0 }));\n      const salah = [];\n      items.forEach(it => {\n        const x = { k: lpjKunciItemRkas_(it), program: String(it.program || '') };\n        const volRkas = rkas.filter(r => cocok(r, x)).reduce((a, r) => a + r.volume, 0);\n        const lain = pakai.filter(u => cocok(u, x));\n        if (volRkas > 0) {\n          const sisa = Math.round((volRkas - lain.reduce((a, u) => a + u.volume, 0)) * 100) / 100;\n          if (lpjVolumeItem_(it) > sisa + 1e-9) salah.push((it.nama || it.uraian) + ' (sisa ' + Math.max(0, sisa) + ', diisi ' + lpjVolumeItem_(it) + ')');\n        } else if (lain.some(u => u.dicetak)) salah.push((it.nama || it.uraian) + ' (sudah ada di LPJ yang dicetak)');\n      });\n      if (salah.length) return { success: false, message: 'Volume melebihi sisa RKAS yang belum di-LPJ-kan: ' + salah.join(', ') + '.' };\n    }\n    const data = {\n      key: p.key, no_bukti: p.no_bukti || '', kode_kegiatan: p.kode_kegiatan || '', tanggal: p.tanggal || '', jenis: p.jenis || '',\n      vendor_id: p.vendor_id || '', untuk_pembayaran: p.untuk_pembayaran || '', items_json: JSON.stringify(items),\n      total: items.reduce((a, it) => a + it.jumlah, 0),\n      nomor_sp: lama.nomor_sp || '', nomor_bast: lama.nomor_bast || '', nomor_bap: lama.nomor_bap || '', nomor_kwitansi: lama.nomor_kwitansi || '',\n      updated_at: now, detail_json: JSON.stringify(p.detail || {}), nomor_sppd: JSON.stringify(lama.nomor_sppd || [])\n    };\n    lpjWriteRow_('lpj_set', data, ada ? ada._row : null);\n\n    // Katalog hanya untuk belanja barang: ingat nama tampil, satuan & harga per uraian BKU\n    if (data.jenis === 'barang') {\n      const katRows = lpjRows_('katalog_barang');\n      items.forEach(it => {\n        if (!it.satuan || !(it.harga > 0)) return;\n        const kunci = lpjKunciBarang_(it.uraian);\n        const k = katRows.find(r => String(r.kunci) === kunci);\n        const obj = { kunci: kunci, nama: it.nama, satuan: it.satuan, harga: it.harga, updated_at: now };\n        lpjWriteRow_('katalog_barang', obj, k ? k._row : null);\n        if (!k) katRows.push(Object.assign({ _row: lpjSheet_('katalog_barang').getLastRow() }, obj));\n      });\n    }\n    const tersimpan = lpjRows_('lpj_set').find(r => String(r.key) === String(p.key));\n    return { success: true, set: lpjSetToObj_(tersimpan) };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/**\n * Dipanggil saat set dicetak.\n * - Barang : nomor Surat Pesanan, BAST, BAP (urut) + nomor kwitansi.\n * - Perjalanan dinas : satu nomor SPPD per pelaksana (kecuali yang diberi nomor manual).\n * - Honor : tidak memerlukan nomor.\n */\nfunction kunciNomorLpjSet_(key) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const ada = lpjRows_('lpj_set').find(r => String(r.key) === String(key));\n    if (!ada) return { success: false, message: 'Simpan set LPJ terlebih dahulu.' };\n    const set = lpjSetToObj_(ada);\n    if (set.jenis === 'honor') return { success: true, set: set };\n\n    const m = String(set.tanggal).match(/(\\d{4})/);\n    const tahun = m ? m[1] : String(new Date().getFullYear());\n    const cfg = lpjNomorCfg_();\n    const log = lpjRows_('nomor_log').filter(r => String(r.tahun) === tahun);\n    const now = lpjNow_();\n    const ambil = (jenis, awal) => {\n      const maks = log.filter(r => r.jenis === jenis).reduce((a, r) => Math.max(a, Number(r.nomor) || 0), 0);\n      const n = Math.max(maks + 1, Number(awal) || 1);\n      log.push({ tahun: tahun, jenis: jenis, nomor: n });\n      lpjWriteRow_('nomor_log', { tahun: tahun, jenis: jenis, nomor: n, ref_key: key, dibuat: now });\n      return n;\n    };\n    const sh = lpjSheet_('lpj_set');\n    const kolom = LPJ_SHEETS_.lpj_set;\n    const tulis = (k, v) => sh.getRange(ada._row, kolom.indexOf(k) + 1).setNumberFormat('@').setValue(String(v));\n\n    if (set.jenis === 'perjadin') {\n      const pelaksana = (set.detail && set.detail.pelaksana) || [];\n      const manual = (set.detail && set.detail.nomor_manual) || [];\n      const nomor = (set.nomor_sppd || []).slice();\n      pelaksana.forEach((pid, i) => {\n        if (String(manual[i] || '').trim()) { if (!nomor[i]) nomor[i] = 0; return; }\n        if (!nomor[i]) nomor[i] = String(cfg.sppd_sama) !== '0' ? ambil('surat', cfg.nomor_awal_surat) : ambil('sppd', cfg.nomor_awal_sppd);\n      });\n      set.nomor_sppd = nomor.slice(0, pelaksana.length);\n      tulis('nomor_sppd', JSON.stringify(set.nomor_sppd));\n      return { success: true, set: set };\n    }\n\n    if (set.nomor_sp && set.nomor_bast && set.nomor_bap && set.nomor_kwitansi) return { success: true, set: set };\n    if (!set.nomor_sp) set.nomor_sp = ambil('surat', cfg.nomor_awal_surat);\n    if (!set.nomor_bast) set.nomor_bast = ambil('surat', cfg.nomor_awal_surat);\n    if (!set.nomor_bap) set.nomor_bap = ambil('surat', cfg.nomor_awal_surat);\n    if (!set.nomor_kwitansi) set.nomor_kwitansi = ambil('kwitansi', cfg.nomor_awal_kwitansi);\n    ['nomor_sp', 'nomor_bast', 'nomor_bap', 'nomor_kwitansi'].forEach(k => tulis(k, set[k]));\n    return { success: true, set: set };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Hapus set LPJ yang dibuat dari RKAS (set dari BKU selalu dibentuk ulang dari BKU) */\nfunction hapusLpjSet_(key) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const r = lpjRows_('lpj_set').find(x => String(x.key) === String(key));\n    if (r) lpjSheet_('lpj_set').deleteRow(r._row);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\n/** Volume item di set LPJ: tersimpan langsung, atau jumlah \u00f7 harga untuk set lama */\nfunction lpjVolumeItem_(it) {\n  if (Number(it.volume) > 0) return Number(it.volume);\n  return Number(it.harga) > 0 ? Math.round((Number(it.jumlah) || 0) / Number(it.harga) * 100) / 100 : 0;\n}\n\n/** Kunci item RKAS di set LPJ: uraian + kode rekening */\nfunction lpjKunciItemRkas_(it) {\n  return lpjKunciBarang_(it.uraian) + '|' + String(it.kode_rekening || '').replace(/^'/, '').trim();\n}\n\nfunction lpjKunciBarang_(s) {\n  return String(s || '').toLowerCase().replace(/[-\\s]+$/g, '').replace(/\\s+/g, ' ').trim();\n}\n\n/* =====================================================================\n * ASET GAMBAR (logo, kop, latar login) - disimpan terpotong di sheet \"aset\"\n * ===================================================================== */\nconst ASET_KUNCI_ = ['logo_kiri', 'logo_kanan', 'logo_aplikasi', 'logo_login', 'wallpaper_url'];\n\nfunction getAset_() {\n  try {\n    const kumpul = {};\n    lpjRows_('aset').forEach(r => {\n      const k = String(r.key);\n      if (!kumpul[k]) kumpul[k] = [];\n      kumpul[k].push({ i: Number(r.bagian) || 0, d: String(r.data) });\n    });\n    const aset = {};\n    Object.keys(kumpul).forEach(k => { aset[k] = kumpul[k].sort((a, b) => a.i - b.i).map(x => x.d).join(''); });\n    return { success: true, aset: aset };\n  } catch (e) { return { success: false, message: e.toString() }; }\n}\n\nfunction simpanAset_(key, dataUrl) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    if (ASET_KUNCI_.indexOf(key) < 0) return { success: false, message: 'Jenis gambar tidak dikenal.' };\n    const s = String(dataUrl || '');\n    if (s.indexOf('data:image/') !== 0) return { success: false, message: 'Data gambar tidak valid.' };\n    if (s.length > 2000000) return { success: false, message: 'Gambar terlalu besar.' };\n    asetHapusBaris_(key);\n    const sh = lpjSheet_('aset');\n    const potongan = [];\n    for (let i = 0; i < s.length; i += 45000) potongan.push([key, String(potongan.length), s.substr(i, 45000)]);\n    sh.getRange(sh.getLastRow() + 1, 1, potongan.length, 3).setNumberFormat('@').setValues(potongan);\n    return { success: true };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction hapusAset_(key) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try { asetHapusBaris_(key); return { success: true }; }\n  catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction asetHapusBaris_(key) {\n  const sh = lpjSheet_('aset');\n  lpjRows_('aset').filter(r => String(r.key) === String(key)).map(r => r._row).sort((a, b) => b - a).forEach(n => sh.deleteRow(n));\n}\n\n/* =====================================================================\n * MULTI-SEKOLAH: SUPER ADMIN, IZIN (TOKEN), AKUN, SESI\n * ---------------------------------------------------------------------\n * - Spreadsheet MASTER (dibuat otomatis) berisi daftar sekolah, izin, akun.\n * - Setiap sekolah punya spreadsheet data sendiri.\n * - Semua permintaan dari aplikasi masuk lewat api(sesi, metode, argumen);\n *   fungsi data lain berakhiran \"_\" sehingga tidak bisa dipanggil langsung.\n * ===================================================================== */\nlet CTX_ = null;                       // konteks permintaan: { ss, sekolah_id, username, role }\nfunction ss_() { return (CTX_ && CTX_.ss) ? CTX_.ss : SpreadsheetApp.getActiveSpreadsheet(); }\n\nconst MASTER_SHEETS_ = {\n  sekolah: ['id', 'nama', 'spreadsheet_id', 'dibuat'],\n  izin: ['sekolah_id', 'token', 'berlaku_sampai', 'status', 'diubah'],\n  akun: ['username', 'hash', 'salt', 'role', 'sekolah_id', 'nama', 'dibuat', 'terakhir_masuk']\n};\nconst SESI_DETIK_ = 6 * 60 * 60;\n\nfunction props_() { return PropertiesService.getScriptProperties(); }\nfunction master_() {\n  const id = props_().getProperty('MASTER_ID');\n  if (!id) throw new Error('Aplikasi belum dipasang.');\n  return SpreadsheetApp.openById(id);\n}\nfunction mSheet_(name) {\n  const ss = master_();\n  let sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    sh.getRange('A:Z').setNumberFormat('@');\n    sh.getRange(1, 1, 1, MASTER_SHEETS_[name].length).setValues([MASTER_SHEETS_[name]]);\n  }\n  return sh;\n}\nfunction mRows_(name) {\n  const v = mSheet_(name).getDataRange().getValues();\n  const head = v.shift().map(String);\n  return v.map((r, i) => { const o = { _row: i + 2 }; head.forEach((h, j) => o[h] = r[j] === null || r[j] === undefined ? '' : String(r[j])); return o; })\n    .filter(o => String(o[head[0]]).trim() !== '');\n}\nfunction mWrite_(name, obj, row) {\n  const sh = mSheet_(name);\n  const data = MASTER_SHEETS_[name].map(h => obj[h] === undefined || obj[h] === null ? '' : String(obj[h]));\n  sh.getRange(row || sh.getLastRow() + 1, 1, 1, data.length).setNumberFormat('@').setValues([data]);\n}\nfunction hariIni_() { return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd'); }\nfunction tambahTahun_(n) { const d = new Date(); d.setFullYear(d.getFullYear() + (n || 1)); return Utilities.formatDate(d, Session.getScriptTimeZone(), 'yyyy-MM-dd'); }\nfunction hash_(salt, pass) {\n  return Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + pass, Utilities.Charset.UTF_8));\n}\nfunction acak_(n) {\n  const huruf = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n  let s = '';\n  while (s.length < n) Utilities.getUuid().replace(/-/g, '').toUpperCase().split('').forEach(c => { if (s.length < n && huruf.indexOf(c) >= 0) s += c; });\n  return s;\n}\nfunction tokenBaru_() { const a = acak_(12); return 'SPB-' + a.slice(0, 4) + '-' + a.slice(4, 8) + '-' + a.slice(8, 12); }\nfunction validTanggal_(s) { return /^\\d{4}-\\d{2}-\\d{2}$/.test(String(s || '')); }\n\n// Status izin sekolah: { ok, pesan, berlaku_sampai }\nfunction cekIzin_(sekolahId) {\n  const iz = mRows_('izin').find(r => r.sekolah_id === String(sekolahId));\n  if (!iz) return { ok: false, pesan: 'Izin akses sekolah tidak ditemukan. Hubungi super admin.' };\n  if (iz.status !== 'aktif') return { ok: false, pesan: 'Izin akses sekolah ini telah dicabut. Hubungi super admin.', berlaku_sampai: iz.berlaku_sampai };\n  if (iz.berlaku_sampai < hariIni_()) return { ok: false, pesan: 'Masa berlaku akses telah habis (' + iz.berlaku_sampai + '). Hubungi super admin untuk perpanjangan.', berlaku_sampai: iz.berlaku_sampai };\n  return { ok: true, berlaku_sampai: iz.berlaku_sampai };\n}\n\nfunction buatSesi_(akun) {\n  const id = Utilities.getUuid() + Utilities.getUuid();\n  const isi = { username: akun.username, role: akun.role, sekolah_id: akun.sekolah_id };\n  if (akun.role === 'superadmin') isi.gen = props_().getProperty('SESI_SUPER_GEN') || '';\n  CacheService.getScriptCache().put('sesi_' + id, JSON.stringify(isi), SESI_DETIK_);\n  return id;\n}\n\nfunction infoPengguna_(akun) {\n  const info = { username: akun.username, nama: akun.nama || akun.username, role: akun.role };\n  if (akun.role !== 'superadmin') {\n    const sk = mRows_('sekolah').find(s => s.id === akun.sekolah_id) || {};\n    const iz = cekIzin_(akun.sekolah_id);\n    info.sekolah_id = akun.sekolah_id; info.sekolah = sk.nama || ''; info.berlaku_sampai = iz.berlaku_sampai || '';\n  }\n  return info;\n}\n\n/* ---------------- Fungsi publik (tanpa sesi) ---------------- */\n\n/** Jalankan dari editor Apps Script untuk mendapatkan kode pemasangan pertama (lihat Log Eksekusi). */\nfunction kodePemasangan() {\n  // Hanya pemilik skrip (dijalankan dari editor) yang boleh membuat kode; pengunjung web ditolak\n  const aktif = Session.getActiveUser().getEmail(), pemilik = Session.getEffectiveUser().getEmail();\n  if (!aktif || aktif !== pemilik) return;\n  if (props_().getProperty('MASTER_ID')) { Logger.log('Aplikasi sudah dipasang. Kode pemasangan tidak diperlukan lagi.'); return; }\n  const kode = acak_(8);\n  props_().setProperty('KODE_PASANG', kode);\n  Logger.log('KODE PEMASANGAN: ' + kode);\n}\n\n/**\n * Lupa password super admin: jalankan dari editor Apps Script, lalu lihat Log Eksekusi.\n * Membuat password sementara baru, mengeluarkan semua sesi super admin yang sedang aktif.\n * Jika akun super admin tidak ada lagi di file Master, akun \"superadmin\" dibuat ulang.\n */\nfunction resetPasswordSuperAdmin() {\n  // Hanya pemilik skrip (dijalankan dari editor) yang boleh mereset\n  const aktif = Session.getActiveUser().getEmail(), pemilik = Session.getEffectiveUser().getEmail();\n  if (!aktif || aktif !== pemilik) return;\n  if (!props_().getProperty('MASTER_ID')) { Logger.log('Aplikasi belum dipasang. Jalankan kodePemasangan lalu lakukan pemasangan pertama dari aplikasi web.'); return; }\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    const sh = mSheet_('akun'), kol = MASTER_SHEETS_.akun;\n    let daftar = mRows_('akun').filter(a => a.role === 'superadmin');\n    const sementara = acak_(10);\n    if (!daftar.length) {\n      const salt = Utilities.getUuid();\n      mWrite_('akun', { username: 'superadmin', hash: hash_(salt, sementara), salt: salt, role: 'superadmin', sekolah_id: '', nama: 'Super Admin', dibuat: lpjNow_() });\n      Logger.log('Akun super admin tidak ditemukan, akun baru dibuat.');\n      daftar = [{ username: 'superadmin' }];\n    } else {\n      daftar.forEach(a => {\n        const salt = Utilities.getUuid();\n        sh.getRange(a._row, kol.indexOf('hash') + 1).setNumberFormat('@').setValue(hash_(salt, sementara));\n        sh.getRange(a._row, kol.indexOf('salt') + 1).setNumberFormat('@').setValue(salt);\n      });\n    }\n    // Sesi super admin lama tidak berlaku lagi\n    props_().setProperty('SESI_SUPER_GEN', String(Date.now()));\n    Logger.log('USERNAME SUPER ADMIN: ' + daftar.map(a => a.username).join(', '));\n    Logger.log('PASSWORD SEMENTARA : ' + sementara);\n    Logger.log('Segera masuk ke aplikasi dan ganti password lewat tombol \"Ganti password\".');\n  } finally { lock.releaseLock(); }\n}\n\nfunction statusPemasangan() {\n  try {\n    if (props_().getProperty('MASTER_ID')) return { terpasang: true };\n    let nama = '';\n    try { const kop = getKopSurat_(); nama = kop.sekolah || ''; } catch (e) {}\n    return { terpasang: false, nama_sekolah_ini: nama };\n  } catch (e) { return { terpasang: false, nama_sekolah_ini: '' }; }\n}\n\n/** Pemasangan pertama: buat master + akun super admin (+ daftarkan spreadsheet ini sebagai sekolah pertama). */\nfunction pasangAplikasi(f) {\n  const lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    if (props_().getProperty('MASTER_ID')) return { success: false, message: 'Aplikasi sudah dipasang.' };\n    const kode = props_().getProperty('KODE_PASANG');\n    if (!kode || String(f.kode || '').trim().toUpperCase() !== kode) return { success: false, message: 'Kode pemasangan salah. Jalankan fungsi kodePemasangan di editor Apps Script untuk mendapatkan kode.' };\n    const u = String(f.username || '').trim().toLowerCase();\n    if (!/^[a-z0-9._-]{4,30}$/.test(u)) return { success: false, message: 'Username 4\u201330 karakter: huruf kecil, angka, titik, garis bawah, atau strip.' };\n    if (String(f.password || '').length < 8) return { success: false, message: 'Password minimal 8 karakter.' };\n\n    const ini = SpreadsheetApp.getActiveSpreadsheet();\n    const master = SpreadsheetApp.create('SIPEDABOS - Master');\n    props_().setProperty('MASTER_ID', master.getId());\n    Object.keys(MASTER_SHEETS_).forEach(mSheet_);\n    const awal = master.getSheetByName('Sheet1'); if (awal && master.getSheets().length > 1) master.deleteSheet(awal);\n\n    const salt = Utilities.getUuid();\n    mWrite_('akun', { username: u, hash: hash_(salt, f.password), salt: salt, role: 'superadmin', sekolah_id: '', nama: f.nama || 'Super Admin', dibuat: lpjNow_() });\n\n    let token = '';\n    if (f.daftarkanIni) {\n      const id = 'S' + acak_(6);\n      mWrite_('sekolah', { id: id, nama: String(f.nama_sekolah || '').trim() || 'Sekolah 1', spreadsheet_id: ini.getId(), dibuat: lpjNow_() });\n      token = tokenBaru_();\n      mWrite_('izin', { sekolah_id: id, token: token, berlaku_sampai: validTanggal_(f.berlaku_sampai) ? f.berlaku_sampai : tambahTahun_(1), status: 'aktif', diubah: lpjNow_() });\n    }\n    props_().deleteProperty('KODE_PASANG');\n    return { success: true, token: token };\n  } catch (e) { return { success: false, message: e.toString() }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction masuk(username, password) {\n  try {\n    const u = String(username || '').trim().toLowerCase();\n    const akun = mRows_('akun').find(a => a.username === u);\n    if (!akun || hash_(akun.salt, String(password || '')) !== akun.hash) return { success: false, message: 'Username atau password salah.' };\n    if (akun.role !== 'superadmin') { const iz = cekIzin_(akun.sekolah_id); if (!iz.ok) return { success: false, message: iz.pesan }; }\n    mSheet_('akun').getRange(akun._row, MASTER_SHEETS_.akun.indexOf('terakhir_masuk') + 1).setNumberFormat('@').setValue(lpjNow_());\n    return { success: true, sesi: buatSesi_(akun), user: infoPengguna_(akun) };\n  } catch (e) { return { success: false, message: String(e.message || e) }; }\n}\n\n/** Bendahara mengaktifkan akses dengan token dari super admin, sekaligus membuat akun. */\nfunction aktivasiToken(f) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const token = String(f.token || '').trim().toUpperCase();\n    const iz = mRows_('izin').find(r => r.token === token);\n    if (!iz) return { success: false, message: 'Token tidak dikenal. Periksa kembali token dari super admin.' };\n    const cek = cekIzin_(iz.sekolah_id);\n    if (!cek.ok) return { success: false, message: cek.pesan };\n    if (mRows_('akun').some(a => a.sekolah_id === iz.sekolah_id)) return { success: false, message: 'Sekolah ini sudah punya akun. Silakan masuk, atau minta super admin mereset akun bila lupa password.' };\n    const u = String(f.username || '').trim().toLowerCase();\n    if (!/^[a-z0-9._-]{4,30}$/.test(u)) return { success: false, message: 'Username 4\u201330 karakter: huruf kecil, angka, titik, garis bawah, atau strip.' };\n    if (mRows_('akun').some(a => a.username === u)) return { success: false, message: 'Username sudah dipakai. Pilih username lain.' };\n    if (String(f.password || '').length < 8) return { success: false, message: 'Password minimal 8 karakter.' };\n    const salt = Utilities.getUuid();\n    const akun = { username: u, hash: hash_(salt, f.password), salt: salt, role: 'bendahara', sekolah_id: iz.sekolah_id, nama: String(f.nama || '').trim(), dibuat: lpjNow_(), terakhir_masuk: lpjNow_() };\n    mWrite_('akun', akun);\n    return { success: true, sesi: buatSesi_(akun), user: infoPengguna_(akun) };\n  } catch (e) { return { success: false, message: String(e.message || e) }; }\n  finally { lock.releaseLock(); }\n}\n\nfunction keluar(sesi) { try { CacheService.getScriptCache().remove('sesi_' + sesi); } catch (e) {} return { success: true }; }\n\n/* ---------------- Satu pintu untuk semua fungsi data ---------------- */\nconst API_SEKOLAH_ = {\n  getTableData: (n) => { if (['transaksi', 'bku'].indexOf(n) < 0) throw new Error('Data tidak tersedia.'); return getTableData_(n); },\n  // Satu panggilan untuk data awal (lebih cepat daripada 4 panggilan terpisah)\n  muatAwal: () => ({ kop: getKopSurat_(), transaksi: getTableData_('transaksi'), bku: getTableData_('bku'), aset: getAset_() }),\n  getKopSurat: () => getKopSurat_(), updateKopSurat: (d) => updateKopSurat_(d),\n  importTransaksi: (d) => importTransaksi_(d), clearAllTransactions: () => clearAllTransactions_(),\n  importBKU: (d, i) => importBKU_(d, i), clearAllBKU: () => clearAllBKU_(),\n  getLaporanData: () => getLaporanData_(), simpanLaporanIsian: (k, o) => simpanLaporanIsian_(k, o),\n  getLpjData: () => getLpjData_(), simpanVendor: (v) => simpanVendor_(v), hapusVendor: (id) => hapusVendor_(id),\n  simpanPegawai: (p) => simpanPegawai_(p), hapusPegawai: (id) => hapusPegawai_(id), simpanNomorCfg: (c) => simpanNomorCfg_(c),\n  simpanLpjSet: (p) => simpanLpjSet_(p), kunciNomorLpjSet: (k) => kunciNomorLpjSet_(k), hapusLpjSet: (k) => hapusLpjSet_(k),\n  getAset: () => getAset_(), simpanAset: (k, d) => simpanAset_(k, d), hapusAset: (k) => hapusAset_(k),\n  gantiPassword: (lama, baru) => gantiPassword_(lama, baru)\n};\nconst API_SUPER_ = {\n  daftarSekolah: () => daftarSekolah_(), tambahSekolah: (f) => tambahSekolah_(f),\n  aturIzin: (id, f) => aturIzin_(id, f), tokenBaruSekolah: (id) => tokenBaruSekolah_(id), resetAkun: (id) => resetAkun_(id),\n  gantiPassword: (lama, baru) => gantiPassword_(lama, baru)\n};\n\nfunction api(sesi, metode, args) {\n  CTX_ = null;\n  try {\n    const raw = sesi ? CacheService.getScriptCache().get('sesi_' + sesi) : null;\n    if (!raw) return { ok: false, auth: false, message: 'Sesi telah berakhir. Silakan masuk kembali.' };\n    const s = JSON.parse(raw);\n    CacheService.getScriptCache().put('sesi_' + sesi, raw, SESI_DETIK_);   // perpanjang sesi selama aktif\n    if (s.role === 'superadmin') {\n      if ((s.gen || '') !== (props_().getProperty('SESI_SUPER_GEN') || '')) { keluar(sesi); return { ok: false, auth: false, message: 'Password super admin telah direset. Silakan masuk kembali.' }; }\n      // Super admin memilih sekolah yang datanya ingin dikelola ('' = kembali ke panel)\n      if (metode === 'kelolaSekolah') {\n        const id = String((args || [])[0] || '');\n        if (!id) { delete s.sekolah_aktif; delete s.sekolah_ssid; CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_); return { ok: true, data: { success: true } }; }\n        const sk = mRows_('sekolah').find(x => x.id === id);\n        if (!sk) return { ok: true, data: { success: false, message: 'Data sekolah tidak ditemukan.' } };\n        SpreadsheetApp.openById(sk.spreadsheet_id);   // pastikan spreadsheet sekolah masih bisa dibuka\n        s.sekolah_aktif = id; s.sekolah_ssid = sk.spreadsheet_id;\n        CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_);\n        return { ok: true, data: { success: true, sekolah: { id: sk.id, nama: sk.nama } } };\n      }\n      const f = API_SUPER_[metode];\n      if (f) {\n        CTX_ = { username: s.username, role: s.role };\n        return { ok: true, data: f.apply(null, args || []) };\n      }\n      // Fungsi data BOS: dijalankan pada sekolah yang sedang dikelola super admin\n      const fs = API_SEKOLAH_[metode];\n      if (!fs) return { ok: false, message: 'Fungsi tidak dikenal.' };\n      if (!s.sekolah_aktif) return { ok: false, message: 'Pilih sekolah yang akan dikelola dari Panel Super Admin.' };\n      let ssidA = s.sekolah_ssid;\n      if (!ssidA) {\n        const ska = mRows_('sekolah').find(x => x.id === s.sekolah_aktif);\n        if (!ska) return { ok: false, message: 'Data sekolah tidak ditemukan.' };\n        ssidA = s.sekolah_ssid = ska.spreadsheet_id;\n        CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_);\n      }\n      CTX_ = { ss: SpreadsheetApp.openById(ssidA), sekolah_id: s.sekolah_aktif, username: s.username, role: s.role };\n      return { ok: true, data: fs.apply(null, args || []) };\n    }\n    const f = API_SEKOLAH_[metode];\n    if (!f) return { ok: false, message: 'Fungsi tidak dikenal.' };\n    // Pemeriksaan akun & izin di file Master disimpan sementara (maks. 10 menit) agar setiap klik tidak membuka file Master.\n    // Perubahan izin/akun oleh super admin menaikkan VERSI_IZIN sehingga pemeriksaan langsung diulang.\n    const versi = props_().getProperty('VERSI_IZIN') || '0', kini = Date.now();\n    let ssid = s.cek && s.cek.v === versi && kini - s.cek.t < 600000 && s.cek.hari === hariIni_() ? s.cek.ssid : '';\n    if (!ssid) {\n      if (!mRows_('akun').some(a => a.username === s.username)) { keluar(sesi); return { ok: false, auth: false, message: 'Akun tidak ditemukan. Hubungi super admin.' }; }\n      const izin = cekIzin_(s.sekolah_id);\n      if (!izin.ok) { keluar(sesi); return { ok: false, auth: false, message: izin.pesan }; }\n      const sk = mRows_('sekolah').find(x => x.id === s.sekolah_id);\n      if (!sk) return { ok: false, auth: false, message: 'Data sekolah tidak ditemukan.' };\n      ssid = sk.spreadsheet_id;\n      s.cek = { v: versi, t: kini, hari: hariIni_(), ssid: ssid };\n      CacheService.getScriptCache().put('sesi_' + sesi, JSON.stringify(s), SESI_DETIK_);\n    }\n    CTX_ = { ss: SpreadsheetApp.openById(ssid), sekolah_id: s.sekolah_id, username: s.username, role: s.role };\n    return { ok: true, data: f.apply(null, args || []) };\n  } catch (e) {\n    return { ok: false, message: String(e.message || e) };\n  } finally { CTX_ = null; }\n}\n\n/* ---------------- Fungsi akun ---------------- */\nfunction gantiPassword_(lama, baru) {\n  const akun = mRows_('akun').find(a => a.username === CTX_.username);\n  if (!akun || hash_(akun.salt, String(lama || '')) !== akun.hash) return { success: false, message: 'Password lama salah.' };\n  if (String(baru || '').length < 8) return { success: false, message: 'Password baru minimal 8 karakter.' };\n  const salt = Utilities.getUuid();\n  const sh = mSheet_('akun'), kol = MASTER_SHEETS_.akun;\n  sh.getRange(akun._row, kol.indexOf('hash') + 1).setNumberFormat('@').setValue(hash_(salt, baru));\n  sh.getRange(akun._row, kol.indexOf('salt') + 1).setNumberFormat('@').setValue(salt);\n  return { success: true };\n}\n\n/* ---------------- Fungsi super admin ---------------- */\nfunction daftarSekolah_() {\n  const izin = mRows_('izin'), akun = mRows_('akun'), hari = hariIni_();\n  const data = mRows_('sekolah').map(s => {\n    const iz = izin.find(i => i.sekolah_id === s.id) || {};\n    const ak = akun.find(a => a.sekolah_id === s.id) || null;\n    const status = iz.status !== 'aktif' ? 'dicabut' : (iz.berlaku_sampai < hari ? 'habis' : 'aktif');\n    return { id: s.id, nama: s.nama, dibuat: s.dibuat, url: 'https://docs.google.com/spreadsheets/d/' + s.spreadsheet_id + '/edit',\n      token: iz.token || '', berlaku_sampai: iz.berlaku_sampai || '', status: status,\n      akun: ak ? { username: ak.username, nama: ak.nama, terakhir_masuk: ak.terakhir_masuk } : null };\n  });\n  return { success: true, sekolah: data, hari_ini: hari };     const joinParts = (arr, sep) => arr.sort((p, q) => Math.abs(p.y - q.y) > 2 ? q.y - p.y : p.x - q.x).map(p => p.str).join(sep).replace(/\s+/g, ' ').trim();

    anchors.forEach(r => {
      const nums = r.nums.sort((p, q) => p.x - q.x);
      let pen = 0,
          peng = 0,
          saldo = 0;

      if (nums.length === 3) {
        [pen, peng, saldo] = nums.map(n => toNum(n.str));
      } else {
        nums.forEach(n => {
          const d = [6, 7, 8].map(k => Math.abs(n.cx - cols[k]));
          const k = [6, 7, 8][d.indexOf(Math.min(...d))];
          if (k === 6) pen = toNum(n.str);else if (k === 7) peng = toNum(n.str);else saldo = toNum(n.str);
        });
        warnings.push("Hal. ".concat(pIdx + 1, ", ").concat(r.a.str, ": jumlah kolom nominal tidak lengkap (").concat(nums.length, "), mohon cek."));
      }

      const [, dd, mm, yyyy] = r.a.str.match(DATE_RE);
      const uraian = joinParts(r.parts[5], ' ');
      rows.push({
        tanggal: "".concat(dd, "-").concat(mm, "-").concat(yyyy),
        bulan: mm,
        kode_kegiatan: joinParts(r.parts[2], ''),
        kode_rekening: joinParts(r.parts[3], ''),
        no_bukti: joinParts(r.parts[4], ''),
        uraian,
        penerimaan: pen,
        pengeluaran: peng,
        saldo,
        jenis: /^saldo (bank|tunai) bulan/i.test(uraian) ? 'saldo_awal' : ''
      });
    });
  });
  let running = null;
  rows.forEach(r => {
    const expected = (running === null ? 0 : running) + r.penerimaan - r.pengeluaran;
    if (Math.abs(expected - r.saldo) > 0.5) warnings.push("".concat(r.tanggal, " \"").concat(r.uraian, "\": saldo tercetak ").concat(r.saldo.toLocaleString('id-ID'), ", hasil hitung ").concat(expected.toLocaleString('id-ID'), "."));
    running = r.saldo;
  });

  if (info.saldo_bku !== null && rows.length && Math.abs(rows[rows.length - 1].saldo - info.saldo_bku) > 0.5) {
    warnings.push("Saldo akhir baris (".concat(rows[rows.length - 1].saldo.toLocaleString('id-ID'), ") berbeda dengan Saldo BKU penutupan (").concat(info.saldo_bku.toLocaleString('id-ID'), ")."));
  }

  return {
    rows,
    info,
    warnings
  };
};

const LPJ = (() => {
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

  const parseTanggal = s => {
    const str = String(s || '').trim();
    let m = str.match(/^(\d{2})[-/](\d{2})[-/](\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    return null;
  };

  const tglPanjang = s => {
    const d = parseTanggal(s);
    return d ? "".concat(String(d.getDate()).padStart(2, '0'), " ").concat(BULAN[d.getMonth()], " ").concat(d.getFullYear()) : '-';
  };

  const tglPendek = s => {
    const d = parseTanggal(s);
    return d ? "".concat(String(d.getDate()).padStart(2, '0'), "-").concat(['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][d.getMonth()], "-").concat(d.getFullYear()) : '-';
  };

  const SATUAN = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];

  const eja = n => {
    n = Math.floor(Math.abs(n));
    if (n < 12) return SATUAN[n];
    if (n < 20) return eja(n - 10) + ' Belas';
    if (n < 100) return eja(Math.floor(n / 10)) + ' Puluh ' + eja(n % 10);
    if (n < 200) return 'Seratus ' + eja(n - 100);
    if (n < 1000) return eja(Math.floor(n / 100)) + ' Ratus ' + eja(n % 100);
    if (n < 2000) return 'Seribu ' + eja(n - 1000);
    if (n < 1e6) return eja(Math.floor(n / 1000)) + ' Ribu ' + eja(n % 1000);
    if (n < 1e9) return eja(Math.floor(n / 1e6)) + ' Juta ' + eja(n % 1e6);
    if (n < 1e12) return eja(Math.floor(n / 1e9)) + ' Miliar ' + eja(n % 1e9);
    return eja(Math.floor(n / 1e12)) + ' Triliun ' + eja(n % 1e12);
  };

  const terbilang = n => (Math.floor(Math.abs(Number(n) || 0)) === 0 ? 'Nol' : eja(n)).replace(/\s+/g, ' ').trim();

  const terbilangRupiah = n => terbilang(n) + ' Rupiah';

    const d = parseTanggal(s);
    if (!d) return 'Pada hari ini ..........';
    return "Pada hari ini ".concat(HARI[d.getDay()], ", Tanggal ").concat(terbilang(d.getDate()), ", Bulan ").concat(BULAN[d.getMonth()], ", Tahun ").concat(terbilang(d.getFullYear()));
  };

    for (let i = 1; i <= m; i++) {
      const cur = [i];

      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

      prev = cur;
    }

    return 1 - prev[n] / Math.max(m, n);
  };

  const cariRkas = (rkas, uraian, rek) => {
    if (!rkas) return null;
    const k = kunciBarang(uraian);
    if (rkas[k]) return rkas[k];
    const r = String(rek || '').replace(/^'/, '');
    let terbaik = null,
        skor = 0;
    (rkas._daftar || []).forEach(v => {
      if (r && v.rek && v.rek !== r) return;
      const s = mirip(k, v.kunci);

      if (s > skor) {
        skor = s;
        terbaik = v;
      }
    });
    return skor >= 0.85 ? terbaik : null;
  };

  const lengkapiItems = (items, simpanan, katalog, rkas) => items.map((it, i) => {
    const sv = simpanan && simpanan[i] && kunciBarang(simpanan[i].uraian) === kunciBarang(it.uraian) ? simpanan[i] : null;
    const ktSimpan = (katalog || {})[kunciBarang(it.uraian)] || null;
    const kt = ktSimpan || cariRkas(rkas, it.uraian, it.kode_rekening) || null;
    const harga = Number(sv && sv.harga || kt && kt.harga || 0);
    const satuan = sv && sv.satuan || kt && kt.satuan || '';
    const nama = sv && sv.nama || ktSimpan && ktSimpan.nama || rapikanNama(it.uraian);
    const volume = harga > 0 ? it.jumlah / harga : 0;
    return { ...it,
      nama,
      satuan,
      harga,
      volume
    };
  });

  const cekSet = (set, items, vendor) => {
    const masalah = [];
    if (set.jenis === 'barang' && !vendor) masalah.push('Toko belum dipilih');
    items.forEach(it => {
      if (!it.satuan) masalah.push("Satuan \"".concat(it.nama, "\" kosong"));
      if (!(it.harga > 0)) masalah.push("Harga \"".concat(it.nama, "\" kosong"));else if (Math.abs(it.volume - Math.round(it.volume)) > 0.001) masalah.push("\"".concat(it.nama, "\": ").concat(rupiah(it.jumlah), " \xF7 ").concat(rupiah(it.harga), " tidak bulat"));
    });
    return masalah;
  };

  const formatNomorSppd = (cfg, nomor, tanggal, manual) => {
    if (String(manual || '').trim()) return String(manual).trim();
    if (!nomor) return '';
    if (String(cfg.sppd_sama) !== '0') return formatNomor(cfg, nomor, tanggal);
    const fmt = String(cfg.format_sppd || '').trim() || formatSuratLama(cfg.sppd_klasifikasi, cfg.sppd_kode_sekolah);
    return isiFormat(fmt, nomor, tanggal, String(cfg.ikut_tanggal) !== '0');
  };

  const lamaHari = (a, b) => {
    const d1 = parseTanggal(a),
          d2 = parseTanggal(b);
    if (!d1 || !d2) return 0;
    return Math.round((d2 - d1) / 86400000) + 1;
  };

  const hitungRincian = rows => rows.map(r => {
    const v = Number(r.volume) || 0,
          n = Number(r.harga) || 0;
    const p = r.persen === '' || r.persen === undefined || r.persen === null ? 100 : Number(r.persen);
    return { ...r,
      jumlah_hitung: Math.round(v * n * p / 100)
    };
  });

  const cekPerjadin = (detail, rincian, pegawai) => {
    const m = [];
    const pel = (detail.pelaksana || []).filter(Boolean);
    if (!pel.length) m.push('Pelaksana perjalanan belum dipilih');
    pel.forEach(id => {
      const p = pegawai.find(x => x.id === id);
      if (!p) m.push('Ada pelaksana yang sudah dihapus dari daftar pegawai');
    });
    if (!String(detail.maksud || '').trim()) m.push('Maksud perjalanan kosong');
    if (!String(detail.tujuan || '').trim()) m.push('Tempat tujuan kosong');
    if (!parseTanggal(detail.tgl_berangkat) || !parseTanggal(detail.tgl_kembali)) m.push('Tanggal berangkat/kembali belum diisi');else if (lamaHari(detail.tgl_berangkat, detail.tgl_kembali) < 1) m.push('Tanggal kembali lebih awal dari tanggal berangkat');
    rincian.forEach(r => {
      const label = r.nama || rapikanNama(r.uraian);
      if (!(Number(r.volume) > 0) || !(Number(r.harga) > 0)) m.push("\"".concat(label, "\": volume dan nominal wajib diisi"));else if (r.jumlah_hitung !== r.jumlah) m.push("\"".concat(label, "\": ").concat(rupiah(r.volume), " \xD7 ").concat(rupiah(r.harga)).concat(Number(r.persen) !== 100 ? ' × ' + r.persen + '%' : '', " = ").concat(rupiah(r.jumlah_hitung), ", tidak sama dengan BKU ").concat(rupiah(r.jumlah)));
    });
    return m;
  };

  const hitungHonor = rows => rows.map(r => {
    const bruto = Number(r.bruto) || 0;
    const persen = Number(r.pph_persen) || 0;
    const pph = Math.round(bruto * persen / 100);
    return { ...r,
      bruto,
      pph_persen: persen,
      pph,
      netto: bruto - pph
    };
  });

  const cekHonor = (set, rows, pegawai) => {
    const m = [];
    if (!rows.length) m.push('Belum ada penerima honor');
    rows.forEach((r, i) => {
      const p = pegawai.find(x => x.id === r.pegawai_id);
      if (!p) m.push("Penerima baris ".concat(i + 1, " belum dipilih"));
      if (!(r.bruto > 0)) m.push("Jumlah honor baris ".concat(i + 1, " kosong"));
    });
    const tot = rows.reduce((a, r) => a + r.bruto, 0);
    if (rows.length && tot !== set.total) m.push("Total honor ".concat(rupiah(tot), " belum sama dengan BKU ").concat(rupiah(set.total), " (selisih ").concat(rupiah(set.total - tot), ")"));
    return m;
  };

  return {
    katalogRkas,
    cariRkas,
    posisiKosong,
    isiFormat,
    formatNomorSppd,
    lamaHari,
    hitungRincian,
    cekPerjadin,
    hitungHonor,
    cekHonor,
    parseTanggal,
    tglPanjang,
    tglPendek,
    terbilang,
    terbilangRupiah,
    kalimatHariIni,
    rupiah,
    formatNomor,
    kunciBarang,
    rapikanNama,
    kelompokkanBku,
    lengkapiItems,
    cekSet,
    ROMAWI,
    BULAN
  };
})();

};
const lpjLocal = {
  vendor: [],

  log: []
};

const lpjApi = async (method, ...args) => {
  if (typeof google !== 'undefined') {
    const res = await runGas(method, ...args);
    if (res && res.success === false) throw new Error(res.message || 'Gagal memproses data.');
    return res;
  }

  const L = lpjLocal;

  if (method === 'getLpjData') {
    const nomorTerakhir = {};
    L.log.forEach(x => {
      nomorTerakhir[x.th] = nomorTerakhir[x.th] || {};
      nomorTerakhir[x.th][x.jenis] = Math.max(nomorTerakhir[x.th][x.jenis] || 0, x.n);
    });
    return {
      success: true,
      vendor: L.vendor,
      pegawai: L.pegawai,
      katalog: L.katalog,
      sets: L.sets,
      nomorCfg: L.nomorCfg,
      nomorTerakhir
    };
  }

  if (method === 'simpanPegawai') {
    const v = { ...args[0],
      id: args[0].id || 'p' + Date.now()
    };
    L.pegawai = L.pegawai.filter(x => x.id !== v.id).concat(v);
    return {
      success: true,
      pegawai: v
    };
  }

  if (method === 'hapusPegawai') {
    if (Object.values(L.sets).some(s => ((s.detail || {}).pelaksana || []).includes(args[0]) || ((s.detail || {}).penerima || []).some(r => r.pegawai_id === args[0]))) throw new Error('Pegawai ini sudah dipakai di LPJ, tidak bisa dihapus.');
    L.pegawai = L.pegawai.filter(x => x.id !== args[0]);
    return {
      success: true
    };
  }

  if (method === 'simpanVendor') {
    const v = { ...args[0],
      id: args[0].id || 'v' + Date.now()
    };
    L.vendor = L.vendor.filter(x => x.id !== v.id).concat(v);
    return {
      success: true,
      vendor: v
    };
  }

  if (method === 'hapusVendor') {
    if (Object.values(L.sets).some(s => s.vendor_id === args[0])) throw new Error('Toko ini sudah dipakai di LPJ, tidak bisa dihapus.');
    L.vendor = L.vendor.filter(x => x.id !== args[0]);
    return {
      success: true
    };
  }

  if (method === 'simpanNomorCfg') {
    L.nomorCfg = { ...L.nomorCfg,
      ...args[0]
    };
    return {
      success: true,
      nomorCfg: L.nomorCfg
    };
  }

  if (method === 'simpanLpjSet') {
    const p = args[0];
    const lama = L.sets[p.key] || {};
    if (p.jenis === 'barang') p.items.forEach(it => {
      if (it.satuan && it.harga > 0) L.katalog[LPJ.kunciBarang(it.uraian)] = {
        nama: it.nama,
        satuan: it.satuan,
        harga: it.harga
      };
    });
    L.sets[p.key] = { ...p,
      detail: p.detail || {},
      total: p.items.reduce((a, i) => a + i.jumlah, 0),
      nomor_sp: lama.nomor_sp || 0,
      nomor_bast: lama.nomor_bast || 0,
      nomor_bap: lama.nomor_bap || 0,
      nomor_kwitansi: lama.nomor_kwitansi || 0,
      nomor_sppd: lama.nomor_sppd || []
    };
    return {
      success: true,
      set: L.sets[p.key]
    };
  }

  if (method === 'hapusLpjSet') {
    delete L.sets[args[0]];
    return {
      success: true
    };
  }

  if (method === 'kunciNomorLpjSet') {
    const s = L.sets[args[0]];
    const th = (String(s.tanggal).match(/\d{4}/) || [''])[0];

    const ambil = (jenis, awal) => {
      const n = Math.max(L.log.filter(x => x.th === th && x.jenis === jenis).reduce((a, x) => Math.max(a, x.n), 0) + 1, Number(awal) || 1);
      L.log.push({
        th,
        jenis,
        n
      });
      return n;
    };

    if (s.jenis === 'honor') return {
      success: true,
      set: s
    };

    if (s.jenis === 'perjadin') {
      const man = s.detail.nomor_manual || [];
      const nm = (s.nomor_sppd || []).slice();
      (s.detail.pelaksana || []).forEach((id, i) => {
        if (String(man[i] || '').trim()) {
          if (!nm[i]) nm[i] = 0;
        } else if (!nm[i]) nm[i] = String(L.nomorCfg.sppd_sama) !== '0' ? ambil('surat', L.nomorCfg.nomor_awal_surat) : ambil('sppd', L.nomorCfg.nomor_awal_sppd);
      });
      s.nomor_sppd = nm.slice(0, (s.detail.pelaksana || []).length);
      return {
        success: true,
        set: s
      };
    }

    ['nomor_sp', 'nomor_bast', 'nomor_bap'].forEach(k => {
      if (!s[k]) s[k] = ambil('surat', L.nomorCfg.nomor_awal_surat);
    });
    if (!s.nomor_kwitansi) s.nomor_kwitansi = ambil('kwitansi', L.nomorCfg.nomor_awal_kwitansi);
    return {
      success: true,
      set: s
    };
  }

  return null;
};

const LAP = (() => {
  const num = v => Number(v) || 0;

  const tgl = s => {
    const str = String(s || '').trim();
    let m = str.match(/^(\d{2})[-/](\d{2})[-/](\d{4})$/);
    if (m) return {
      d: +m[1],
      m: +m[2],
      y: +m[3]
    };
    m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return {
      d: +m[3],
      m: +m[2],
      y: +m[1]

  const periodeDari = s => {
    const t = tgl(s);
    return t ? "".concat(t.y, "-").concat(String(t.m).padStart(2, '0')) : '';
  };

  const iso = (y, m, d) => "".concat(y, "-").concat(String(m).padStart(2, '0'), "-").concat(String(d).padStart(2, '0'));

  const akhirBulan = (y, m) => new Date(y, m, 0).getDate();

  const urutTgl = s => {
    const t = tgl(s);
    return t ? t.y * 10000 + t.m * 100 + t.d : 0;
  };

  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  const namaPeriode = p => {
    const [y, m] = String(p).split('-');
    return m ? "".concat(BULAN[+m - 1], " ").concat(y) : p;
  };

  const jenis = r => {
    const u = String(r.uraian || '');
    const rek = String(r.kode_rekening || '').replace(/^'/, '');
    if (/^saldo (bank|tunai) bulan/i.test(u)) return 'saldo_awal';
    if (!r.no_bukti && /(pph|ppn|pajak)/i.test(u)) return 'pajak';
    if (/bunga bank/i.test(u) || /^jasa giro/i.test(u)) return 'bunga';
    if (/(tarik tunai|penarikan tunai|setor tunai|pergeseran)/i.test(u)) return 'transfer';
    if (num(r.penerimaan) > 0 && num(r.pengeluaran) === 0) return 'terima';

    if (num(r.pengeluaran) > 0) {
      if (/honor/i.test(u)) return 'pegawai';
      if (rek.startsWith('5.2')) return 'modal';
      return 'barjas';
    }

  const barisPeriode = (rows, p) => rows.filter(r => periodeDari(r.tanggal) === p);

  const daftarPeriode = rows => Array.from(new Set(rows.map(r => periodeDari(r.tanggal)).filter(Boolean))).sort();

  const ringkasBulan = (rows, p, infoMap) => {

    const K = b.reduce((a, r) => a + num(r.pengeluaran), 0);

    const info = (infoMap || {})[p] || null;
    const terakhir = b.slice().sort((a, c) => urutTgl(a.tanggal) - urutTgl(c.tanggal)).pop();

          py = m === 1 ? y - 1 : y;

      K,
      saldo_buku: D - K,

      saldo_bank: info && info.saldo_bank !== null && info.saldo_bank !== '' && info.saldo_bank !== undefined ? num(info.saldo_bank) : saldoAkhir,
      saldo_tunai: info && info.saldo_tunai !== null && info.saldo_tunai !== '' && info.saldo_tunai !== undefined ? num(info.saldo_tunai) : 0,

const RKAS_OCR = (() => {
  const TESS_OPS = {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1'
  };
  const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const SKALA = 300 / 72;
  const KOLOM = 12;
  const KOLOM_ANGKA = [4, 6, 7, 8, 9, 10, 11];

  const muatTesseract = () => new Promise((res, rej) => {
    if (window.Tesseract) return res(window.Tesseract);
    const s = document.createElement('script');
    s.src = TESS_SRC;

    s.onload = () => res(window.Tesseract);

    s.onerror = () => rej(new Error('Pustaka OCR gagal dimuat. Periksa koneksi internet.'));

    document.head.appendChild(s);
  });

  const kelompok = (arr, jarak = 4) => {
    const g = [];
    arr.forEach(x => {
      if (g.length && x - g[g.length - 1][g[g.length - 1].length - 1] <= jarak) g[g.length - 1].push(x);else g.push([x]);
    });
    return g.map(a => Math.round(a.reduce((s, v) => s + v, 0) / a.length));
  };

  const cariGrid = img => {
    const {
      data,
      width: w,
      height: h
    } = img;
    const gelap = new Uint8Array(w * h);

    for (let i = 0, p = 0; i < data.length; i += 4, p++) gelap[p] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114 < 140 ? 1 : 0;

    const H = [];

    for (let y = 0; y < h; y++) {
      let n = 0;
      const o = y * w;

      for (let x = 0; x < w; x++) n += gelap[o + x];

      if (n / w > 0.6) H.push(y);
    }

    const Hg = kelompok(H);
    if (Hg.length < 2) return {
      H: [],
      V: [],
      gelap,
      w
    };
    const atas = Hg[0],
          bawah = Hg[Hg.length - 1],
          tinggi = bawah - atas;
    const V = [];

    for (let x = 0; x < w; x++) {
      let n = 0;

      for (let y = atas; y < bawah; y++) n += gelap[y * w + x];

      if (n / tinggi > 0.85) V.push(x);
    }

    return {
      H: Hg,
      V: kelompok(V),
      gelap,
      w
    };
  };

  const selKosong = (g, x0, y0, x1, y1) => {
    let n = 0,
        t = 0;

    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      n += g.gelap[y * g.w + x];
      t++;
    }

    return t === 0 || n / t < 0.002;
  };

  const potong = (src, x0, y0, x1, y1) => {
    const c = document.createElement('canvas');
    c.width = x1 - x0 + 40;
    c.height = y1 - y0 + 40;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, x0, y0, x1 - x0, y1 - y0, 20, 20, x1 - x0, y1 - y0);
    return c;
  };

  const angka = s => parseInt(String(s || '').replace(/[^0-9]/g, ''), 10) || 0;

  const susun = baris => {
    const items = [],
          kegiatan = {};
    let totalBaris = null;
    baris.forEach(c => {
      const rek = String(c[1] || '').replace(/\s+/g, ' ').trim();
      const prog = String(c[2] || '').replace(/\s+/g, '').trim();
      const uraian = String(c[3] || '').replace(/\s+/g, ' ').trim();

      if (/^5\s*[.,]/.test(rek)) {
        const kode = rek.replace(/,/g, '.').replace(/[^0-9.]+/g, '.').replace(/\.{2,}/g, '.').replace(/\.$/, '');
        const vol = angka(c[4]),
              harga = angka(c[6]),
              jml = angka(c[7]);
        const tw = [8, 9, 10, 11].map(i => angka(c[i]));
        const masalah = [];
        if (vol * harga !== jml) masalah.push('volume × harga ≠ jumlah');
        if (tw.reduce((a, b) => a + b, 0) !== jml) masalah.push('TW1–TW4 ≠ jumlah');
        if (!uraian) masalah.push('uraian kosong');
        items.push({
          kode_rekening: kode,
          program: prog,
          uraian,
          volume: vol,
          satuan: String(c[5] || '').replace(/[|]/g, '').replace(/\s+/g, ' ').trim(),
          harga_satuan: harga,
          total_jumlah: jml,
          tw,
          tahap_1: tw[0] + tw[1],
          tahap_2: tw[2] + tw[3],
          masalah
        });
      } else if (/^jumlah$/i.test(uraian)) {
        totalBaris = angka(c[7]);
      } else if (prog && uraian) {
        kegiatan[prog] = uraian;
      }
    });
    return {
      items,
      kegiatan,
      totalBaris
    };
  };

  const baca = async (pdf, onProgress) => {
    const T = await muatTesseract();
    onProgress && onProgress('Menyiapkan mesin OCR (unduhan pertama ±4 MB)...');
    const wTeks = await T.createWorker(['ind', 'eng'], 1, TESS_OPS);
    const wAngka = await T.createWorker('eng', 1, TESS_OPS);
    await wTeks.setParameters({
      tessedit_pageseg_mode: '6'
    });
    await wAngka.setParameters({
      tessedit_pageseg_mode: '6',
      tessedit_char_whitelist: '0123456789.'
    });
    const baris = [],
          peringatan = [];

    try {
      for (let p = 1; p <= pdf.numPages; p++) {
        onProgress && onProgress("Membaca halaman ".concat(p, " dari ").concat(pdf.numPages, "..."));
        const page = await pdf.getPage(p);
        const vp = page.getViewport({
          scale: SKALA
        });
        const cv = document.createElement('canvas');
        cv.width = Math.ceil(vp.width);
        cv.height = Math.ceil(vp.height);
        const ctx = cv.getContext('2d', {
          willReadFrequently: true
        });
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, cv.width, cv.height);
        await page.render({
          canvasContext: ctx,
          viewport: vp
        }).promise;
        const g = cariGrid(ctx.getImageData(0, 0, cv.width, cv.height));

        if (g.V.length !== KOLOM + 1) {
          if (g.H.length) peringatan.push("Halaman ".concat(p, ": susunan kolom tidak dikenali, dilewati."));
          continue;
        }

        const mulai = g.H[1] - g.H[0] > 100 ? 1 : 0;

          const y0 = pita[r] + 5,
                y1 = pita[r + 1] - 4;
          const tugas = [];

          for (let j = 0; j < KOLOM; j++) {
            const x0 = g.V[j] + 6,
                  x1 = g.V[j + 1] - 5;

            if (selKosong(g, x0, y0, x1, y1)) {
              tugas.push(Promise.resolve(''));
              continue;
            }

            const w = KOLOM_ANGKA.includes(j) ? wAngka : wTeks;
            tugas.push(w.recognize(potong(cv, x0, y0, x1, y1)).then(x => x.data.text.replace(/\s+/g, ' ').trim()));
          }

          baris.push(await Promise.all(tugas));
        }
      }
    } finally {
      await wTeks.terminate();
      await wAngka.terminate();
    }

    const hasil = susun(baris);
    hasil.peringatan = peringatan;
    return hasil;
  };

  return {
    baca,
    susun,
    cariGrid
  };
})();

const kecilkanGambar = (file, maks, jenis, kualitas) => new Promise((res, rej) => {
  if (!file || !/^image\//.test(file.type)) return rej(new Error('Pilih file gambar (PNG atau JPG).'));
  const fr = new FileReader();

  fr.onload = () => {
    const img = new Image();

    img.onload = () => {
      const s = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      const ctx = c.getContext('2d');

      if (jenis === 'image/jpeg') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
      }

      ctx.drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL(jenis, kualitas);
      if (jenis === 'image/png' && url.length > 250000) url = c.toDataURL('image/webp', 0.85);
      res(url);
    };

    img.onerror = () => rej(new Error('File gambar tidak bisa dibaca.'));

    img.src = fr.result;
  };

  fr.onerror = () => rej(new Error('File tidak bisa dibaca.'));

  fr.readAsDataURL(file);
